# Single-node Kafka (KRaft, no ZooKeeper, no Schema Registry) for the streaming
# export Kafka dev/integration rig. JSON Debezium envelopes need no registry
# (decision: streaming-debezium-envelope-contract), so this is broker-only.
#
#   make kafka-up      # start + wait for healthy
#   make kafka-it      # run the rig's black-box validator against it
#   make kafka-down    # stop + wipe volumes
#
# Auto-topic-creation is OFF on purpose: the rig creates each topic explicitly
# with a single partition (the global-`seq` ordering guarantee depends on it).
#
# Optional read-only web UI (kafka-ui), gated behind the `ui` compose profile so
# the default broker-only rig is unchanged — `make kafka-up` / `kafka-it` never
# start it. Bring it up with `make kafka-ui`, browse at http://localhost:8080.
#
# The UI runs inside the compose network, so it cannot use the host-facing
# `localhost:9092` advertised listener (under Docker Desktop, in-VM `localhost`
# is not the host). The broker therefore advertises a second in-network listener,
# `DOCKER://kafka:29092`, reachable by compose service name; the host-facing
# `PLAINTEXT://localhost:9092` listener the integration rig connects to is left
# exactly as it was.

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: fabexport-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Read-only web UI — opt-in via the `ui` profile (see header comment). Reaches
  # the broker over the compose network on its DOCKER listener (kafka:29092), not
  # the host-facing localhost:9092 the integration rig uses.
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: fabexport-kafka-ui
    profiles: ["ui"]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fabexport
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
