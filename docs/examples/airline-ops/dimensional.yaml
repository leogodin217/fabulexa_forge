# ExportConfig — airline-ops bundle, dimensional mode (star schema)
# ============================================================
# `fabulexa-forge export docs/examples/airline-ops/bundle docs/examples/airline-ops/dimensional.yaml <out> --fmt duckdb`
#
# Started from `fabulexa-forge init docs/examples/airline-ops/bundle`, then
# curated against the atlas into the star an airline ops-performance team would
# run. The scenario: a two-base carrier (CVG and SLC) flies a quarter of
# out-and-back legs after an eight-week burn-in; each leg assembles a tail, a
# captain, and a first officer from per-base pools; crew duty, sickness, days
# off, semi-monthly paydays, hires and resignations drive supply; faults
# ground tails; a March flu wave stresses the fabric. Since v3 the published
# departure is the leg's drawn 5-minute-grid slot plus a fixed 45-minute ops
# allowance — ops release starts at the slot instant, so a clean gate process
# pushes EARLY (61.7% of flown legs this emit, measured): negative delay vs
# plan is correct data, not a defect. v3 also types the cancellation cause
# (`cancel_reason`), counts consecutive duty days (`duty_days`, the
# 1-rest-day-in-7 legality rule), publishes per-city-pair block minutes on
# the destination, and ships the operating bases as entity rows with their
# IANA timezones.
#
# The bundle speaks the simulator's ontology: `actor`, `entity`, `resource`,
# `journey_instance`, `queue`, `tick_decision`. The atlas says what each is
# here — actor is BOTH populations (individual crew members AND flight legs,
# split by actor_type), entity is the airport catalogue PLUS the two
# operating bases (split by entity_type), resource is the tail fleet plus one
# duty station per crew member. Every output name below is the domain's, and
# every count in this log was measured against THIS emit.
#
# Curation decisions (the author judgment init can't make):
#
#   SPLIT    actor -> dim_crew_member (102 members) + the leg facts (2,737
#            legs). The two sub-types share nothing but `base`: crew carries
#            the HR surface (seat, role, shift, names, status,
#            sickness_episodes, duty_days), flight carries the schedule
#            surface (bank, scheduled departure, cancel reason, destination,
#            flight number). `sub_type_columns` partitions them; one
#            conformed table would be two unrelated populations glued on
#            NULLs.
#   SPLIT 2  the leg itself splits into dim_scheduled_leg + fact_flight_leg:
#            - dim_scheduled_leg (records__actor, filter flight): the leg as
#              SCHEDULED — leg code, flight number, base, bank, destination,
#              and the stamped published departure instant — keyed on the
#              elected presentation_id (LEG-nnnnn).
#            - fact_flight_leg (records__journey_instance, filter
#              journey_type=flight, 2,737 rows — exactly one per leg,
#              verified): the leg's operational OUTCOME (current_state at
#              tape's end: 1,992 completed, 119 cancelled, 611 still
#              published for operating days past the tape, 11 awaiting
#              their bank, 4 in motion). The v3 typed cancellation cause
#              is stamped on the leg ACTOR, so it rides dim_scheduled_leg
#              (a journey-sourced fact cannot look up a tracked actor
#              property — the lookup gate refuses non-constant sources).
#            Mechanically the dim is also the election's rendering surface:
#            dimensional renders an elected identity only through `fk` edges,
#            so every leg-grain fact reaches LEG-nnnnn by declaring
#            fk -> dim_scheduled_leg (via reference from journey grains, via
#            membership member_field: actor from the holders/waiters grains).
#            Without the dim, every member/lookup surface would be the
#            engine's record id.
#   KEYS     actor (both sub-types) elects presentation_id: staff codes
#            (CRW-nnnn) and leg codes (LEG-nnnnn) are the airline's own
#            minted identifiers — prefixed, offset, gapped counters,
#            emit-unique — so the dims key on them and every fk edge renders
#            them. The leg's reused flight number (FXnnn, one per
#            (bank, destination) pair — verified) is an ATTRIBUTE, not the
#            key. Beyond actor, no engine counter surfaces as a key:
#            dim_airport keys on airport_code and dim_operating_base on
#            base_code (both natural catalogue keys, verified unique), the
#            lifecycle timeline keys on its subject + process instead of
#            the engine's journey id, and dim_aircraft now keys on the
#            REGISTRATION — `tail_number` is declared temporal_class:
#            constant by the producer since airline-ops v3, and the key and
#            lookup gates accept a constant-class tracked property, so the
#            round-2 record_index surrogate (aircraft_key) is gone and
#            fact_tail_assignment carries the tail_number itself (a
#            same-record lookup at the hold grain). v3 also mints JRN-/DEC-
#            presentation keys for journey_instance / tick_decision; this
#            star still carries no journey or decision identity — the
#            timeline's subject + process key and fact_payday's
#            (crew_code, paid_at) key never needed one — but the source and
#            stream exports elect them.
#   SCHEDULE `scheduled_departure` is a sim-instant stamped by the producer
#            as a record property (BIGINT ns on the tape's clock). Since v3
#            it is the PUBLISHED departure: the leg's drawn 5-minute-grid
#            slot plus the fixed 45-minute ops allowance. Ops release (tail,
#            crew, boarding) starts at the SLOT instant, so a clean gate
#            process pushes ahead of the published time — 61.7% of flown
#            legs push early (measured; delays span -20 to +474 minutes) —
#            and negative delay vs plan is correct data. It lands on
#            dim_scheduled_leg through the prop-source form of `derived:
#            timestamp`, so it renders on the same ops clock as every other
#            instant; NULL on the 622 legs (611 published + 11 scheduled)
#            that had not drawn their slot by tape's end. Delay vs plan =
#            fact_lifecycle_state (process='flight', state='enroute_out')
#            entered_at minus this dim's scheduled_departure_at.
#   BLOCKS   v3 publishes per-city-pair block minutes on the destination
#            (sched_block_{cvg,slc}_{out,in}, 5-minute grid). They land on
#            dim_airport as four block-minute columns. Scheduled ARRIVAL is
#            scheduled_departure + the matching outbound block — a join by
#            design (pick the column by the leg's home_base), so no
#            pre-materialized arrival column exists here.
#   FACT     journey_instance's state timeline -> fact_lifecycle_state at
#            history_interval grain: 50,227 state-occupancy intervals over
#            3,039 journeys (16.5 versions/record — a timeline, not a
#            dimension, whatever record_roles says). One table, not four:
#            `filter` is records-grain-only, so a history_interval table
#            cannot be split by the owning record's journey_type — the
#            `process` column (flight / roster / sickness / employment)
#            carries the partition instead, and the README overlay shows the
#            per-process queries. The subject renders as TWO fk columns
#            (leg_code on flight rows, crew_code on the rest — each NULL
#            outside its population, by construction). The key is
#            [leg_code, crew_code, process, entered_at, state]: (subject,
#            process) identifies a journey 1:1 in this emit (verified — zero
#            duplicate (actor, journey_type) pairs), and at the carrier's
#            minute-grained clock a journey can pass through two states
#            within one displayed minute (114 such pairs measured), so the
#            state joins the key — zero duplicate key tuples verified. No
#            engine journey id is needed or carried — the v3 JRN- journey
#            codes exist, but this timeline's natural key never needed one
#            (the source and stream exports elect them). A state passed
#            through at a single instant leaves no row at all (the tape
#            records the instant's final value), so dispatching appears only
#            for the 253 legs that actually waited for a tail, and
#            `committing` only for the 38 weather scrubs administered there
#            — see the README overlay.
#   PAYDAY   the payday is instantaneous — and an instantaneous state never
#            lands in the state history (active -> payday -> active at one
#            instant collapses to no change), so the pay cadence would be
#            invisible in fact_lifecycle_state. Its only surface is the
#            tick_decision record the engine mints per payslip: 859
#            payslip_issued rows (semi-monthly) -> fact_payday, the crew
#            member resolved through the decision's journey reference
#            (journey_instance -> actor, a two-hop fk path). This is the one
#            tick_decision signal the timeline cannot carry — the rest stay
#            dropped (below).
#   DIM      dim_airport keys on airport_code (12 rows, unique — the
#            carrier's own catalogue key). Route class and schedule weight
#            are PER ORIGIN BASE — class is a fact of the
#            city pair, not the airport (SEA is long from CVG, medium from
#            SLC) — so the dim carries route_class_from_cvg /
#            route_class_from_slc and popularity_cvg / popularity_slc, and
#            since v3 the four published block-minute columns (see BLOCKS); a
#            leg's haul class is its destination's class from the leg's own
#            home_base. dim_scheduled_leg carries airport_code (a lookup
#            through the leg's immutable destination reference) as its join
#            surface to this dim.
#   DIM      dim_operating_base (entity/base, 2 rows — new in v3): the
#            carrier's operating bases with their IANA timezones. base_code
#            matches the CVG/SLC strings every home_base/base column
#            carries, so it is the conversion handle a consumer joins to
#            derive station-local time from the ops-clock instants. The run
#            itself has ONE civil clock (America/New_York; SLC's windows are
#            authored at a fixed -2h on that anchor) — the timezone column
#            is data to join on, never a second render clock.
#   DIM->T1  dim_aircraft (12 rows; keyed on the registration since v3 —
#            see KEYS). init proposed SCD-2 because `allocated`
#            (slots currently held) and `capacity` are history-tracked.
#            `allocated` is operational STATE (3,656 flips over 12 tails),
#            not a slowly changing attribute, and every tail's capacity is
#            the constant 1 (measured; the spare-tails capacity override
#            lives on a fork branch this trunk-only emit does not carry).
#            What remains — tail_number, base — is Type-1 reference data.
#            The per-hold detail `allocated` summarizes is already in
#            fact_tail_assignment at its own grain, so the flip timeline is
#            dropped, not lost.
#   SCD-2    dim_crew_member, windowed on the KIND's history — and since v3
#            that history includes `duty_days`, the consecutive-duty-day
#            counter behind the 1-rest-day-in-7 legality rule (<= 5 to
#            muster; a day off resets it). Version boundaries cut at every
#            tracked change of the record, so the counter's daily writes
#            version the dim: 8,867 versions over 102 members (verified =
#            the kind's distinct (member, instant) change pairs; zero
#            members carry two change instants inside one displayed minute,
#            so [crew_code, valid_from] stays unique at the minute grain).
#            duty_days is therefore PROJECTED — hiding it would leave
#            thousands of versions differing in no visible column — and the
#            as-of join reads a member's legality position at any instant.
#            `status` (the HR lifecycle the atlas itself calls SCD-2) and
#            `sickness_episodes` (episodes to date) stay projected as
#            before. `seat` (captain / fo) is the member's rating —
#            constant per member, the disjointness witness that lets one
#            leg seize a captain and a first officer from the same preempt
#            pool; `shift` (early / late) is the report window the roster
#            musters the member in. The members are named individuals (84
#            on the payroll when the data opens, 18 mid-run hires from the
#            projection lexicon); first/last/full name all land here.
#   DROPPED  crew `constitution` (robust/typical/fragile): the generator's
#            sickness-propensity parameter. Attaching a frailty score to a
#            named crew member is the same governance problem nhs's
#            quality_rating poses; the OBSERVED sickness record (episodes,
#            sick intervals) stays, the generator input goes.
#   DROPPED  fact_leg_destination (the round-1 bridge from bound_roles role
#            `dest`): the destination lives on the flight actor as an
#            immutable reference property — the route is the leg's identity
#            — so the binding duplicates what dim_scheduled_leg already
#            carries as airport_code. The 2,737 dest bindings (verified
#            still one per leg) stay in the emit; nothing joins them here.
#   NO DIM   resource/duty_station (93 rows, one per crew member): it is the
#            engine's availability server for the member, not a business
#            entity — its `owner` reference is the HR<->ops bridge, and every
#            fact that lands on a station resolves OWNER instead, via
#            fk path [prop__owner] straight to dim_crew_member. The
#            station's immutable `seat` does surface — fact_leg_crew looks
#            it up as the seat a hold fills. No station table, no station
#            key, nothing dangles.
#   NO DIM   queue (4 rows): per-base scheduler pools. The RECORDS are
#            mechanism, but membership__queue__waiters is the delay data this
#            scenario exists to produce — so the kind is left undeclared (NOT
#            excluded: an `exclude` guard would take the waiters table with
#            it) and the waits become the two wait facts below.
#   DROPPED  tick_decision (11,704 records), except the payslips (see
#            PAYDAY). Since v3 every decision carries a JSON `context`
#            payload, but each one MIRRORS a typed surface this star already
#            carries (verified: the cancel decisions' context.reason matches
#            the leg's typed cancel_reason on all 119 rows), and every other
#            decision_type mirrors a state entry the timeline carries at
#            better grain (duty_started 7,709 = `on_duty` entries;
#            flight_planned 2,737 = the schedule entries; sickness_episode
#            201 = `sick`; cancelled_crew 81 + cancelled_weather 38 = the
#            `cancelled` close-outs, with the reason on the leg's typed
#            column; fault_hold 49; reserve_callout_captain 7 +
#            reserve_callout_fo 5 — the filled callouts are fact_leg_crew's
#            reserve rows; hire_completed 18 = the onboarding entries). Key
#            on typed columns, never the JSON. Left undeclared, not
#            excluded — its dest-only bindings table is engine-redundant
#            here too.
#   REASONS  v3 ends the round-2 "catalogue awaiting coded events" state:
#            the two author-maintained reference catalogues are now KEYED
#            from the emit's own typed columns, config-only.
#            - dim_scheduled_leg.cancellation_code: a value_map over the
#              leg's typed cancel_reason onto dim_cancellation_reason's DOT
#              letters — weather -> B, the six crew-supply causes -> A
#              (carrier-controllable). The raw reason rides beside it. It
#              sits on the leg record, not fact_flight_leg, because the
#              typed cause is an ACTOR property and the journey-sourced
#              fact cannot look up a tracked (non-constant) source.
#            - fact_leg_assembly_wait.delay_code: a value_map over the
#              wait's acquired-rule onto dim_delay_reason's IATA codes —
#              tail wait -> 93 (aircraft rotation), lineholder captain/fo
#              waits -> 95 (awaiting flight deck crew), reserve callouts ->
#              64 (crew shortage / standby).
#            Both maps are author-declared code assignments over declared
#            value domains (enum_domains / the claim-rule vocabulary), so
#            every code traces to a base value through the map.
#   BRIDGES  the leg's build-up is membership data, not actor properties:
#            - fact_tail_assignment: holders claim tail_ready (2,077 holds;
#              zero legs hold two tails — verified) -> dim_aircraft via the
#              registration (a same-record lookup — see KEYS). Block +
#              turnaround (+ repair) is held_from..released_at.
#            - fact_leg_crew, at SEAT-HOLD grain: holders claims
#              captain_aboard + crew_complete (the two boarding seizes,
#              2,033 + 2,003) + captain_recovered + fo_recovered (reserve
#              callouts after a mid-block loss, 6 + 1) -> dim_crew_member
#              via the station's owner. One row per seat filled, so a fully
#              crewed leg has two rows; `seat` (looked up from the station)
#              carries the partition, the same way `process` partitions the
#              timeline. A seat dimension would be two attribute-less rows;
#              the per-seat grain is the grain the holds actually have.
#            bound_roles' `tail` / `captain_seat` / `fo_seat` roles duplicate
#            the holders spans and are dropped; `closed_sign` /
#            `my_station` / `new_station` are roster mechanism.
#   WAITS    membership__queue__waiters (1,887) splits cleanly on
#            elem__on_acquired_rule into two different business facts:
#            - fact_leg_assembly_wait (456): a LEG waiting for a tail (253),
#              a captain (111), a first officer (87), or a reserve callout
#              (1 + 4). Most legs assemble without queuing — the everyday
#              delay mass lives in the boarding/taxi interval, and these
#              rows are the scarce-resource tail of the distribution.
#            - fact_duty_release_wait (1,431): a CREW MEMBER queuing to
#              reclaim their own station at duty end behind an airborne leg —
#              duty overrun.
#            Splitting keeps each fact's waiter population one sub-type, so
#            the member id column is one identity kind per table.
#   FACT     fact_crew_presence: membership__actor__presence (15,814) — the
#            machine-owned duty/sickness occupancy the atlas points at from
#            the crew sub-type (on_duty 7,709, mustering 7,904, sick 201).
#            value_map renders the claim ids as on_duty / sick / mustering.
#   DOCS     every column carries an author `description:` so the companion
#            README reads in the carrier's voice, not the simulator's.
#
# TIME: the `rebase:` block declares the carrier's operations clock. The
# emit's own anchor is 2026-01-05T00:00:00 UTC and the tape is 146 days: an
# eight-week burn-in (so the quarter opens with crew histories, sickness
# records and paydays already in motion — no cold start) and then the
# published quarter from 2026-03-02. The carrier runs on Eastern time, so
# the origin is repinned to local midnight in America/New_York, and every
# instant column (and the SCD-2 window bounds) elects `timestamptz`: each
# value carries its real UTC offset — -05:00 (EST) until the 2026-03-08 DST
# transition, -04:00 (EDT) after it — the offset pattern a real US ops
# system shows; a frozen year-round offset was itself a synthetic tell.
# `grain: minute` truncates every rendered timestamp (and the SCD-2 window
# bounds) to whole minutes: real ops data is minute-grained at best, and the
# microsecond surface was round-1 QA's fastest synthetic tell. Raw sim-time
# ordering is untouched, and the date keys stay anchor-zone-local — the ops
# clock's calendar day; a station-local date derives in SQL from the
# upstream per-base timezone property where a consumer needs one.
# CALENDAR: dim_date spans the whole tape's months, 2026-01-01 ..
# 2026-05-31, so the burn-in weeks date-join like the quarter and the flu
# wave and payday cadence read by week/day off the calendar. Every instant
# carries a date key beside it, named for its stem.
# SUPPLEMENTS: two author-maintained reference catalogues ship beside the
# star — dim_delay_reason (IATA-style delay codes) and
# dim_cancellation_reason (DOT-style cancellation categories), loaded from
# CSVs beside this config and recorded in the manifest as author-supplied
# (the catalogue rows trace to no emit value). Since v3 both are KEYED from
# the facts: dim_scheduled_leg.cancellation_code and
# fact_leg_assembly_wait.delay_code land on them through author-declared
# value maps over the emit's typed columns (see REASONS).

mode: dimensional

readme_overlay: README-overlay.md

rebase:
  base_date: 2026-01-05
  timezone: America/New_York
  grain: minute

supplements:
  - name: dim_delay_reason
    description: "The carrier's delay-code catalogue (IATA-style numeric codes, grouped): the reference list dispatchers code delays against. Author-maintained reference data; fact_leg_assembly_wait.delay_code joins it."
    columns:
      delay_code: VARCHAR
      delay_group: VARCHAR
      description: VARCHAR
    file: delay_reason.csv
    descriptions:
      delay_code: "Two-digit delay code, IATA numbering."
      delay_group: "The code's group: passenger, ramp, technical, flight_ops_crew, weather, air_traffic, or reactionary."
      description: "What the code means, as the ops manual words it."
  - name: dim_cancellation_reason
    description: "The carrier's cancellation-reason categories (DOT-style letter codes). Author-maintained reference data; dim_scheduled_leg.cancellation_code joins it."
    columns:
      cancellation_code: VARCHAR
      label: VARCHAR
      description: VARCHAR
    file: cancellation_reason.csv
    descriptions:
      cancellation_code: "Single-letter cancellation category, DOT reporting convention."
      label: "Short name of the category."
      description: "What the category covers."

date_dimension:
  from: "2026-01-01"
  to: "2026-05-31"

keys:
  actor:
    crew: presentation_id
    flight: presentation_id

dimensional:
  tables:
    # --- dim: airport catalogue (entity/destination) — Type-1 reference,
    #     keyed on the carrier's own airport code. Haul class and schedule
    #     weight are PER ORIGIN BASE since v2: a leg reads the class column
    #     for its own home_base. ---
    - name: dim_airport
      role: dim
      scd: type1
      description: "One row per airport the carrier serves — the destination catalogue legs plan against. Route class and demand weighting are facts of the city pair, so each carries one column per origin base: a leg's haul class is its destination's class from the leg's home_base."
      source:
        grain: records
        kind: entity
        filter: {prop__entity_type: destination}
      key: [airport_code]
      columns:
        - name: airport_code
          from: prop__code
          description: "IATA three-letter airport code; the catalogue key dim_scheduled_leg.airport_code joins."
        - name: city
          from: prop__city
          description: "City the airport serves."
        - name: route_class_from_cvg
          from: prop__class_from_cvg
          description: "Haul class of the CVG service to this airport: short, medium, or long. Class is a fact of the city pair — SEA is long from CVG but medium from SLC."
        - name: route_class_from_slc
          from: prop__class_from_slc
          description: "Haul class of the SLC service to this airport: short, medium, or long."
        - name: popularity_cvg
          from: prop__popularity_cvg
          description: "Relative demand weighting used when CVG legs plan a destination."
        - name: popularity_slc
          from: prop__popularity_slc
          description: "Relative demand weighting used when SLC legs plan a destination."
        - name: sched_block_from_cvg
          from: prop__sched_block_cvg_out
          description: "Published block minutes CVG -> this airport, on the 5-minute grid. Scheduled arrival of a CVG leg's outbound = its scheduled_departure_at plus this column."
        - name: sched_block_to_cvg
          from: prop__sched_block_cvg_in
          description: "Published block minutes this airport -> CVG, on the 5-minute grid."
        - name: sched_block_from_slc
          from: prop__sched_block_slc_out
          description: "Published block minutes SLC -> this airport, on the 5-minute grid. Scheduled arrival of an SLC leg's outbound = its scheduled_departure_at plus this column."
        - name: sched_block_to_slc
          from: prop__sched_block_slc_in
          description: "Published block minutes this airport -> SLC, on the 5-minute grid."

    # --- dim: operating bases (entity/base, 2 rows — new in v3). The
    #     per-base IANA timezone every home_base/base string joins to for
    #     station-local time. Data to join on, not a render clock. ---
    - name: dim_operating_base
      role: dim
      scd: type1
      description: "One row per operating base (crew domicile + hub station): CVG and SLC, each with its IANA timezone. Every home_base/base column joins base_code; the timezone is the conversion handle for deriving station-local time from the ops-clock instants."
      source:
        grain: records
        kind: entity
        filter: {prop__entity_type: base}
      key: [base_code]
      columns:
        - name: base_code
          from: prop__code
          description: "IATA code of the base (CVG or SLC); the string every home_base/base column carries."
        - name: timezone
          from: prop__timezone
          description: "The base's IANA timezone (America/New_York for CVG, America/Denver for SLC). All exported instants are on the carrier's single ops clock; convert with this zone for station-local time."

    # --- dim: tail fleet (resource/aircraft) — Type-1; allocated/capacity
    #     are operational state, carried at hold grain in
    #     fact_tail_assignment. Keyed on the registration since v3:
    #     tail_number is declared temporal_class: constant upstream, which
    #     the key gate accepts (see KEYS). ---
    - name: dim_aircraft
      role: dim
      scd: type1
      description: "One row per tail in the fleet — six based at each of the two stations — keyed on the registration."
      source:
        grain: records
        kind: resource
        filter: {prop__resource_type: aircraft}
      key: [tail_number]
      columns:
        - name: tail_number
          from: prop__tail_number
          description: "The aircraft's registration (tail number); fact_tail_assignment.tail_number joins it."
        - name: home_base
          from: prop__base
          description: "Station the tail is based at: CVG or SLC."

    # --- dim: crew member (actor/crew) — SCD-2 on the HR lifecycle ---
    - name: dim_crew_member
      role: dim
      scd: type2
      description: "One row per version of a crew member — a named individual on the payroll, rated for one seat (captain or first officer). Versions window on the member's tracked history: employment status changes, sickness episodes, and the consecutive-duty-day counter's daily writes, so the dim reads like the HR system's audit of the crew record; join as-of on [valid_from, valid_to)."
      source:
        grain: records
        kind: actor
        filter: {prop__actor_type: crew}
      key: [crew_code, valid_from]
      columns:
        - name: crew_code
          from: presentation_id
          description: "The crew member's staff code (CRW-nnnn)."
        - name: first_name
          from: prop__first_name
          description: "The member's given name."
        - name: last_name
          from: prop__last_name
          description: "The member's family name."
        - name: full_name
          from: prop__full_name
          description: "The member's display name as the roster prints it."
        - name: home_base
          from: prop__base
          description: "Station the member reports at: CVG or SLC."
        - name: seat
          from: prop__seat
          description: "The seat the member is rated for: captain or fo (first officer). Constant for the member's whole career."
        - name: crew_role
          from: prop__role
          description: "Roster role: lineholder (flies the published line) or reserve (called out when a leg loses a crew member)."
        - name: report_shift
          from: prop__shift
          description: "The report window the member musters in: early or late."
        - name: employment_status
          from: prop__status
          description: "HR lifecycle status as of this version: onboarding, active, notice, or resigned."
        - name: sickness_episodes_to_date
          from: prop__sickness_episodes
          description: "Sickness episodes recorded against the member up to this version."
        - name: consecutive_duty_days
          from: prop__duty_days
          description: "Consecutive duty days since the member's last rostered day off, as of this version — the 1-rest-day-in-7 legality counter: mustering requires five or fewer and increments it; a day off resets it to zero."
        - name: valid_from
          derived: {scd_window: {bound: valid_from, as: timestamptz}}
          description: "When this version of the member became current."
        - name: valid_to
          derived: {scd_window: {bound: valid_to, as: timestamptz}}
          description: "When this version was superseded; NULL on the current version."

    # --- dim: the published schedule entry (actor/flight, 2,737 rows) — the
    #     leg as SCHEDULED (leg code, flight number, base, bank, destination,
    #     scheduled departure): the plan every leg-grain fact FKs to. What
    #     HAPPENED to the leg is fact, below. ---
    - name: dim_scheduled_leg
      role: dim
      scd: type1
      description: "One row per leg: its leg code, published flight number, base, departure bank, planned destination, the published departure instant, and — on scrubbed legs — the typed cancellation cause. The operational facts (outcome, state timeline, assignments, waits) all join this dim on leg_code; haul class and block minutes join on through dim_airport; delay vs plan is any operational instant measured against scheduled_departure_at."
      source:
        grain: records
        kind: actor
        filter: {prop__actor_type: flight}
      key: [leg_code]
      columns:
        - name: leg_code
          from: presentation_id
          description: "The leg's operational code (LEG-nnnnn), unique for the quarter; the join surface every leg-grain fact shares."
        - name: flight_number
          from: prop__flight_number
          description: "The leg's published flight number (FXnnn). Reused across the quarter — one number per (departure bank, destination) pair — so it names the service, not the individual leg; leg_code does that."
        - name: route_number
          from: prop__route_number
          description: "The carrier's route number for the destination; the am and pm services to the same airport share it."
        - name: airport_code
          lookup: {to: entity, property: code}
          description: "The leg's planned destination, drawn when the leg entered the schedule; joins dim_airport.airport_code."
        - name: home_base
          from: prop__base
          description: "Station the rotation departs from and returns to: CVG or SLC."
        - name: departure_bank
          from: prop__bank
          description: "Which departure bank the leg is scheduled in: am or pm."
        - name: scheduled_departure_at
          derived: {timestamp: {source: prop__scheduled_departure, as: timestamptz}}
          description: "The leg's PUBLISHED departure instant: its drawn 5-minute-grid slot plus the fixed 45-minute ops allowance. Ops release starts at the slot, so most flown legs push ahead of this time — negative pushback delay is normal, not an error. Delay = the enroute_out entry in fact_lifecycle_state minus this column; scheduled arrival = this column plus the destination's outbound block minutes from the leg's home_base (dim_airport.sched_block_from_*). NULL on a leg that had not drawn its slot by quarter end."
        - name: scheduled_departure_date_key
          date_ref: {source: prop__scheduled_departure}
          description: "dim_date.date_key of the published departure day; NULL on a leg that had not drawn its slot by quarter end."
        - name: cancel_reason
          from: prop__cancel_reason
          description: "Why the leg was scrubbed: weather, no_captain, no_fo, captain_sick, fo_sick, no_reserve_captain, or no_reserve_fo — the upstream typed cancellation cause, stamped on the leg record at the scrub. NULL on every leg that was not cancelled (fact_flight_leg.status says whether)."
        - name: cancellation_code
          derived:
            value_map:
              from: prop__cancel_reason
              map:
                weather: B
                no_captain: A
                no_fo: A
                captain_sick: A
                fo_sick: A
                no_reserve_captain: A
                no_reserve_fo: A
          description: "DOT cancellation category for the scrub; joins dim_cancellation_reason.cancellation_code. Weather scrubs code B (weather); the six crew-supply causes code A (within the carrier's control). NULL on every leg that was not cancelled."

    # --- fact: flight leg operation — grain: one leg (2,737 rows). Built from
    #     the leg's lifecycle record: it carries the outcome the schedule
    #     entry does not. ---
    - name: fact_flight_leg
      role: fact
      description: "One row per scheduled leg: its operational outcome, from entering the published schedule to completion or cancellation."
      source:
        grain: records
        kind: journey_instance
        filter: {prop__journey_type: flight}
      key: [leg_code]
      columns:
        - name: leg_code
          fk: {to: dim_scheduled_leg, via: reference}
          description: "The leg this row closes out; joins dim_scheduled_leg.leg_code."
        - name: status
          from: prop__current_state
          description: "The leg's lifecycle position at the end of the quarter: completed or cancelled for finished legs; published or scheduled for legs whose operating day lies past the quarter; the in-flight stage (slotting, committing, dispatching, crewing_captain, crewing_fo, boarding, enroute_out, outstation_turn, enroute_in, turnaround, fault_hold) for the few in motion. The cancellation CAUSE is dim_scheduled_leg.cancel_reason / cancellation_code — the typed reason lives on the leg record."
        - name: entered_schedule_at
          derived: {timestamp: {source: created_sim_time, as: timestamptz}}
          description: "When the leg entered the published schedule."
        - name: entered_schedule_date_key
          date_ref: {source: created_sim_time}
          description: "dim_date.date_key of the day the leg entered the published schedule."
        - name: closed_at
          derived: {timestamp: {source: deactivated_at, as: timestamptz}}
          description: "When the leg closed out (completed or cancelled); NULL for legs still open at quarter end — published, scheduled, or in motion."
        - name: closed_date_key
          date_ref: {source: deactivated_at}
          description: "dim_date.date_key of the day the leg closed out; NULL for legs still open at quarter end."

    # --- fact: lifecycle state timeline (history_interval grain, 50,227 rows).
    #     All four processes in one table — `filter` is records-grain-only, so
    #     the `process` column carries the partition. Keyed on subject +
    #     process + entry instant + state: (subject, process) identifies a
    #     journey 1:1 in this emit (verified), and a journey can pass two
    #     states inside one displayed minute (114 pairs measured), so the
    #     state joins the key. Pushback delay = enroute_out entered_at minus
    #     the dim's scheduled_departure_at. ---
    - name: fact_lifecycle_state
      role: fact
      description: "One row per state occupancy of a leg or crew-member lifecycle: the flight process (scheduled through completed/cancelled), and the crew's roster, sickness, and employment processes. Filter on `process` first; exactly one of leg_code / crew_code is set per row, and (leg_code or crew_code, process, entered_at, state) identifies the row — a leg can pass through two states within one displayed minute. A state entered and left at a single instant leaves no row; the instantaneous payday lives in fact_payday."
      source:
        grain: history_interval
        kind: journey_instance
        property: current_state
      key: [leg_code, crew_code, process, entered_at, state]
      columns:
        - name: leg_code
          fk: {to: dim_scheduled_leg, via: reference}
          description: "The leg this interval belongs to, on flight-process rows; NULL on roster, sickness, and employment rows. Joins dim_scheduled_leg.leg_code."
        - name: crew_code
          fk: {to: dim_crew_member, via: reference}
          description: "The crew member this interval belongs to, on roster, sickness, and employment rows; NULL on flight-process rows. Joins dim_crew_member.crew_code."
        - name: process
          lookup: {property: journey_type}
          description: "Which lifecycle this interval belongs to: flight, roster, sickness, or employment."
        - name: state
          from: value
          description: "The state occupied: e.g. boarding, enroute_out, outstation_turn, enroute_in for flight; on_duty, off_duty, day_off, pulled_back for roster; well, sick for sickness; active, serving_notice for employment."
        - name: entered_at
          derived: {timestamp: {source: sim_time, as: timestamptz}}
          description: "When the subject entered this state."
        - name: entered_date_key
          date_ref: {source: sim_time}
          description: "dim_date.date_key of the day the subject entered this state."
        - name: exited_at
          derived: {timestamp: {source: lead_sim_time, as: timestamptz}}
          description: "When the subject left this state; NULL on the state it was still in at quarter end."
        - name: exited_date_key
          date_ref: {source: lead_sim_time}
          description: "dim_date.date_key of the day the subject left this state; NULL on the state it was still in at quarter end."

    # --- fact: payday (records__tick_decision, filter payslip_issued — 859
    #     rows). The pay cadence's ONLY surface: the instantaneous payday
    #     state collapses out of the history, so the engine's payslip
    #     decision record carries it. The member resolves through the
    #     decision's journey reference (two reference hops). ---
    - name: fact_payday
      role: fact
      description: "One row per payslip issued: the member's pay packet landing on the semi-monthly payday, jittered per member through the morning rather than at one synchronized instant. The payday is instantaneous, so it carries an instant, not an interval."
      source:
        grain: records
        kind: tick_decision
        filter: {prop__decision_type: payslip_issued}
      key: [crew_code, paid_at]
      columns:
        - name: crew_code
          fk: {to: dim_crew_member, via: reference, path: [prop__journey_instance, prop__actor]}
          description: "The member paid; joins dim_crew_member.crew_code."
        - name: paid_at
          derived: {timestamp: {source: created_sim_time, as: timestamptz}}
          description: "When the pay packet landed."
        - name: paid_date_key
          date_ref: {source: created_sim_time}
          description: "dim_date.date_key of the payday."

    # --- fact: tail assignment (holders, claim tail_ready — 2,077 rows).
    #     The hold runs from dispatch grant through turnaround (and repair on a
    #     fault), so its span is tail utilisation. ---
    - name: fact_tail_assignment
      role: fact
      description: "One row per tail hold by a leg, from the dispatch grant through the end of the turnaround (including any fault repair)."
      source:
        grain: membership
        kind: resource
        property: holders
        where: {elem__claim: "flight:dispatching:tail_ready"}
      key: [leg_code]
      columns:
        - name: leg_code
          fk: {to: dim_scheduled_leg, via: membership, member_field: actor}
          description: "The leg holding the tail; joins dim_scheduled_leg.leg_code."
        - name: tail_number
          lookup: {property: tail_number}
          description: "The registration of the tail assigned to the leg; joins dim_aircraft.tail_number."
        - name: assigned_at
          derived: {timestamp: {source: joined_sim_time, as: timestamptz}}
          description: "When the tail was granted to the leg at dispatch."
        - name: assigned_date_key
          date_ref: {source: joined_sim_time}
          description: "dim_date.date_key of the day the tail was granted to the leg."
        - name: released_at
          derived: {timestamp: {source: left_sim_time, as: timestamptz}}
          description: "When the tail was released after the turnaround (or after repair); NULL if the leg still held it at quarter end."
        - name: released_date_key
          date_ref: {source: left_sim_time}
          description: "dim_date.date_key of the day the tail was released."

    # --- fact: leg crew assignment at SEAT-HOLD grain (holders, the four
    #     flight-side station claims — 2,033 + 2,003 boardings, 6 + 1
    #     reserve callouts). One row per seat filled: a fully crewed leg has a
    #     captain row and a first-officer row. The held resource is the crew
    #     member's duty STATION; the member is its owner, resolved via
    #     fk path [prop__owner], and the station's immutable `seat` says
    #     which seat the hold fills. ---
    - name: fact_leg_crew
      role: fact
      description: "One row per seat hold by a leg — the captain seat and the first-officer seat each from boarding (or reserve callout) through release at the end of the block. A fully crewed leg has two rows; filter or group on `seat`."
      source:
        grain: membership
        kind: resource
        property: holders
        where:
          elem__claim:
            - "flight:crewing_captain:captain_aboard"
            - "flight:crewing_fo:crew_complete"
            - "flight:recover_captain:captain_recovered"
            - "flight:recover_fo:fo_recovered"
      key: [leg_code, seat, boarded_at]
      columns:
        - name: leg_code
          fk: {to: dim_scheduled_leg, via: membership, member_field: actor}
          description: "The leg holding the seat; joins dim_scheduled_leg.leg_code. A leg that lost a crew member mid-block and recovered carries an extra row for that seat."
        - name: crew_code
          fk: {to: dim_crew_member, via: reference, path: [prop__owner]}
          description: "The crew member aboard, resolved through their duty station's owner; joins dim_crew_member.crew_code."
        - name: seat
          lookup: {property: seat}
          description: "The seat this hold fills: captain or fo (first officer) — the held station's immutable seat."
        - name: assignment_type
          derived:
            value_map:
              from: elem__claim
              map:
                "flight:crewing_captain:captain_aboard": scheduled
                "flight:crewing_fo:crew_complete": scheduled
                "flight:recover_captain:captain_recovered": reserve_callout
                "flight:recover_fo:fo_recovered": reserve_callout
          description: "How the member came aboard: scheduled boarding, or a reserve callout after the seat's original member was pulled mid-block."
        - name: boarded_at
          derived: {timestamp: {source: joined_sim_time, as: timestamptz}}
          description: "When the member came aboard the leg."
        - name: boarded_date_key
          date_ref: {source: joined_sim_time}
          description: "dim_date.date_key of the day the member came aboard."
        - name: released_at
          derived: {timestamp: {source: left_sim_time, as: timestamptz}}
          description: "When the member was released at the end of the block — or pulled mid-block by sickness; NULL if still aboard at quarter end."
        - name: released_date_key
          date_ref: {source: left_sim_time}
          description: "dim_date.date_key of the day the member was released."

    # --- fact: leg assembly waits (waiters, the leg-side rules — 456 rows).
    #     Every interval a leg spent queued for a tail, for a captain, for a
    #     first officer, or for a reserve callout. Since v2 most legs
    #     assemble without queuing — these rows are the crew-shortage tail
    #     of the delay distribution; the everyday 5-30 minute mass is the
    #     boarding interval in fact_lifecycle_state. ---
    - name: fact_leg_assembly_wait
      role: fact
      description: "One row per interval a leg spent waiting in a base pool queue — for a free tail at dispatch, for a lineholder captain or first officer while boarding, or for a reserve member after losing one. These queue waits are the scarce-resource component of pushback delay; a leg that assembled without queuing has no row here."
      source:
        grain: membership
        kind: queue
        property: waiters
        where:
          elem__on_acquired_rule:
            - "flight:dispatching:tail_ready"
            - "flight:crewing_captain:captain_aboard"
            - "flight:crewing_fo:crew_complete"
            - "flight:recover_captain:captain_recovered"
            - "flight:recover_fo:fo_recovered"
      key: [leg_code, queued_from, waiting_for]
      columns:
        - name: leg_code
          fk: {to: dim_scheduled_leg, via: membership, member_field: actor}
          description: "The waiting leg; joins dim_scheduled_leg.leg_code."
        - name: base
          lookup: {property: base}
          description: "Which base pool the leg was queued at: CVG or SLC."
        - name: waiting_for
          derived:
            value_map:
              from: elem__on_acquired_rule
              map:
                "flight:dispatching:tail_ready": tail
                "flight:crewing_captain:captain_aboard": captain
                "flight:crewing_fo:crew_complete": first_officer
                "flight:recover_captain:captain_recovered": reserve_captain
                "flight:recover_fo:fo_recovered": reserve_fo
          description: "What the leg was waiting for: a free tail, a lineholder captain or first officer, or a reserve callout for the lost seat."
        - name: delay_code
          derived:
            value_map:
              from: elem__on_acquired_rule
              map:
                "flight:dispatching:tail_ready": "93"
                "flight:crewing_captain:captain_aboard": "95"
                "flight:crewing_fo:crew_complete": "95"
                "flight:recover_captain:captain_recovered": "64"
                "flight:recover_fo:fo_recovered": "64"
          description: "IATA delay code for the wait's cause; joins dim_delay_reason.delay_code. A tail wait codes 93 (aircraft rotation: late arrival from another flight); a lineholder captain/first-officer wait codes 95 (awaiting flight deck crew from another flight); a reserve callout codes 64 (flight deck crew shortage: sickness or awaiting standby)."
        - name: queued_from
          derived: {timestamp: {source: joined_sim_time, as: timestamptz}}
          description: "When the leg joined the queue."
        - name: queued_date_key
          date_ref: {source: joined_sim_time}
          description: "dim_date.date_key of the day the leg joined the queue."
        - name: granted_at
          derived: {timestamp: {source: left_sim_time, as: timestamptz}}
          description: "When the wait ended (grant, or the leg gave up and cancelled); NULL if still queued at quarter end."
        - name: granted_date_key
          date_ref: {source: left_sim_time}
          description: "dim_date.date_key of the day the wait ended."

    # --- fact: duty release waits (waiters, the roster-side rule — 1,431
    #     rows). A crew member queuing to reclaim their own station at duty
    #     end behind an airborne leg: duty overrun. ---
    - name: fact_duty_release_wait
      role: fact
      description: "One row per interval a crew member spent queued to reclaim their own duty station at duty end — the station was still held by an airborne leg, so this wait is duty overrun."
      source:
        grain: membership
        kind: queue
        property: waiters
        where: {elem__on_acquired_rule: "roster:closing:closed"}
      key: [crew_code, queued_from]
      columns:
        - name: crew_code
          fk: {to: dim_crew_member, via: membership, member_field: actor}
          description: "The member waiting to come off duty; joins dim_crew_member.crew_code."
        - name: base
          lookup: {property: base}
          description: "Which base the member was reclaiming their station at: CVG or SLC."
        - name: queued_from
          derived: {timestamp: {source: joined_sim_time, as: timestamptz}}
          description: "When the member's duty day ended and they began waiting to stand down."
        - name: queued_date_key
          date_ref: {source: joined_sim_time}
          description: "dim_date.date_key of the day the wait began."
        - name: released_at
          derived: {timestamp: {source: left_sim_time, as: timestamptz}}
          description: "When the member reclaimed their station and stood down; NULL if still waiting at quarter end."
        - name: released_date_key
          date_ref: {source: left_sim_time}
          description: "dim_date.date_key of the day the member stood down."

    # --- fact: crew presence (membership actor.presence — 15,814 rows).
    #     The machine-owned duty/sickness occupancy: duty days, sick episodes,
    #     and muster waits. ---
    - name: fact_crew_presence
      role: fact
      description: "One row per interval a crew member's presence was claimed: a duty day, a sickness episode (which stands the member down wherever they are), or a wait at muster before the duty grant."
      source:
        grain: membership
        kind: actor
        property: presence
      key: [crew_code, started_at, presence]
      columns:
        - name: crew_code
          fk: {to: dim_crew_member, via: reference}
          description: "The member whose presence this interval claims; joins dim_crew_member.crew_code."
        - name: presence
          derived:
            value_map:
              from: elem__claim
              map:
                "roster:on_duty:occupy": on_duty
                "sickness:sick:occupy": sick
                "roster:mustering:occupy": mustering
          description: "What claimed the member: a duty day (on_duty), a sickness episode (sick), or the muster report before the duty grant (mustering)."
        - name: claim_status
          from: elem__status
          description: "Whether the claim was occupying the member or still waiting for them (a muster report queued behind a sick episode)."
        - name: started_at
          derived: {timestamp: {source: joined_sim_time, as: timestamptz}}
          description: "When the claim began."
        - name: started_date_key
          date_ref: {source: joined_sim_time}
          description: "dim_date.date_key of the day the claim began."
        - name: ended_at
          derived: {timestamp: {source: left_sim_time, as: timestamptz}}
          description: "When the claim ended; NULL if still open at quarter end."
        - name: ended_date_key
          date_ref: {source: left_sim_time}
          description: "dim_date.date_key of the day the claim ended."
