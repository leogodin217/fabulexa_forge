# ExportConfig — airline-ops bundle, source mode (operational OLTP tables)
# ============================================================
# `fabulexa-forge export docs/examples/airline-ops/bundle docs/examples/airline-ops/source.yaml <out> --fmt duckdb`
#
# Source mode DECLARES its own output shape (docs/architecture/source.md):
# each `tables[]` entry is a `state` table (current-state, one row per record)
# over a `kind:`, or a `junction` over a `membership:` reference. History is
# opt-in through the single polymorphic `events:` log.
#
# The target: the carrier's own ops + crew-management database. The mapping
# from the engine's ontology — read from the atlas and `sub_type_columns`,
# measured against THIS emit:
#
#   actor/crew          -> crew_member      (102 — named individual crew on
#                                            payroll, each rated captain/fo;
#                                            since v3 carrying duty_days, the
#                                            1-rest-day-in-7 legality counter)
#   actor/flight        -> flight_leg       (2,737 scheduled legs, each
#                                            stamping its published departure
#                                            at slotting; since v3 also the
#                                            typed cancel_reason)
#   entity/destination  -> destination      (12 airports; haul class, demand
#                                            weight, and — since v3 — the four
#                                            published block-minute columns,
#                                            all per origin base)
#   entity/base         -> operating_base   (2 — new in v3: the bases with
#                                            their IANA timezones, the
#                                            station-local-time join handle)
#   resource/aircraft   -> aircraft         (12 tails)
#   resource/duty_station -> duty_station   (102 — one per crew member; its
#                                            owner reference is the HR<->ops
#                                            bridge, its seat the member's)
#   queue               -> dispatch_pool    (4 per-base pools: config rows a
#                                            real dispatch system would have)
#   journey_instance    -> lifecycle        (3,039 process instances)
#   tick_decision (payslip_issued)
#                       -> payroll_event    (859 payslips — see PAYDAY)
#   holders  (aircraft) -> tail_hold        (2,077 tail assignments)
#   holders  (stations) -> station_hold     (11,835 station holds: legs
#                                            seating a captain or first
#                                            officer, and the member's own
#                                            off-duty/stand-down holds)
#   waiters             -> pool_wait        (1,887 queue positions — the
#                                            scarce-resource delay record)
#   presence            -> crew_presence    (15,814 duty / sick / muster claims)
#   bound_roles         -> role_binding     (16,767 role bindings per
#                                            lifecycle: dest, tail,
#                                            captain_seat, fo_seat, and the
#                                            roster-mechanism roles)
#   the event log       -> audit_log
#
#   SPLIT   holders -> tail_hold + station_hold via the junction's owner
#           `sub_types` — the two pools are different business facts (fleet
#           rotation vs crew availability) and splitting keeps each table's
#           owner id one population. entity splits the same way since v3
#           (destination + operating_base): the sub-types share only `code`,
#           and one conformed table would glue a 2-row config catalogue onto
#           the 12-row destination catalogue with NULLs both ways.
#   KEPT    dispatch_pool: dimensional drops the queue kind as mechanism, but
#           an app database HAS the pool-config table (discipline, full-pool
#           policy, base) and pool_wait.pool_id needs a join target.
#   SCHED   flight_leg.scheduled_departure is the producer's sim-instant
#           stamp (BIGINT ns). Since v3 it is the PUBLISHED departure — the
#           leg's drawn 5-minute-grid slot plus the fixed 45-minute ops
#           allowance, stamped at slotting. Ops release starts at the SLOT,
#           so most flown legs push ahead of the published time (61.7%
#           measured): negative delay vs plan is correct data. The `render:`
#           election ({instant: timestamptz}) puts it on the same ops clock
#           as the structural columns, so delay vs plan is computable in the
#           DB; NULL on the 622 legs that had not drawn their slot by tape's
#           end. Scheduled ARRIVAL is this column plus the destination's
#           matching sched_block_* minutes — a join by design, not a
#           pre-materialized sum.
#   PAYDAY  the instantaneous payday never lands in the lifecycle history
#           (active -> payday -> active at one instant collapses to no
#           change), so neither the lifecycle table nor audit_log carries
#           the pay cadence. The engine's payslip decision record is its
#           only surface: payroll_event is tick_decision narrowed to
#           decision_type=payslip_issued (859 rows, semi-monthly — when,
#           and whose employment lifecycle). The rest of tick_decision
#           stays dropped (below).
#   DROPPED tick_decision's other nine decision types and its bindings
#           table. Since v3 every decision carries a JSON `context`
#           payload, but each one MIRRORS a typed surface these tables
#           already carry — verified: the cancel decisions' context.reason
#           equals flight_leg.cancel_reason on all 119 rows, and every
#           other decision_type mirrors a lifecycle state entry the
#           audit_log already carries (duty_started 7,709 = on_duty
#           entries, flight_planned 2,737 = the schedule entries,
#           cancelled_crew 81 + cancelled_weather 38 = the cancelled
#           close-outs, and so on). Key on typed columns, never the JSON.
#           The bindings carry only the `dest` role, which role_binding
#           also carries. Omission is source's exclusion mechanism.
#   DROPPED crew `constitution` (robust/typical/fragile): the generator's
#           sickness-propensity input, not an HR attribute any airline
#           database would hold. The OBSERVED sickness record stays
#           (sickness_episodes, crew_presence, the audit stream).
#   KEYS    every population that mints a code elects `presentation_id`
#           (the `keys:` block): crew_member.id is the staff code
#           (CRW-nnnn), flight_leg.id the leg code (LEG-nnnnn),
#           duty_station.id the station code (DS-nnnn) — and since v3 the
#           lifecycle and decision records mint codes too, so
#           lifecycle.id is the journey code (JRN-nnnnn) and
#           payroll_event.id the decision code (DEC-nnnnnn): the round-2
#           record_index fallback for those two populations (flagged
#           upstream after round 2) is resolved. Every referencing surface
#           (lifecycle.subject_id, payroll_event.lifecycle_id, the
#           junctions' owner and member columns, duty_station.
#           crew_member_id, the audit log's item_id) renders the same
#           election, so no exported id sits at a constant offset from
#           anything. The populations that still mint no code —
#           destination, operating_base, aircraft, dispatch_pool — elect
#           `record_index` (a compact BIGINT serial): this emit's record_id
#           is the same creation-order counter as VARCHAR, so there is no
#           less-synthetic surface to elect. The reused flight number
#           (FXnnn, one per (bank, destination) pair) is an attribute of
#           the leg, not its key; the aircraft's registration keys the
#           DIMENSIONAL dim, but source state tables present the
#           election-governed identity as `id`, and tail_number sits
#           beside it.
#   PKs     declare_keys: the DuckDB dump carries PK/UNIQUE constraints
#           resolved from the sidecar's presentation_keys registry — round-1
#           QA read a keyless dump.
#   AUDITED actor/flight joins the audit sources: round-1 shipped the core
#           flight_leg table unaudited, which made the README's log-replay
#           claim false in the data. Its 2,737 creates (schedule entries,
#           with the leg's constant attributes in the changeset), its
#           slot-stamp updates (the changeset carries the raw ns value, as
#           an audit payload would), its v3 cancel_reason stamps on the 119
#           scrubs, and its close-outs all land in audit_log as item_type
#           flight_leg.
#   HYGIENE mechanism internals stay out: the engine's scheduling-queue
#           reference on aircraft / duty_station (`queue`), the holds' and
#           waits' preemption rule ids, the waits' `eligible` server list
#           and `requested_count` (1 on every row), the holds' `slots_held`
#           (1 on every row — capacity-1 pools), the bindings' `pick_index`
#           (0 on every row). `elem__claim` / `elem__on_acquired_rule` STAY:
#           they say what business process a hold or wait belongs to.
#   LABELS  kind_labels renders the junctions' member-kind discriminators in
#           domain words (entity -> destination, resource -> asset, actor ->
#           operating_unit); identity values are untouched.
#
# COLUMNS: `sub_types:` narrows ROWS, not columns — every state table
# enumerates `columns:` from its own `sub_type_columns` partition, prefixed
# by the record lifecycle quartet (created_sim_time, active, deactivated_at,
# last_mutation_sim_time -> created_at / active / deactivated_at /
# updated_at via rename). The identity column is election-governed, never
# listed in `columns` — it projects as `id` regardless.
#
# A `temporal_class: slice_only` column is auto-omitted with a notice
# whatever this config says — here resource.retiring and
# journey_instance.state_entry_time / complete. The notice lines are the
# authoritative list.
#
# History is opt-in and tracked-ness decides who is audited: actor/crew
# (status, sickness_episodes, and since v3 the daily duty_days counter
# writes — plus the constant name stamps at create), actor/flight (creates,
# the slot stamps, the v3 cancel_reason stamps, and close-outs — see
# AUDITED), journey_instance (current_state — the operational changelog),
# resource (capacity, allocated — the two pools' live occupancy).
# entity.city is tracked but never changes in this emit; it is audited with
# the rest of nothing (left out via `only`).
#
# CLOCK: the `rebase:` block declares the carrier's operations clock. The
# emit's own anchor is 2026-01-05T00:00:00 UTC and the tape is 146 days: an
# eight-week burn-in (the quarter opens with crew histories, sickness
# records and paydays already in motion) and then the published quarter from
# 2026-03-02. The carrier runs on Eastern time, so the origin is repinned to
# local midnight in America/New_York, and every instant column — the state
# tables' lifecycle stamps, the junctions' interval bounds, the audit log's
# occurred_at — elects `timestamptz`: each value carries its real UTC
# offset, -05:00 (EST) until the 2026-03-08 DST transition and -04:00 (EDT)
# after it, the offset pattern a real US ops database shows (a frozen
# year-round offset was itself a synthetic tell). `grain: minute` truncates
# every rendered timestamp to whole minutes: real ops systems are
# minute-grained at best, and the microsecond surface was round-1 QA's
# fastest synthetic tell. Raw sim-time keys (and ordering) are untouched.

mode: source

rebase:
  base_date: 2026-01-05
  timezone: America/New_York
  grain: minute

keys:
  actor: presentation_id
  entity: record_index
  resource:
    aircraft: record_index
    duty_station: presentation_id
  journey_instance: presentation_id
  queue: record_index
  tick_decision: presentation_id

source:
  declare_keys: true

  kind_labels:
    actor: operating_unit
    entity: destination
    resource: asset

  tables:
    - name: crew_member
      kind: actor
      sub_types: [crew]
      description: "An individual crew member on the payroll, rated for one seat (captain or first officer), with their HR status and sickness record."
      columns: [created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__first_name, prop__last_name, prop__full_name,
                prop__base, prop__seat, prop__role, prop__shift,
                prop__status, prop__sickness_episodes, prop__duty_days]
      rename:
        created_sim_time: created_at
        last_mutation_sim_time: updated_at
        prop__first_name: first_name
        prop__last_name: last_name
        prop__full_name: full_name
        prop__base: base
        prop__seat: seat
        prop__role: role
        prop__shift: shift
        prop__status: status
        prop__sickness_episodes: sickness_episodes
        prop__duty_days: duty_days
      render:
        created_sim_time: timestamptz
        deactivated_at: timestamptz
        last_mutation_sim_time: timestamptz
      descriptions:
        presentation_id: "The member's staff code (CRW-nnnn); the table's key."
        created_sim_time: "When the member joined the payroll."
        active: "TRUE while the member is on the payroll; FALSE once resigned and closed out."
        deactivated_at: "When the member left the payroll; NULL while employed."
        last_mutation_sim_time: "When the member row was last touched — HR changes, plus the member's duty, wait, and hold activity; audit_log carries only the HR property changes, so this can postdate the member's last audit event."
        prop__first_name: "The member's given name."
        prop__last_name: "The member's family name."
        prop__full_name: "The member's display name as the roster prints it."
        prop__base: "Station the member reports at: CVG or SLC."
        prop__seat: "The seat the member is rated for: captain or fo (first officer)."
        prop__role: "Roster role: lineholder (flies the published line) or reserve (called out when a leg loses a crew member)."
        prop__shift: "The report window the member musters in: early or late."
        prop__status: "HR lifecycle status: onboarding, active, notice, or resigned."
        prop__sickness_episodes: "Sickness episodes recorded against the member to date."
        prop__duty_days: "Consecutive duty days since the member's last rostered day off — the 1-rest-day-in-7 legality counter: mustering requires five or fewer and increments it; a day off resets it to zero."

    - name: flight_leg
      kind: actor
      sub_types: [flight]
      description: "A scheduled leg: an out-and-back rotation from its base to its planned destination, entered on the published schedule; its published departure instant (slot plus the 45-minute ops allowance) is stamped at slotting, and a scrubbed leg carries its typed cancellation reason."
      columns: [created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__flight_number, prop__route_number, prop__destination,
                prop__base, prop__bank, prop__scheduled_departure,
                prop__cancel_reason]
      rename:
        created_sim_time: created_at
        last_mutation_sim_time: updated_at
        prop__flight_number: flight_number
        prop__route_number: route_number
        prop__destination: destination_id
        prop__base: base
        prop__bank: departure_bank
        prop__scheduled_departure: scheduled_departure
        prop__cancel_reason: cancel_reason
      render:
        created_sim_time: timestamptz
        deactivated_at: timestamptz
        last_mutation_sim_time: timestamptz
        prop__scheduled_departure: {instant: timestamptz}
      descriptions:
        presentation_id: "The leg's operational code (LEG-nnnnn), unique for the quarter; the table's key."
        created_sim_time: "When the leg entered the published schedule."
        active: "TRUE while the leg is still in motion; FALSE once completed or cancelled."
        deactivated_at: "When the leg closed out; NULL for legs still in motion at quarter end."
        last_mutation_sim_time: "When the leg row was last updated."
        prop__flight_number: "The leg's published flight number (FXnnn). Reused across the quarter — one number per (departure bank, destination) pair — so it names the service, not the individual leg."
        prop__route_number: "The carrier's route number for the destination; the am and pm services to the same airport share it."
        prop__destination: "The leg's planned destination, drawn when the leg entered the schedule; joins destination.id."
        prop__base: "Station the rotation departs from and returns to: CVG or SLC."
        prop__bank: "Which departure bank the leg is scheduled in: am or pm."
        prop__scheduled_departure: "The leg's PUBLISHED departure instant: its drawn 5-minute-grid slot plus the fixed 45-minute ops allowance, stamped at slotting. Ops release starts at the slot, so most flown legs push ahead of this time — negative delay vs plan is normal. Scheduled arrival derives by joining the destination's matching sched_block_* minutes. NULL on a leg that has not drawn its slot."
        prop__cancel_reason: "Why the leg was scrubbed: weather, no_captain, no_fo, captain_sick, fo_sick, no_reserve_captain, or no_reserve_fo. NULL on every leg that was not cancelled. The typed column consumers key on — the decision log's JSON context only mirrors it."

    - name: destination
      kind: entity
      sub_types: [destination]
      description: "An airport the carrier serves — the catalogue legs plan destinations from. Haul class, demand weighting, and published block minutes are facts of the city pair, one column per origin base: a leg's class is its destination's class from the leg's own base."
      columns: [created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__code, prop__city,
                prop__class_from_cvg, prop__class_from_slc,
                prop__popularity_cvg, prop__popularity_slc,
                prop__sched_block_cvg_out, prop__sched_block_cvg_in,
                prop__sched_block_slc_out, prop__sched_block_slc_in]
      rename:
        created_sim_time: created_at
        last_mutation_sim_time: updated_at
        prop__code: airport_code
        prop__city: city
        prop__class_from_cvg: route_class_from_cvg
        prop__class_from_slc: route_class_from_slc
        prop__popularity_cvg: popularity_cvg
        prop__popularity_slc: popularity_slc
        prop__sched_block_cvg_out: sched_block_cvg_out
        prop__sched_block_cvg_in: sched_block_cvg_in
        prop__sched_block_slc_out: sched_block_slc_out
        prop__sched_block_slc_in: sched_block_slc_in
      render:
        created_sim_time: timestamptz
        deactivated_at: timestamptz
        last_mutation_sim_time: timestamptz
      descriptions:
        record_index: "Unique numeric identifier for the airport, assigned in creation order."
        created_sim_time: "When the airport entered the carrier's network."
        active: "TRUE while the airport is served."
        deactivated_at: "When the airport left the network; NULL while served."
        last_mutation_sim_time: "When the airport row was last updated."
        prop__code: "IATA three-letter airport code."
        prop__city: "City the airport serves."
        prop__class_from_cvg: "Haul class of the CVG service to this airport: short, medium, or long. Class is a fact of the city pair — SEA is long from CVG but medium from SLC."
        prop__class_from_slc: "Haul class of the SLC service to this airport: short, medium, or long."
        prop__popularity_cvg: "Relative demand weighting used when CVG legs plan a destination."
        prop__popularity_slc: "Relative demand weighting used when SLC legs plan a destination."
        prop__sched_block_cvg_out: "Published block minutes CVG -> this airport, 5-minute grid. A CVG leg's scheduled arrival = its scheduled_departure plus this column."
        prop__sched_block_cvg_in: "Published block minutes this airport -> CVG, 5-minute grid."
        prop__sched_block_slc_out: "Published block minutes SLC -> this airport, 5-minute grid. An SLC leg's scheduled arrival = its scheduled_departure plus this column."
        prop__sched_block_slc_in: "Published block minutes this airport -> SLC, 5-minute grid."

    - name: operating_base
      kind: entity
      sub_types: [base]
      description: "An operating base (crew domicile + hub station): CVG and SLC, each with its IANA timezone. Its code matches the base string crew, legs, assets and pools carry; the timezone is the handle for deriving station-local time from the ops-clock instants."
      columns: [created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__code, prop__timezone]
      rename:
        created_sim_time: created_at
        last_mutation_sim_time: updated_at
        prop__code: base_code
        prop__timezone: timezone
      render:
        created_sim_time: timestamptz
        deactivated_at: timestamptz
        last_mutation_sim_time: timestamptz
      descriptions:
        record_index: "Unique numeric identifier for the base, assigned in creation order."
        created_sim_time: "When the base was configured (at genesis)."
        active: "TRUE while the base operates."
        deactivated_at: "When the base closed; NULL while operating."
        last_mutation_sim_time: "When the base row was last updated."
        prop__code: "IATA code of the base (CVG or SLC) — the string every base/home-base column carries."
        prop__timezone: "The base's IANA timezone (America/New_York for CVG, America/Denver for SLC). Every exported instant is on the carrier's single ops clock; convert with this zone for station-local time."

    - name: aircraft
      kind: resource
      sub_types: [aircraft]
      description: "A tail in the fleet, based at one station, held by one leg at a time for block plus turnaround (plus repair on a fault)."
      columns: [created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__tail_number, prop__base, prop__capacity, prop__allocated]
      rename:
        created_sim_time: created_at
        last_mutation_sim_time: updated_at
        prop__tail_number: tail_number
        prop__base: base
        prop__capacity: capacity
        prop__allocated: allocated
      render:
        created_sim_time: timestamptz
        deactivated_at: timestamptz
        last_mutation_sim_time: timestamptz
      descriptions:
        record_index: "Unique numeric identifier for the tail, assigned in creation order."
        created_sim_time: "When the tail joined the fleet."
        active: "TRUE while the tail is in service."
        deactivated_at: "When the tail left the fleet; NULL while in service."
        last_mutation_sim_time: "When the tail row was last updated."
        prop__tail_number: "The aircraft's registration (tail number)."
        prop__base: "Station the tail is based at: CVG or SLC."
        prop__capacity: "Slots on this tail (1 — one leg flies it at a time)."
        prop__allocated: "Slots currently held: 1 while a leg is flying or turning it, else 0."

    - name: duty_station
      kind: resource
      sub_types: [duty_station]
      description: "One crew member's availability as a server: off duty the member holds their own station; on duty the station is in the base pool serving legs; sickness pulls it back mid-block. The ops <-> HR bridge; its immutable seat is the member's rating."
      columns: [created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__base, prop__seat, prop__role,
                prop__owner, prop__capacity, prop__allocated]
      rename:
        created_sim_time: created_at
        last_mutation_sim_time: updated_at
        prop__base: base
        prop__seat: seat
        prop__role: role
        prop__owner: crew_member_id
        prop__capacity: capacity
        prop__allocated: allocated
      render:
        created_sim_time: timestamptz
        deactivated_at: timestamptz
        last_mutation_sim_time: timestamptz
      descriptions:
        presentation_id: "The station's code (DS-nnnn); the table's key."
        created_sim_time: "When the station was minted (at its member's induction, or at genesis)."
        active: "TRUE while the station is live; FALSE once retired with its member's resignation."
        deactivated_at: "When the station was retired; NULL while live."
        last_mutation_sim_time: "When the station row was last updated."
        prop__base: "Base the station belongs to: CVG or SLC."
        prop__seat: "The seat this station serves: captain or fo. A leg seizes one captain station and one fo station from the same base pool."
        prop__role: "Roster role of the member the station represents: lineholder or reserve."
        prop__owner: "The crew member this station represents; joins crew_member.id (their staff code)."
        prop__capacity: "Slots on this station (1; 0 once its member resigned and the station wound down)."
        prop__allocated: "Slots currently held — by a leg seating the member, or by the member off duty."

    - name: dispatch_pool
      kind: queue
      description: "A base pool's wait-queue configuration: which contention group it governs, its promotion discipline, and its full-pool policy."
      columns: [created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__contention_group, prop__discipline, prop__on_full,
                prop__base]
      rename:
        created_sim_time: created_at
        last_mutation_sim_time: updated_at
        prop__contention_group: pool_group
        prop__discipline: discipline
        prop__on_full: on_full
        prop__base: base
      render:
        created_sim_time: timestamptz
        deactivated_at: timestamptz
        last_mutation_sim_time: timestamptz
      descriptions:
        record_index: "Unique numeric identifier for the pool, assigned in creation order."
        created_sim_time: "When the pool was configured (at genesis)."
        active: "TRUE while the pool is live."
        deactivated_at: "When the pool was retired; NULL while live."
        last_mutation_sim_time: "When the pool row was last updated."
        prop__contention_group: "What the pool allocates: aircraft (tails) or duty_station (crew availability)."
        prop__discipline: "Waiter promotion order: fifo for tails, preempt for duty stations (a sick pull displaces the holder)."
        prop__on_full: "Policy when every server is full: waiters queue."
        prop__base: "Base the pool serves: CVG or SLC."

    - name: lifecycle
      kind: journey_instance
      description: "One process instance: a leg's flight lifecycle, or a crew member's roster, sickness, or employment lifecycle — its current state and when it began."
      columns: [created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__actor, prop__journey_type, prop__current_state]
      rename:
        created_sim_time: created_at
        last_mutation_sim_time: updated_at
        prop__actor: subject_id
        prop__journey_type: process
        prop__current_state: current_state
      render:
        created_sim_time: timestamptz
        deactivated_at: timestamptz
        last_mutation_sim_time: timestamptz
      descriptions:
        presentation_id: "The lifecycle's journey code (JRN-nnnnn); the table's key."
        created_sim_time: "When the lifecycle began."
        active: "TRUE while the process is still running; FALSE once it reached a terminal state."
        deactivated_at: "When the process finished; NULL while running."
        last_mutation_sim_time: "When this row last changed — the most recent state transition."
        prop__actor: "The leg or crew member walking this process; joins flight_leg.id (LEG-nnnnn) or crew_member.id (CRW-nnnn), depending on process."
        prop__journey_type: "Which process this is: flight, roster, sickness, or employment."
        prop__current_state: "The state the process is in right now."

    - name: payroll_event
      kind: tick_decision
      where: {prop__decision_type: payslip_issued}
      description: "One payslip issued to a crew member: the pay packet landing on the semi-monthly payday, each member's at its own minute through the morning. The payday is instantaneous, so it is an event row, not a state — the lifecycle table never shows a payday in flight."
      columns: [created_sim_time, prop__journey_instance]
      rename:
        created_sim_time: paid_at
        prop__journey_instance: lifecycle_id
      render:
        created_sim_time: timestamptz
      descriptions:
        presentation_id: "The payslip's decision code (DEC-nnnnnn); the table's key."
        created_sim_time: "When the pay packet landed."
        prop__journey_instance: "The employment lifecycle the payslip belongs to; joins lifecycle.id (its JRN-nnnnn code — that lifecycle's subject_id is the member's staff code)."

    - name: tail_hold
      membership: {kind: resource, property: holders}
      sub_types: [aircraft]
      description: "One leg's hold on one tail, from the dispatch grant through the end of the turnaround (including any fault repair)."
      columns: [joined_sim_time, left_sim_time, member__actor__id, elem__claim]
      rename:
        record_id: aircraft_id
        member__actor__id: leg_id
        joined_sim_time: held_from
        left_sim_time: released_at
        elem__claim: claim
      render:
        joined_sim_time: timestamptz
        left_sim_time: timestamptz
      descriptions:
        record_id: "The tail being held; joins aircraft.id."
        member__actor__id: "The leg holding the tail; joins flight_leg.id (its LEG-nnnnn code)."
        joined_sim_time: "When the tail was granted to the leg at dispatch."
        left_sim_time: "When the tail was released after the turnaround; NULL if still held at quarter end."
        elem__claim: "The seize that made this hold (flight:dispatching:tail_ready on every row here)."

    - name: station_hold
      membership: {kind: resource, property: holders}
      sub_types: [duty_station]
      description: "One hold on a crew member's duty station: a leg seating the member (claims flight:crewing_captain:captain_aboard / flight:crewing_fo:crew_complete, or the reserve callouts flight:recover_captain:captain_recovered / flight:recover_fo:fo_recovered), or the member holding their own station off duty (roster:closing:closed) or after a sick pull (roster:pulled_back:pulled)."
      columns: [joined_sim_time, left_sim_time, member__actor__id, elem__claim]
      rename:
        record_id: station_id
        member__actor__id: holder_id
        joined_sim_time: held_from
        left_sim_time: released_at
        elem__claim: claim
      render:
        joined_sim_time: timestamptz
        left_sim_time: timestamptz
      descriptions:
        record_id: "The duty station being held; joins duty_station.id (its DS-nnnn code)."
        member__actor__id: "Who holds it: a leg (flight claims, LEG-nnnnn) or the station's own member (roster claims, CRW-nnnn); joins flight_leg.id or crew_member.id by claim."
        joined_sim_time: "When the hold was granted."
        left_sim_time: "When the hold was released; NULL if still held at quarter end."
        elem__claim: "The seize that made this hold — says whether a leg is seating the member (and in which seat) or the member is holding their own station."

    - name: pool_wait
      membership: {kind: queue, property: waiters}
      description: "One queue position in a base pool: a leg waiting for a tail, a captain, or a first officer, or a crew member waiting to reclaim their station at duty end. The scarce-resource delay record — most legs assemble without queuing."
      columns: [joined_sim_time, left_sim_time, member__actor__id,
                elem__on_acquired_rule, elem__priority]
      rename:
        record_id: pool_id
        member__actor__id: waiter_id
        joined_sim_time: enqueued_at
        left_sim_time: resolved_at
        elem__on_acquired_rule: awaiting
        elem__priority: priority
      render:
        joined_sim_time: timestamptz
        left_sim_time: timestamptz
      descriptions:
        record_id: "The pool queued at; joins dispatch_pool.id."
        member__actor__id: "The waiting leg (LEG-nnnnn) or crew member (CRW-nnnn); joins flight_leg.id or crew_member.id by the awaiting rule."
        joined_sim_time: "When the waiter joined the queue."
        left_sim_time: "When the wait resolved (grant, or abandoned at cancellation); NULL if still queued at quarter end."
        elem__on_acquired_rule: "What the waiter was queued for: a tail (flight:dispatching:tail_ready), a captain (flight:crewing_captain:captain_aboard), a first officer (flight:crewing_fo:crew_complete), a reserve callout (flight:recover_captain:captain_recovered / flight:recover_fo:fo_recovered), or the member's own stand-down (roster:closing:closed)."
        elem__priority: "Queue priority frozen at enqueue; meaningful on the preempt duty-station pools."

    - name: crew_presence
      membership: {kind: actor, property: presence}
      description: "One claim on a crew member's presence: a duty day, a sickness episode (which outranks duty and stands the member down), or a muster report waiting for the duty grant."
      columns: [joined_sim_time, left_sim_time, elem__claim, elem__status]
      rename:
        record_id: crew_member_id
        joined_sim_time: started_at
        left_sim_time: ended_at
        elem__claim: claim
        elem__status: status
      render:
        joined_sim_time: timestamptz
        left_sim_time: timestamptz
      descriptions:
        record_id: "The member whose presence is claimed; joins crew_member.id (their staff code)."
        joined_sim_time: "When the claim began."
        left_sim_time: "When the claim ended; NULL if still open at quarter end."
        elem__claim: "What claimed the member: roster:on_duty:occupy (a duty day), sickness:sick:occupy (a sick episode), or roster:mustering:occupy (a muster report)."
        elem__status: "occupying, or waiting (a muster report queued behind a sick episode)."

    - name: role_binding
      membership: {kind: journey_instance, property: bound_roles}
      description: "One role bound to a process instance: the leg's planned destination (dest), its tail and two crew seats, or the roster process's own-station bookkeeping roles."
      columns: [joined_sim_time, left_sim_time, elem__role_name,
                member__entity__kind, member__entity__id]
      rename:
        record_id: lifecycle_id
        elem__role_name: role
        member__entity__kind: participant_type
        member__entity__id: participant_id
        joined_sim_time: bound_from
        left_sim_time: unbound_at
      render:
        joined_sim_time: timestamptz
        left_sim_time: timestamptz
      descriptions:
        record_id: "The process instance the role is bound on; joins lifecycle.id (its JRN-nnnnn code)."
        elem__role_name: "The role filled: dest, tail, captain_seat, fo_seat, or the roster roles closed_sign / my_station / new_station."
        member__entity__kind: "What kind of participant is bound: destination or asset."
        member__entity__id: "The bound participant; joins destination.id, aircraft.id, or duty_station.id (its DS-nnnn code), depending on role."
        joined_sim_time: "When the role was bound."
        left_sim_time: "When the role was released; NULL where the binding ran to quarter end."

  events:
    name: audit_log
    render:
      event_sim_time: timestamptz
    sources:
      - kind: actor
        sub_types: [crew]
        item_type: crew_member
        ignore: [actor_type, constitution]
      - kind: actor
        sub_types: [flight]
        item_type: flight_leg
        ignore: [actor_type]
      - kind: journey_instance
        item_type: lifecycle
        ignore: [journey_type]
        rename:
          actor: subject_id
      - kind: resource
        sub_types: [aircraft]
        item_type: aircraft
        only: [capacity, allocated]
      - kind: resource
        sub_types: [duty_station]
        item_type: duty_station
        only: [capacity, allocated]
