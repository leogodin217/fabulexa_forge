# StreamConfig — airline-ops bundle, CDC replay
# ============================================================
# Drives `fabulexa-forge stream` (and the mixer) over the airline-ops emit at
# docs/examples/airline-ops/bundle/. Five kinds/populations -> five topics:
# the ops lifecycle stream that carries the quarter's story, the schedule
# feed, the crew HR stream, the tail-occupancy stream, and the payroll feed.
#
#   content: state-changes — `history` replayed as an ordered c/u/d CDC stream.
#
# VOCABULARY (parity with source.yaml): per-stream `kind_label` mirrors
# source.yaml's table names (crew_member / flight_leg / lifecycle / aircraft
# / payroll_event), payload renames mirror its column renames (subject_id,
# process, destination_id, departure_bank, lifecycle_id), and `keys:` mirrors
# its elections — crew and leg event keys are the staff codes (CRW-nnnn) and
# leg codes (LEG-nnnnn) their state tables present as `id`, and since v3 the
# lifecycle and payroll event keys are the upstream-minted journey and
# decision codes (JRN-nnnnn / DEC-nnnnnn) — the round-2 record_index
# fallback for those two populations is resolved. aircraft still elects
# record_index (tails mint no code; the registration rides the payload).
# Every stream renames its elected key surface to `id`, so the wire carries
# the app database's column name, not the engine's.
#
# Declared streams (event counts measured against THIS emit):
#   crew_member  — actor narrowed to its crew sub-type: the crew-management
#                  feed (8,874 events). Status changes, sickness-episode
#                  increments over the flu wave, and — since v3 — the daily
#                  duty_days counter writes (the 1-rest-day-in-7 legality
#                  rule: the bulk of the feed, exactly as CDC on a crew
#                  table whose roster writes it daily would show), plus the
#                  18 mid-run hires' creates and the resignations' deletes.
#                  The name columns ride the payload so the feed reads like
#                  an HR system's.
#   flight_leg   — actor narrowed to its flight sub-type: the schedule feed
#                  (7,082 events). 2,737 schedule-entry creates, the slot
#                  stamps as `u` events (the published departure = the drawn
#                  5-minute-grid slot + the 45-minute ops allowance), the
#                  cancel_reason stamps on the 119 scrubs, and the close-out
#                  deletes. The leg's airline surface (flight number, route,
#                  planned destination, base, departure bank) rides every
#                  event. `scheduled_departure` is the producer's raw
#                  sim-instant stamp (BIGINT ns on the tape's clock); the
#                  `render:` election ({instant: timestamptz}) puts it on the
#                  same ops clock as the table exports, so the wire carries
#                  the app database's zone-aware text, not a raw ns offset.
#   lifecycle    — journey_instance is not sub-typed (journey_type is not a
#                  `<kind>_type` discriminator domain), so one stream carries
#                  all four processes (52,353 events); `process` on every
#                  payload says which, exactly like source.yaml's lifecycle
#                  table. current_state c/u/d IS the operational feed:
#                  schedule entries, slots, boarding, blocks and turns, duty
#                  days, days off, sick calls, weather and crew scrubs.
#   aircraft     — the tail fleet's occupancy flips (allocated 0 <-> 1, 3,656
#                  events) and the per-tail capacity record, with the
#                  registration riding the payload. duty_station occupancy is
#                  left to the lifecycle stream's roster process rather than
#                  doubled as a sixth topic.
#   payroll      — tick_decision narrowed to payslip_issued (859 creates,
#                  semi-monthly): the pay cadence's only surface, since the
#                  instantaneous payday never lands in the lifecycle history
#                  (a state entered and left at one instant collapses to no
#                  change). The other decision types mirror typed surfaces
#                  the other streams already carry and are not streamed.
#
# CLOCK: the `rebase:` block declares the carrier's operations clock — the
# same declaration as the three table configs. The emit's anchor is
# 2026-01-05T00:00:00 UTC (an eight-week burn-in, then the published quarter
# from 2026-03-02); the carrier runs on Eastern time, so the origin is
# repinned to local midnight in America/New_York — the payload's
# scheduled-departure stamp elects `timestamptz` and carries its real UTC
# offset (-05:00 EST until the 2026-03-08 DST transition, -04:00 EDT after);
# `grain: minute` truncates each event's `ts` to whole minutes — real feeds
# are minute-grained at best, and microsecond `ts` was round-1 QA's fastest
# synthetic tell. Event order, `seq`, and the full-ns `event_sim_time` key
# are untouched.
# Bootstrap is supplied at the CLI (`--bootstrap-servers ...`) when the sink
# is kafka.

content: state-changes

rebase:
  base_date: 2026-01-05
  timezone: America/New_York
  grain: minute

keys:
  actor: presentation_id
  journey_instance: presentation_id
  resource: record_index
  tick_decision: presentation_id

streams:
  - name: crew_member
    kind: actor
    sub_types: [crew]
    properties: [status, sickness_episodes, duty_days,
                 first_name, last_name, full_name]
    rename:
      presentation_id: id
    kind_label: crew_member
  - name: flight_leg
    kind: actor
    sub_types: [flight]
    properties: [flight_number, route_number, destination, base, bank,
                 scheduled_departure, cancel_reason]
    rename:
      presentation_id: id
      destination: destination_id
      bank: departure_bank
    render:
      scheduled_departure: {instant: timestamptz}
    kind_label: flight_leg
  - name: lifecycle
    kind: journey_instance
    properties: [current_state, actor, journey_type]
    rename:
      presentation_id: id
      actor: subject_id
      journey_type: process
    kind_label: lifecycle
  - name: aircraft
    kind: resource
    sub_types: [aircraft]
    properties: [allocated, capacity, tail_number]
    rename:
      record_index: id
    kind_label: aircraft
  - name: payroll
    kind: tick_decision
    where: {decision_type: payslip_issued}
    properties: [journey_instance, decision_type]
    rename:
      presentation_id: id
      journey_instance: lifecycle_id
    kind_label: payroll_event
