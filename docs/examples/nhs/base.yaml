# ExportConfig — NHS bundle, base mode (flat current-state dump)
# ============================================================
# `fabulexa-forge export docs/examples/nhs/bundle docs/examples/nhs/base.yaml`
#
# Base mode reconstructs one flat table per records kind at the tape's end:
# every tracked property (patient.status, resource.allocated, ...) carries its
# LATEST history value. No genre split, no sub-type split, no FK joins — the
# faithful "current state of every record" landing shape. `record_id` presents
# as `id`; every other column is presentation-verbatim.
#
# The only author decision here is which kinds to drop. We exclude the two
# simulation-MECHANISM kinds — they are engine bookkeeping, not clinical data:
#   tick_decision — the engine's per-tick rule-firing log (decision_type,
#                   context). An audit trail of the simulator, not the trust.
#   queue         — an internal wait-queue mechanism record; carries no
#                   domain-meaningful attributes.
# Everything clinical survives: actor (patients), diary (clinic books), entity
# (wards/theatres/diagnostics/procedures/meds), journey_instance (episodes),
# resource (consultants), booking (appointments).
#
# Anchor is optional for base — omitted here, so lifecycle timestamps stay raw
# sim-time ns. Add a `rebase:` block (see source.yaml) to land wallclock dates.

mode: base

base:
  exclude:
    kinds: [tick_decision, queue]
