# FabulMixer demo preset — consumer-side flags for the NHS demo.
# ============================================================
# Demo glue only — read by the demo launcher (`make mixer-demo EXAMPLE=...`), NEVER
# by `fabexport`. Pairs with stream.yaml in this directory; the bundle is at ./bundle.
# See dev/demo/README.md.
#
# NHS topic set (from stream.yaml routing `nhs.{kind}`):
#   nhs.actor             — patient/actor dimension
#   nhs.diary             — clinic-diary dimension
#   nhs.journey_instance  — pathway-instance dimension (busiest strip)
#   nhs.resource          — resource dimension (`allocated` over time)
#
# All four topics are dimensions; there are no fact->dimension edges in this config,
# so joins is empty. This is a valid pure read-back preset that demonstrates the
# four-strip mixer board with no consumer join lag.

windows:
  - 3600000             # 1h tumbling window

joins: []

consumer_offset: earliest
