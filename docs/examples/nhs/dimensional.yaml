# ExportConfig — NHS bundle, dimensional mode (star schema)
# ============================================================
# `fabulexa-forge export docs/examples/nhs/bundle docs/examples/nhs/dimensional.yaml <out> --fmt duckdb`
#
# Started from `fabulexa-forge init docs/examples/nhs/bundle`, then curated
# against the atlas into the star an NHS trust warehouse would actually run.
# Curation decisions (the author judgment init can't make):
#
#   DROPPED  queue — scheduler state (specialty priority queues), no clinical
#            row grain. Declared under `exclude` as a guard.
#   RESTORED tick_decision (116,450 rows). An earlier revision excluded it as
#            "engine bookkeeping" from the kind name alone; `record_roles`
#            declares it a fact kind and its decision_type values ARE the
#            clinical event stream (ed_arrival, triage, admission,
#            surgery_performed, ...). Decide from the atlas, not the name.
#   SPLIT    tick_decision -> one fact per clinical process, at decision
#            grain, each selected by a list-valued `filter` over its
#            process's decision types. The decision types cluster 1:1 under
#            journey_instance.journey_type (verified: every type maps to
#            exactly one journey type, except waiting_list_deterioration),
#            so the domain partition is expressible as named tables — which
#            is what an NHS warehouse actually ships (ECDS, APC, Outpatient,
#            DM01, CWT), never a single "clinical events" table.
#            The 947 waiting_list_deterioration events span THREE pathways
#            (cancer / outpatient / surgical) and would cross-contaminate
#            any process fact's filter, so they are their own cross-pathway
#            fact carrying `pathway` via lookup.
#   BRIDGES  the five binding roles of membership__tick_decision__bindings
#            (23,708 rows) become five bridge facts, one per role
#            (`where: {elem__role_name: ...}`), each declaring a real FK to
#            its reference catalogue: dx_test -> fact_diagnostic_test,
#            admitted_meds -> fact_medication_administration (multi-pick —
#            up to three medications per decision, so binding grain is
#            forced; dimensional.md § Membership-grain facts), spell_ward ->
#            fact_ward_stay, surgery_procedure -> fact_procedure,
#            surgery_theatre -> fact_theatre_session. These are the only
#            link from clinical events to the five catalogue dims, which
#            previously had no inbound FK at all.
#   SPLIT    entity -> dim_ward / dim_theatre / dim_diagnostic_test /
#            dim_procedure / dim_medication. The kind is polymorphic (five
#            unrelated reference catalogues behind one `entity_type`
#            discriminator); one conformed dim would be a sparse mostly-NULL
#            table no real warehouse ships. The sidecar's `sub_type_columns`
#            partition names each sub-type's own columns, so each dim below
#            projects exactly its sub-type's surface.
#   RENAMED  actor -> dim_patient, resource -> dim_consultant, diary ->
#            dim_appointment_book: output names are the domain's, never the
#            engine ontology's.
#   KEPT     diary CONFORMED (not split): its three sub-types share an
#            identical column set, and fact_booking's diary reference is
#            polymorphic across them — an fk lands on ONE destination dim, so
#            a split would strand two-thirds of the bookings. `book_type`
#            carries the discriminator instead.
#   DIM->T1  consultant: init proposed SCD-2 because `allocated` (patients
#            currently held) is history-tracked. That is operational STATE,
#            not a slowly-changing attribute — the dim is Type-1 reference
#            data (capacity, grade, specialty), and the caseload timeline
#            enters the star at its own grain as fact_consultant_caseload
#            (the same judgment ride-sharing-marketplace's fact_loyalty_band
#            cites as its precedent).
#   DIM->T1  appointment_book: same logic — `next_opening` (the book's next
#            free slot) is operational state, not a dim attribute; dropped,
#            and the dim is Type-1.
#   STATE    patient (QA F3): dim_patient carried the state of whatever
#            episode the patient was currently in — 18 of its 29 columns —
#            so clinical churn, not attribute change, drove 55,789 SCD-2
#            rows over 15,060 patients (up to 28 versions of one person).
#            Split three ways on measured evidence:
#            - TIMELINES -> facts. status (44,937 intervals), hai_status
#              (19,374 intervals) and the FFT rating (2,085 recorded
#              outcomes — the fft_invited event's context is stage-only,
#              so this history series is the ONLY record of the answer)
#              enter the star at their own grain: fact_patient_status,
#              fact_hai_status, fact_fft_response below.
#            - EVENT MIRRORS -> dropped. admission_count (2,797 flips =
#              the 2,797 admission events), cancer_referred (2,271 = the
#              cancer_referral events), surgical_referred (1,864 flips ~
#              1,865 surgeon_assigned events), fft_invited (set on only
#              259 of 2,223 invited patients; 1,545 carry a recorded
#              outcome under fft_invited='no'). The clinical event facts
#              already carry these processes at event grain.
#            - SCRIPT FLAGS -> dropped as generator inputs (the same
#              judgment as quality_rating below): pathway_type,
#              diagnostic_required, outpatient_diagnostic_required,
#              diagnostic_test_type, suspicious_finding,
#              surgical_indicated, procedure_code, readmission_risk,
#              admission_disposition are the patient's pre-assigned route,
#              contradicted by outcomes — procedure_code on all 15,060
#              patients while surgical_indicated='no' on 13,290;
#              admission_disposition set on all 15,060 while only 1,951
#              were ever admitted. What actually happened lives in the
#              event facts and bridges.
#            What remains on the dim is the patient: identity, demographics
#            and the constant clinical attributes the atlas names (primary
#            condition, comorbidities, frailty).
#   NO DIM   journey_instance: its records table is a tombstone (terminal
#            state + completion flag; everything else slice_only). The value
#            is its `history` series — current_state is the richest series in
#            the bundle (~172k transitions) — so the kind enters the star as
#            fact_pathway_state (below), not as a dimension.
#
# Facts — every grain family the bundle carries:
#   fact_booking             (records grain)          appointment bookings
#   fact_patient_intake / fact_emergency_care / fact_outpatient /
#   fact_diagnostics / fact_admitted_care / fact_cancer_pathway /
#   fact_surgical_pathway / fact_post_discharge / fact_fft /
#   fact_waiting_list_deterioration
#                            (records grain)          the clinical event stream,
#                            one fact per clinical process at decision grain —
#                            all 116,450 decisions, each in exactly one fact
#   fact_diagnostic_test / fact_medication_administration / fact_ward_stay /
#   fact_procedure / fact_theatre_session
#                            (membership grain)       the five binding-role
#                            bridges, clinical event -> reference catalogue
#   fact_pathway_state       (history_interval grain) one row per state-occupancy
#                            interval of a care episode — time-in-state analytics
#                            (ED 4-hour breaches, 2WW waits, LoS by state)
#   fact_consultant_allocation (membership grain)     one row per interval a
#                            patient held a consultant — utilisation/caseload
#   fact_consultant_caseload (history_interval grain) one row per constant-caseload
#                            interval of a consultant — caseload-as-it-stood, read
#                            via interval join from fact_consultant_allocation
#   fact_patient_status      (history_interval grain) one row per interval of the
#                            patient's cross-episode care position
#   fact_hai_status          (history_interval grain) one row per infection-status
#                            interval (clear / colonized) — HAI burden over time
#   fact_fft_response        (history_point grain)    one row per recorded FFT
#                            survey rating
#
# No SCD-2 dim remains. dim_patient is Type-1 like the other dims: with the
# state columns gone, its only tracked properties (full_name, birth_date)
# never change in this run — and SCD-2 windows version on the KIND's history,
# not the projected columns, so keeping type2 would re-emit the same 55,789
# windows as 40,729 pairs of identical adjacent versions. One row per patient
# is the honest shape; if a run ever mutates names, revisit.
#
# Not every omission below is an author choice. `temporal_class: slice_only`
# columns cannot be projected in any mode — that is why booking.attended_at
# and journey_instance.state_entry_time / complete appear nowhere here (the
# export's `notice:` lines are the authoritative list). consultant.queue is
# an ordinary tracked reference into the excluded queue kind; it is simply
# not projected by dim_consultant's column list.
#
# Generator parameters are DROPPED, on purpose, and this is the note that keeps
# them from being added back as "attributes we already have":
#   dim_consultant.quality_rating   a per-clinician score, 20 distinct values
#                                   over 30 named consultants. A simulator input;
#                                   attaching one to a named individual would be
#                                   a governance problem in a real trust.
#   ...min_lead, ...window          empty on all 15 books.
#   ...horizon, ...booking_discipline
#                                   one distinct value across all 15 — a global
#                                   engine setting materialized per row, carrying
#                                   no analytic information.
#   ...slot_interval                3 values, but raw sim-time ns (~17h, ~58h).
#                                   An engine tick scale, not a clinic slot.
# What survives on the book is book_type + main_specialty, which is the honest
# extent of its real catalogue content.
#
# capacity is KEPT. It is a real job-plan attribute and the denominator
# fact_consultant_allocation needs to express utilisation — the analysis that
# fact exists for.
#
# KEYS (realism QA): the `keys:` block elects, per population, which identity
# surface presents as each table's id:
#   actor -> presentation_id. The registry mints PAT_-prefixed hospital numbers
#            (counter, width 7, single sub-type — union-safe), and the hospital
#            number IS how a trust identifies a patient. dim_patient keys on it
#            and every patient FK — reference, membership, and the zero-hop
#            self edges on the patient-timeline facts — renders it. The
#            engine's 64-hex actor record_id appears nowhere.
#   resource / entity / diary -> record_index. Compact BIGINT surrogate keys,
#            each dim keeping its NATURAL domain code (consultant_code C0001,
#            ward_code W001, opcs4_code, ...) as an attribute beside the
#            surrogate — the classic warehouse pair. The registry's CON_/WARD_/
#            DIAG_-prefixed presentation counters are dropped as a third
#            spelling of the same identity carrying no domain information.
#   tick_decision / journey_instance / booking are NOT elected: events and
#            episodes join fact-to-fact on their verbatim record ids (digit
#            strings), which every grain that carries them can project.
#   The consultant facts (allocation, caseload) and patient-timeline facts
#   (status, hai, fft) render their subject through a zero-hop `fk:` self edge
#   to the subject's own dim, so both sides of those joins carry the elected
#   surface.
#
# HYGIENE (realism QA): the raw `*_ns` sim-epoch twin columns are gone — every
# instant renders once, as a wallclock TIMESTAMP. The interval facts key on
# their rendered TIMESTAMPs instead: measured zero same-microsecond collisions
# within any keyed series (episode state, patient status, hai, fft, caseload,
# allocation), so the ns->µs truncation costs no key uniqueness. Interval joins
# against the state facts use the TIMESTAMP columns directly.
#
# DESCRIPTIONS (desc-override round): per-column `description:` overrides
# replace the engine-voiced inherited prose (identity minting, sim-time
# lifecycle, decision/membership mechanics) with learner-voice descriptions,
# and give every FK and derived measure a description of its own. Table-level
# blurbs are sidecar-inherited with no override surface, so the ten event
# facts, the bridges, and dim_consultant still open with engine narration —
# a known leak.
#
# Timestamps: no `rebase:` block, so the effective anchor is the sidecar's own
# `runtime` (2023-01-01T00:00 UTC). `derived: {timestamp: ...}` columns render
# wallclock TIMESTAMP through it.
#   ELECTED  dim_patient.birth_date is a plain VARCHAR property, not a
#            derived timestamp — the producer mints it upstream as a date
#            string, never involving sim_time or the anchor. Verified all
#            15,060 values match `%Y-%m-%d` with no exceptions
#            (1922-07-05..2007-06-19), so it is declared via `date_parse`
#            and reinterpreted as a real DATE rather than passed through as
#            text.

mode: dimensional

keys:
  actor: presentation_id
  resource: record_index
  entity: record_index
  diary: record_index

dimensional:
  exclude:
    kinds: [queue]

  tables:
    # --- dim: patient — Type-1, identity + demographics + constant clinical
    #     attributes only; per-episode state exports at its own grain (see
    #     the STATE header note) ---
    - name: dim_patient
      role: dim
      scd: type1
      source:
        grain: records
        kind: actor
        filter: {prop__actor_type: default}
      key: [patient_id]
      description: "One row per patient: identity, demographics, and the
        constant clinical attributes the atlas names."
      columns:
        # the elected surface: the PAT_-prefixed hospital number (KEYS note)
        - {name: patient_id, from: presentation_id,
           description: "Hospital number identifying the patient (PAT-prefixed)."}
        - {name: full_name, from: prop__full_name}
        - name: birth_date
          derived: {date_parse: {from: prop__birth_date, format: "%Y-%m-%d"}}
        - {name: gender_code, from: prop__gender_code}
        - {name: ethnic_category, from: prop__ethnic_category}
        - {name: imd_decile, from: prop__imd_decile}
        - {name: gp_practice_code, from: prop__gp_practice_code}
        - {name: primary_condition, from: prop__primary_condition}
        - {name: comorbidity_count, from: prop__comorbidity_count,
           description: "Count of significant comorbid conditions, banded 0 to
             4-plus; a heavier burden raises clinical priority and readmission
             risk."}
        - {name: frailty_band, from: prop__frailty_band}

    # --- dim: consultant — Type-1 (allocated = state -> fact_consultant_caseload;
    #     queue = engine scheduler reference, not projected) ---
    - name: dim_consultant
      role: dim
      scd: type1
      source:
        grain: records
        kind: resource
        filter: {prop__resource_type: consultant}
      key: [consultant_id]
      columns:
        - {name: consultant_id, from: record_index,
           description: "Surrogate key for this consultant."}
        - {name: consultant_code, from: prop__entity_code}
        - {name: main_specialty, from: prop__main_specialty,
           description: "NHS main specialty code this consultant works under."}
        - {name: grade, from: prop__grade}
        # capacity is the denominator fact_consultant_allocation needs for
        # utilisation/caseload — kept. quality_rating is DROPPED: see the
        # generator-parameter note in the header.
        - {name: capacity, from: prop__capacity,
           description: "Maximum number of patients this consultant can carry
             at once — the utilisation denominator for
             fact_consultant_allocation."}

    # --- dims: the entity catalogue split per sub-type (sidecar sub_type_columns) ---
    - name: dim_ward
      role: dim
      scd: type1
      source:
        grain: records
        kind: entity
        filter: {prop__entity_type: ward}
      key: [ward_id]
      description: "One row per hospital ward."
      columns:
        - {name: ward_id, from: record_index,
           description: "Surrogate key for this ward."}
        - {name: ward_code, from: prop__entity_code,
           description: "NHS ward code from the trust's estate catalogue."}
        - {name: name, from: prop__name, description: "Ward name."}
        - {name: main_specialty, from: prop__main_specialty}
        - {name: ward_type, from: prop__ward_type}
        - {name: total_beds, from: prop__total_beds}
        - {name: cost_per_bed_day, from: prop__cost_per_bed_day}
        - {name: site_code, from: prop__site_code}

    - name: dim_theatre
      role: dim
      scd: type1
      source:
        grain: records
        kind: entity
        filter: {prop__entity_type: theatre}
      key: [theatre_id]
      description: "One row per operating theatre."
      columns:
        - {name: theatre_id, from: record_index,
           description: "Surrogate key for this operating theatre."}
        - {name: theatre_code, from: prop__entity_code,
           description: "Theatre code from the trust's estate catalogue."}
        - {name: name, from: prop__name, description: "Theatre name."}
        - {name: theatre_specialty, from: prop__theatre_specialty}
        - {name: sessions_per_day, from: prop__sessions_per_day}

    - name: dim_diagnostic_test
      role: dim
      scd: type1
      source:
        grain: records
        kind: entity
        filter: {prop__entity_type: diagnostic}
      key: [test_id]
      description: "One row per diagnostic test type in the trust's
        diagnostics catalogue."
      columns:
        - {name: test_id, from: record_index,
           description: "Surrogate key for this diagnostic test type."}
        - {name: test_code, from: prop__entity_code,
           description: "Test code from the trust's diagnostics catalogue."}
        - {name: name, from: prop__name, description: "Test name."}
        - {name: main_specialty, from: prop__main_specialty}
        - {name: test_type, from: prop__test_type}
        - {name: turnaround_days, from: prop__turnaround_days}
        - {name: cost, from: prop__cost}

    - name: dim_procedure
      role: dim
      scd: type1
      source:
        grain: records
        kind: entity
        filter: {prop__entity_type: procedure}
      key: [procedure_id]
      description: "One row per surgical procedure in the OPCS-4 catalogue."
      columns:
        - {name: procedure_id, from: record_index,
           description: "Surrogate key for this surgical procedure."}
        - {name: opcs4_code, from: prop__entity_code,
           description: "OPCS-4 code identifying this procedure."}
        - {name: name, from: prop__name, description: "Procedure name."}
        - {name: main_specialty, from: prop__main_specialty}
        - {name: specialty_group, from: prop__specialty_group}
        - {name: hrg_code, from: prop__hrg_code}
        - {name: tariff, from: prop__tariff}
        - {name: complexity, from: prop__complexity}

    - name: dim_medication
      role: dim
      scd: type1
      source:
        grain: records
        kind: entity
        filter: {prop__entity_type: medication}
      key: [medication_id]
      description: "One row per medication in the trust's formulary."
      columns:
        - {name: medication_id, from: record_index,
           description: "Surrogate key for this medication."}
        - {name: medication_code, from: prop__entity_code,
           description: "Medication code from the trust's formulary."}
        - {name: name, from: prop__name, description: "Medication name."}
        - {name: main_specialty, from: prop__main_specialty}
        - {name: specialty_group, from: prop__specialty_group}
        - {name: drug_class, from: prop__drug_class}

    # --- dim: appointment book — Type-1, CONFORMED across the three diary
    #     sub-types (identical schemas; fact_booking's reference is polymorphic) ---
    - name: dim_appointment_book
      role: dim
      scd: type1
      source:
        grain: records
        kind: diary
      key: [book_id]
      columns:
        # Every scheduler setting the diary carries is DROPPED — see the
        # generator-parameter note in the header. What is left is the book's
        # real catalogue identity, and it is the whole of it.
        - {name: book_id, from: record_index,
           description: "Surrogate key for this appointment book."}
        - {name: book_type, from: prop__diary_type,
           description: "Which kind of appointment book this is: outpatient
             clinic, two-week-wait cancer clinic, or elective operating
             list."}
        - {name: main_specialty, from: prop__main_specialty,
           description: "Specialty this appointment book serves."}

    # --- fact: booking (records grain) — one row per appointment booking ---
    - name: fact_booking
      role: fact
      source:
        grain: records
        kind: booking
      key: [booking_id]
      columns:
        - {name: booking_id, from: record_id,
           description: "Surrogate key for this booking."}
        - {name: patient_id, fk: {to: dim_patient, via: reference},
           description: "The patient the appointment was booked for
             (dim_patient)."}
        - {name: book_id, fk: {to: dim_appointment_book, via: reference},
           description: "The appointment book the slot was drawn from
             (dim_appointment_book)."}
        # Event time as an anchored wallclock TIMESTAMP. Patient-state-as-of-
        # booking is an interval join against the state facts, e.g.:
        #   JOIN fact_patient_status s ON s.patient_id = f.patient_id
        #                    AND f.requested_at >= s.entered_at
        #                    AND (s.exited_at IS NULL OR f.requested_at < s.exited_at)
        - {name: requested_at, derived: {timestamp: {source: prop__requested_at}},
           description: "When the booking was requested."}
        - {name: opening_at, derived: {timestamp: {source: prop__opening_at}},
           description: "When the booked appointment slot opens."}
        - {name: status, from: prop__status}

    # --- fact: pathway state (history_interval grain) — one row per
    #     state-occupancy interval of a care episode. THE time-in-state fact:
    #     ED 4-hour breaches, 2WW waits, time-to-theatre, LoS by state. ---
    - name: fact_pathway_state
      role: fact
      source:
        grain: history_interval
        kind: journey_instance
        property: current_state
      key: [episode_id, entered_at]
      description: "One row per state-occupancy interval of a care episode —
        the time-in-state fact for ED 4-hour breaches, 2WW waits, and LoS by
        state."
      columns:
        - {name: episode_id, from: record_id,
           description: "Surrogate key for the care episode; joins the event
             facts' episode_id."}
        - {name: patient_id, fk: {to: dim_patient, via: reference},
           description: "The patient this episode belongs to (dim_patient)."}
        # the episode's pathway is a type-1 property of the episode itself — a
        # zero-hop self-lookup enriches the history grain with it. Renamed
        # from the engine's journey_type to the domain's pathway_type,
        # matching source.yaml.
        - {name: pathway_type, lookup: {property: journey_type},
           description: "Which care pathway this episode runs: A&E attendance,
             inpatient spell, outpatient referral, diagnostics, cancer,
             surgical, post-discharge follow-up, or FFT survey."}
        - {name: state, from: value,
           description: "State the episode occupied during this interval."}
        - {name: entered_at, derived: {timestamp: {source: sim_time}},
           description: "When the patient entered this state."}
        # lead_sim_time = LEAD(sim_time): NULL on the episode's last (open) state.
        - {name: exited_at, derived: {timestamp: {source: lead_sim_time}},
           description: "When the patient left this state; NULL while the
             episode is still in it at the end of the extract."}

    # --- fact: consultant allocation (membership grain) — one row per interval
    #     a patient held a consultant slot; utilisation and caseload. ---
    - name: fact_consultant_allocation
      role: fact
      source:
        grain: membership
        kind: resource
        property: holders
      key: [consultant_id, patient_id, allocated_at]
      columns:
        # zero-hop self edge: the binding's owner IS the consultant, rendered
        # in the dim's elected surrogate key
        - {name: consultant_id, fk: {to: dim_consultant, via: reference},
           description: "The consultant the patient was allocated to
             (dim_consultant)."}
        - {name: patient_id, fk: {to: dim_patient, via: membership, member_field: actor},
           description: "The patient under the consultant's care
             (dim_patient)."}
        - {name: priority, from: elem__priority,
           description: "Clinical priority the patient carried for this
             allocation; a heavier comorbidity burden ranks higher."}
        - {name: slots_held, from: elem__slots_held,
           description: "How many of the consultant's slots this patient
             occupies."}
        - {name: allocated_at, derived: {timestamp: {source: joined_sim_time}},
           description: "When the patient was allocated to the consultant."}
        # NULL while the patient still holds the consultant at tape's end.
        - {name: released_at, derived: {timestamp: {source: left_sim_time}},
           description: "When the allocation ended; NULL while the patient is
             still under the consultant's care at the end of the extract."}

    # --- fact: consultant caseload (history_interval grain) — one row per
    #     constant-caseload interval of a consultant. `allocated` is operational
    #     state (see the DIM->T1 note), so it enters the star at its own grain;
    #     caseload-as-it-stood at any event is a three-predicate interval join:
    #       JOIN fact_consultant_caseload c ON c.consultant_id = f.consultant_id
    #                            AND f.allocated_at >= c.entered_at
    #                            AND (c.exited_at IS NULL OR f.allocated_at < c.exited_at)
    - name: fact_consultant_caseload
      role: fact
      source:
        grain: history_interval
        kind: resource
        property: allocated
      key: [consultant_id, entered_at]
      description: "One row per constant-caseload interval of a consultant —
        caseload as it stood over time."
      columns:
        # zero-hop self edge (see fact_consultant_allocation)
        - {name: consultant_id, fk: {to: dim_consultant, via: reference},
           description: "The consultant whose caseload this interval describes
             (dim_consultant)."}
        # history.value arrives VARCHAR: the history_interval grain's `from:
        # value` does not cast back to the sidecar type (BIGINT here) — cast at
        # query time.
        - {name: caseload, from: value,
           description: "Number of patients the consultant carried throughout
             this interval (text-encoded — cast to a number at query time)."}
        - {name: entered_at, derived: {timestamp: {source: sim_time}},
           description: "When the consultant's caseload changed to this
             value."}
        # NULL on the consultant's current (open) caseload interval.
        - {name: exited_at, derived: {timestamp: {source: lead_sim_time}},
           description: "When the caseload next changed; NULL on the
             consultant's current interval."}

    # ------------------------------------------------------------------
    # Patient state timelines — the tracked clinical state moved OUT of
    # dim_patient (the STATE header note). Same judgment as
    # fact_consultant_caseload: operational state enters the star at its
    # own grain. patient_id is the zero-hop self edge to dim_patient,
    # rendered in the elected hospital number like every other patient FK.
    # ------------------------------------------------------------------

    # --- fact: patient status (history_interval grain) — one row per
    #     interval of the patient's cross-episode care position (active,
    #     in_ed, admitted, ... recovered, deceased). Coarser than
    #     fact_pathway_state and patient-scoped: it spans episodes (a
    #     patient is `active` between them, `deceased` terminally), which
    #     no episode-grain table can express. ---
    - name: fact_patient_status
      role: fact
      source:
        grain: history_interval
        kind: actor
        property: status
      key: [patient_id, entered_at]
      description: "One row per interval of the patient's cross-episode care
        position (active, in_ed, admitted, ... recovered, deceased)."
      columns:
        - {name: patient_id, fk: {to: dim_patient, via: reference},
           description: "The patient whose care status this interval describes
             (dim_patient)."}
        - {name: status, from: value,
           description: "Care status the patient held during this interval
             (active, in_ed, admitted, ... recovered, deceased)."}
        - {name: entered_at, derived: {timestamp: {source: sim_time}},
           description: "When the patient entered this status."}
        # NULL on the patient's current (open) status interval.
        - {name: exited_at, derived: {timestamp: {source: lead_sim_time}},
           description: "When the patient left this status; NULL on their
             current status at the end of the extract."}

    # --- fact: HAI status (history_interval grain) — one row per
    #     infection-status interval (clear / colonized): the trust's
    #     hospital-acquired-infection burden over time. This timeline
    #     exists nowhere else: safety_incident events (599) are not the
    #     colonization changes (4,314). ---
    - name: fact_hai_status
      role: fact
      source:
        grain: history_interval
        kind: actor
        property: hai_status
      key: [patient_id, entered_at]
      description: "One row per infection-status interval (clear /
        colonized) — the trust's hospital-acquired-infection burden over
        time."
      columns:
        - {name: patient_id, fk: {to: dim_patient, via: reference},
           description: "The patient whose infection status this interval
             describes (dim_patient)."}
        - {name: hai_status, from: value,
           description: "Infection status the patient held during this
             interval: clear or colonized."}
        - {name: entered_at, derived: {timestamp: {source: sim_time}},
           description: "When the patient entered this infection status."}
        # NULL on the patient's current (open) infection-status interval.
        - {name: exited_at, derived: {timestamp: {source: lead_sim_time}},
           description: "When the patient left this infection status; NULL on
             their current status at the end of the extract."}

    # --- fact: FFT response (history_point grain) — one row per recorded
    #     Friends & Family Test rating. A response is a point event, and
    #     the `value:` predicate drops the 15,060 `not_given` seed
    #     intervals, leaving the 2,093 recorded outcomes. The rating lives
    #     ONLY in this history series: the fft_invited event's context is
    #     stage-only, so fact_fft has the invite but never the answer. ---
    - name: fact_fft_response
      role: fact
      source:
        grain: history_point
        kind: actor
        property: fft_outcome
        value: [very_good, good, neutral, poor, very_poor, no_response]
      key: [patient_id, recorded_at]
      description: "One row per recorded Friends and Family Test response."
      columns:
        - {name: patient_id, fk: {to: dim_patient, via: reference},
           description: "The patient who returned the survey (dim_patient)."}
        - {name: outcome, from: value,
           description: "Recorded FFT satisfaction rating: very_good to
             very_poor, or no_response."}
        - {name: recorded_at, derived: {timestamp: {source: sim_time}},
           description: "When the response was recorded."}

    # ------------------------------------------------------------------
    # The clinical event stream: one fact per clinical process, at decision
    # grain (see the RESTORED / SPLIT header notes). Shared shape: event_id,
    # episode_id (joins fact_pathway_state.episode_id — the state timeline),
    # patient_id (the two-hop decision -> journey_instance -> actor
    # pathfind), milestone where the process has more than one, and the
    # anchored event time. `context` is projected only where it carries
    # information milestone does not (verified 1:1 elsewhere).
    # ------------------------------------------------------------------

    # --- fact: patient intake — front-door triage routing each arrival ---
    - name: fact_patient_intake
      role: fact
      source:
        grain: records
        kind: tick_decision
        filter: {prop__decision_type: intake}
      key: [event_id]
      columns:
        - {name: event_id, from: record_id,
           description: "Surrogate key for this intake event."}
        - {name: episode_id, from: prop__journey_instance,
           description: "The care episode this event belongs to; joins
             fact_pathway_state.episode_id."}
        - {name: patient_id, fk: {to: dim_patient, via: reference},
           description: "The patient being routed (dim_patient)."}
        - {name: occurred_at, derived: {timestamp: {source: created_sim_time}},
           description: "When the patient was triaged to a pathway at the
             front door."}

    # --- fact: emergency care (ECDS shape, decision grain) — A&E milestones ---
    - name: fact_emergency_care
      role: fact
      source:
        grain: records
        kind: tick_decision
        filter:
          prop__decision_type: [ed_arrival, triage, ed_assessment, ed_diagnosis]
      key: [event_id]
      columns:
        - {name: event_id, from: record_id,
           description: "Surrogate key for this A&E event."}
        - {name: episode_id, from: prop__journey_instance,
           description: "The A&E attendance this event belongs to; joins
             fact_pathway_state.episode_id."}
        - {name: patient_id, fk: {to: dim_patient, via: reference},
           description: "The patient attending A&E (dim_patient)."}
        - {name: milestone, from: prop__decision_type,
           description: "Which clinical milestone this event records:
             ed_arrival, triage, ed_assessment, or ed_diagnosis."}
        - {name: occurred_at, derived: {timestamp: {source: created_sim_time}},
           description: "When the milestone occurred."}
        # The four-hour-breach metric in its native form: minutes from this
        # attendance's ed_arrival to this milestone (0 on the arrival row).
        - name: minutes_from_arrival
          description: "Minutes since the patient's A&E arrival — the
            four-hour-standard clock (0 on the arrival row)."
          derived:
            elapsed:
              correlate_on: prop__journey_instance
              other_where: {prop__decision_type: ed_arrival}
              start_source: created_sim_time
              end_source: created_sim_time
              unit: minutes

    # --- fact: outpatient — referral, attendance, DNA ---
    - name: fact_outpatient
      role: fact
      source:
        grain: records
        kind: tick_decision
        filter:
          prop__decision_type: [referral_created, appointment_attended, appointment_dna]
      key: [event_id]
      columns:
        - {name: event_id, from: record_id,
           description: "Surrogate key for this outpatient event."}
        - {name: episode_id, from: prop__journey_instance,
           description: "The outpatient referral this event belongs to; joins
             fact_pathway_state.episode_id."}
        - {name: patient_id, fk: {to: dim_patient, via: reference},
           description: "The referred patient (dim_patient)."}
        - {name: milestone, from: prop__decision_type,
           description: "Which clinical milestone this event records:
             referral_created, appointment_attended, or appointment_dna."}
        - {name: occurred_at, derived: {timestamp: {source: created_sim_time}},
           description: "When the milestone occurred."}

    # --- fact: diagnostics (DM01 shape) — order, perform, communicate ---
    - name: fact_diagnostics
      role: fact
      source:
        grain: records
        kind: tick_decision
        filter:
          prop__decision_type:
            [diagnostic_ordered, diagnostic_performed, diagnostic_result_communicated]
      key: [event_id]
      columns:
        - {name: event_id, from: record_id,
           description: "Surrogate key for this diagnostics event."}
        - {name: episode_id, from: prop__journey_instance,
           description: "The diagnostic request this event belongs to; joins
             fact_pathway_state.episode_id."}
        - {name: patient_id, fk: {to: dim_patient, via: reference},
           description: "The patient the test is for (dim_patient)."}
        - {name: milestone, from: prop__decision_type,
           description: "Which clinical milestone this event records:
             diagnostic_ordered, diagnostic_performed, or
             diagnostic_result_communicated."}
        - {name: occurred_at, derived: {timestamp: {source: created_sim_time}},
           description: "When the milestone occurred."}
        # Turnaround: hours from this request's diagnostic_ordered event.
        - name: hours_from_order
          description: "Hours since this request's diagnostic_ordered event —
            the test-turnaround clock (0 on the order row)."
          derived:
            elapsed:
              correlate_on: prop__journey_instance
              other_where: {prop__decision_type: diagnostic_ordered}
              start_source: created_sim_time
              end_source: created_sim_time
              unit: hours

    # --- fact: admitted patient care (APC shape) — the inpatient spell's
    #     milestones. `context` is kept HERE only: safety_incident is the one
    #     milestone whose context adds information (the care stage — ICU vs
    #     specialty ward — the incident occurred in). ---
    - name: fact_admitted_care
      role: fact
      source:
        grain: records
        kind: tick_decision
        filter:
          prop__decision_type:
            [admission, ward_assignment, specialty_care_start,
             medication_administered, medically_fit, dtoc_assessment,
             safety_incident, icu_care]
      key: [event_id]
      columns:
        - {name: event_id, from: record_id,
           description: "Surrogate key for this inpatient-care event."}
        - {name: episode_id, from: prop__journey_instance,
           description: "The inpatient spell this event belongs to; joins
             fact_pathway_state.episode_id."}
        - {name: patient_id, fk: {to: dim_patient, via: reference},
           description: "The admitted patient (dim_patient)."}
        - {name: milestone, from: prop__decision_type,
           description: "Which clinical milestone this event records:
             admission, ward_assignment, specialty_care_start,
             medication_administered, medically_fit, dtoc_assessment,
             safety_incident, or icu_care."}
        - {name: context, from: prop__context,
           description: "Extra event detail as JSON text — for
             safety_incident events, the stage of care the incident occurred
             in."}
        - {name: occurred_at, derived: {timestamp: {source: created_sim_time}},
           description: "When the milestone occurred."}

    # --- fact: cancer pathway (CWT shape) — 2WW / 62-day milestones ---
    - name: fact_cancer_pathway
      role: fact
      source:
        grain: records
        kind: tick_decision
        filter:
          prop__decision_type:
            [cancer_referral, cancer_first_seen, cancer_diagnosis_confirmed,
             cancer_treatment_decision]
      key: [event_id]
      columns:
        - {name: event_id, from: record_id,
           description: "Surrogate key for this cancer-pathway event."}
        - {name: episode_id, from: prop__journey_instance,
           description: "The cancer pathway this event belongs to; joins
             fact_pathway_state.episode_id."}
        - {name: patient_id, fk: {to: dim_patient, via: reference},
           description: "The referred patient (dim_patient)."}
        - {name: milestone, from: prop__decision_type,
           description: "Which clinical milestone this event records:
             cancer_referral, cancer_first_seen, cancer_diagnosis_confirmed,
             or cancer_treatment_decision."}
        - {name: occurred_at, derived: {timestamp: {source: created_sim_time}},
           description: "When the milestone occurred."}
        # The waiting-time standards in native form: hours from this
        # pathway's cancer_referral (2WW = 336, 62-day = 1488).
        - name: hours_from_referral
          description: "Hours since this pathway's cancer_referral — the
            cancer waiting-time-standards clock (two-week wait = 336, 62-day
            target = 1488)."
          derived:
            elapsed:
              correlate_on: prop__journey_instance
              other_where: {prop__decision_type: cancer_referral}
              start_source: created_sim_time
              end_source: created_sim_time
              unit: hours

    # --- fact: surgical pathway — pre-op, assignment, surgery, recovery ---
    - name: fact_surgical_pathway
      role: fact
      source:
        grain: records
        kind: tick_decision
        filter:
          prop__decision_type:
            [surgeon_assigned, pre_op_assessment, surgery_performed,
             recovery_started]
      key: [event_id]
      columns:
        - {name: event_id, from: record_id,
           description: "Surrogate key for this surgical-pathway event."}
        - {name: episode_id, from: prop__journey_instance,
           description: "The surgical pathway this event belongs to; joins
             fact_pathway_state.episode_id."}
        - {name: patient_id, fk: {to: dim_patient, via: reference},
           description: "The patient listed for surgery (dim_patient)."}
        - {name: milestone, from: prop__decision_type,
           description: "Which clinical milestone this event records:
             surgeon_assigned, pre_op_assessment, surgery_performed, or
             recovery_started."}
        - {name: occurred_at, derived: {timestamp: {source: created_sim_time}},
           description: "When the milestone occurred."}

    # --- fact: post-discharge follow-up — the check at home ---
    - name: fact_post_discharge
      role: fact
      source:
        grain: records
        kind: tick_decision
        filter: {prop__decision_type: post_discharge_check}
      key: [event_id]
      columns:
        - {name: event_id, from: record_id,
           description: "Surrogate key for this follow-up event."}
        - {name: episode_id, from: prop__journey_instance,
           description: "The post-discharge follow-up this event belongs to;
             joins fact_pathway_state.episode_id."}
        - {name: patient_id, fk: {to: dim_patient, via: reference},
           description: "The discharged patient being checked (dim_patient)."}
        - {name: occurred_at, derived: {timestamp: {source: created_sim_time}},
           description: "When the post-discharge check happened."}

    # --- fact: FFT — Friends and Family Test invitations ---
    - name: fact_fft
      role: fact
      source:
        grain: records
        kind: tick_decision
        filter: {prop__decision_type: fft_invited}
      key: [event_id]
      columns:
        - {name: event_id, from: record_id,
           description: "Surrogate key for this invitation event."}
        - {name: episode_id, from: prop__journey_instance,
           description: "The FFT survey episode this event belongs to; joins
             fact_pathway_state.episode_id."}
        - {name: patient_id, fk: {to: dim_patient, via: reference},
           description: "The invited patient (dim_patient)."}
        - {name: occurred_at, derived: {timestamp: {source: created_sim_time}},
           description: "When the FFT invitation was sent."}

    # --- fact: waiting-list deterioration — the one decision type that spans
    #     THREE pathways (cancer / outpatient / surgical), so it is its own
    #     cross-pathway fact rather than a contaminant in three process
    #     facts' filters. `pathway` names which waiting list. ---
    - name: fact_waiting_list_deterioration
      role: fact
      source:
        grain: records
        kind: tick_decision
        filter: {prop__decision_type: waiting_list_deterioration}
      key: [event_id]
      description: "One row per waiting-list deterioration event, spanning the
        cancer, outpatient, and surgical pathways."
      columns:
        - {name: event_id, from: record_id,
           description: "Surrogate key for this deterioration event."}
        - {name: episode_id, from: prop__journey_instance,
           description: "The waiting episode this event belongs to; joins
             fact_pathway_state.episode_id."}
        - {name: patient_id, fk: {to: dim_patient, via: reference},
           description: "The waiting patient (dim_patient)."}
        - {name: pathway, lookup: {to: journey_instance, property: journey_type},
           description: "Which waiting list the patient deteriorated on: the
             cancer, outpatient, or surgical pathway."}
        - {name: occurred_at, derived: {timestamp: {source: created_sim_time}},
           description: "When the deterioration was recorded."}

    # ------------------------------------------------------------------
    # The five binding-role bridges (see the BRIDGES header note): clinical
    # event -> reference catalogue, one bridge per role, each a real
    # gate-checkable FK edge. Join event_id to the owning process fact for
    # the milestone and patient. left_sim_time is not projected: no binding
    # is ever released within the run (0 of 23,708).
    # ------------------------------------------------------------------

    # --- bridge: diagnostic event -> test catalogue. One row per test bound
    #     to a diagnostic_ordered or diagnostic_performed event (1:1). ---
    - name: fact_diagnostic_test
      role: fact
      source:
        grain: membership
        kind: tick_decision
        property: bindings
        where: {elem__role_name: dx_test}
      key: [event_id]
      columns:
        - {name: event_id, from: record_id,
           description: "The clinical event this link belongs to; joins
             fact_diagnostics.event_id."}
        - {name: test_id, fk: {to: dim_diagnostic_test, via: membership, member_field: entity},
           description: "The test performed, from the diagnostics catalogue
             (dim_diagnostic_test)."}
        - {name: recorded_at, derived: {timestamp: {source: joined_sim_time}},
           description: "When the test was linked to its ordering or
             performing event."}

    # --- bridge: medication administration -> formulary. MULTI-PICK: up to
    #     three medications per medication_administered decision, ordered by
    #     position, so binding grain is forced (dimensional.md
    #     § Membership-grain facts) and position joins the key. ---
    - name: fact_medication_administration
      role: fact
      source:
        grain: membership
        kind: tick_decision
        property: bindings
        where: {elem__role_name: admitted_meds}
      key: [event_id, medication_id, position]
      columns:
        - {name: event_id, from: record_id,
           description: "The clinical event this link belongs to; joins
             fact_admitted_care.event_id."}
        - {name: medication_id, fk: {to: dim_medication, via: membership, member_field: entity},
           description: "The medication given, from the formulary
             (dim_medication)."}
        - {name: position, from: elem__pick_index,
           description: "Order of this medication within the administration
             (0 = first) — up to three per event."}
        - {name: administered_at, derived: {timestamp: {source: joined_sim_time}},
           description: "When the medication was administered."}

    # --- bridge: ward assignment -> ward catalogue (1:1 per spell) ---
    - name: fact_ward_stay
      role: fact
      source:
        grain: membership
        kind: tick_decision
        property: bindings
        where: {elem__role_name: spell_ward}
      key: [event_id]
      columns:
        - {name: event_id, from: record_id,
           description: "The clinical event this link belongs to; joins
             fact_admitted_care.event_id."}
        - {name: ward_id, fk: {to: dim_ward, via: membership, member_field: entity},
           description: "The ward the patient was placed on (dim_ward)."}
        - {name: assigned_at, derived: {timestamp: {source: joined_sim_time}},
           description: "When the patient was assigned to the ward."}

    # --- bridge: surgical procedure -> OPCS-4 catalogue. Bound at BOTH
    #     pre_op_assessment (planned) and surgery_performed (performed) —
    #     join event_id to fact_surgical_pathway.milestone to tell which. ---
    - name: fact_procedure
      role: fact
      source:
        grain: membership
        kind: tick_decision
        property: bindings
        where: {elem__role_name: surgery_procedure}
      key: [event_id]
      columns:
        - {name: event_id, from: record_id,
           description: "The clinical event this link belongs to; joins
             fact_surgical_pathway.event_id."}
        - {name: procedure_id, fk: {to: dim_procedure, via: membership, member_field: entity},
           description: "The procedure planned or performed, from the OPCS-4
             catalogue (dim_procedure)."}
        - {name: recorded_at, derived: {timestamp: {source: joined_sim_time}},
           description: "When the procedure was linked to its planning or
             performing event."}

    # --- bridge: theatre session -> theatre catalogue (surgery_performed
    #     events only) ---
    - name: fact_theatre_session
      role: fact
      source:
        grain: membership
        kind: tick_decision
        property: bindings
        where: {elem__role_name: surgery_theatre}
      key: [event_id]
      columns:
        - {name: event_id, from: record_id,
           description: "The clinical event this link belongs to; joins
             fact_surgical_pathway.event_id."}
        - {name: theatre_id, fk: {to: dim_theatre, via: membership, member_field: entity},
           description: "The theatre the operation ran in (dim_theatre)."}
        - {name: used_at, derived: {timestamp: {source: joined_sim_time}},
           description: "When the theatre was used for the operation."}
