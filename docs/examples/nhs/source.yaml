# ExportConfig — NHS bundle, source mode (operational OLTP tables)
# ============================================================
# `fabulexa-forge export docs/examples/nhs/bundle docs/examples/nhs/source.yaml <out> --fmt duckdb`
#
# Source mode DECLARES its own output shape (source-declared-tables): each
# `tables[]` entry is a `state` table (current-state, one row per record)
# over a `kind:`, or a `junction` table over a `membership:` reference.
# History is opt-in via a single polymorphic `events:` log; the tracked-
# property kinds below (patient, consultant, pathway_episode, diary,
# booking) audit into it — the change-log equivalent of the old auto-genre
# classification, now an explicit declaration.
#
# `name:` is author-verbatim — the trust's own OLTP naming, independent of
# the sidecar's engine-ontology `kind:`:
#   actor -> patient, resource -> consultant, journey_instance -> pathway_episode,
#   membership__resource__holders -> consultant_allocation.
# `booking` and `diary` keep their sidecar names — both are genuine NHS
# terms (e-RS booking, clinic diary). `entity` keeps its name too: a
# genuinely polymorphic catalogue (wards / theatres / diagnostics /
# procedures / medications behind `entity_type`) that source keeps as ONE
# combined table by declaring `kind: entity` with no `sub_types:` — the
# per-sub-type split into domain tables is the dimensional config's job.
#
# The two simulation-MECHANISM kinds (tick_decision, queue) are simply never
# declared — omission is source's own exclusion mechanism; a kind is
# exported only through its own `tables[]` / `events.sources[]` entry.
#
# Source is the first mode that REQUIRES a resolved wallclock anchor (the
# event log's `occurred_at` is a real TIMESTAMP). No rebase block is given,
# so the anchor falls back to the sidecar `runtime` (start 2023-01-01, UTC)
# — the emit's own clock. Uncomment `rebase:` to override origin/zone.
#
# Columns are never enumerated below: absent `columns:` projects every
# classified column, and a non-exempt `temporal_class: slice_only` column is
# ALWAYS auto-omitted with a notice regardless of what this config says —
# here booking.attended_at, journey_instance.state_entry_time / complete /
# bound_roles / output_roles, and resource.queue. The export's `notice:`
# lines are the authoritative list.

mode: source

source:
  tables:
    - name: patient
      kind: actor
    - name: consultant
      kind: resource
    - name: pathway_episode
      kind: journey_instance
    - name: booking
      kind: booking
    - name: diary
      kind: diary
    - name: entity
      kind: entity
    - name: consultant_allocation
      membership: {kind: resource, property: holders}
  events:
    name: history
    sources:
      - kind: actor
      - kind: resource
      - kind: journey_instance
      - kind: booking
      - kind: diary

# rebase:
#   base_date: 2023-01-01
#   timezone: Europe/London
