# ExportConfig — retail (TechMart) bundle, base mode (flat current-state dump)
# ============================================================
# `fabulexa-forge export docs/examples/retail/bundle docs/examples/retail/base.yaml`
#
# Base mode reconstructs one flat table per records kind at the tape's end:
# every tracked property (entity.status, journey_instance.current_state,
# actor.total_purchases) carries its LATEST history value. No table
# classification, no sub-type split, no FK joins — the faithful "current state of every record"
# landing shape. On journey_instance and tick_decision `record_id` presents as
# `id`; actor and entity elect presentation_id (KEYS below), so their `id` is
# the business key. Every other column is presentation-verbatim (`prop__*`
# keeps its prefix).
#
# The only author decision here is which kinds to drop — and unlike the NHS
# bundle, retail drops no kind. NHS excluded two simulation-MECHANISM kinds
# (an engine `tick_decision` rule-firing log and an internal `queue`). Retail
# has neither:
#   - There is no `queue` kind.
#   - `tick_decision` is NOT engine bookkeeping here. Per the atlas, this emit
#     is an EVENT-GRAIN "customer actions" dataset, and `tick_decision` is that
#     event: each row is a funnel action (view / cart / compare / checkout /
#     purchase, in `decision_type`) taken inside a shopping_session, bound to
#     the product it acted on. It is real domain data — kept.
# So every kind survives: actor (customers + the ops monitor bot), entity
# (products + storefront infrastructure), journey_instance (shopping / ops
# sessions), tick_decision (customer-action funnel events).
#
# Dropping no KIND is not the same as dropping no COLUMN: `slice_only` columns
# are ALWAYS auto-omitted, independent of any author exclusion. Retail's
# journey_instance carries three (prop__state_entry_time, prop__complete,
# prop__bound_roles); each is omitted with a `slice-only-column-omitted` notice,
# not an error.
#
# KEYS: actor and entity elect presentation_id. The registry declares every
# population of both kinds (CUST_/OPS_ and SKU_/INFRA_ counter key spaces,
# unique within the emit) — required, because base never splits a kind: one
# table spans all its sub-types, so the election must be uniform and the
# spanned key spaces pairwise union-safe (they are: distinct non-empty
# prefixes). Motivation: the bundle's record_id for products mixes two
# upstream id-assignment schemes (44 short integers, 149 64-char hashes);
# under the election the id-space value column carries the uniform business
# key instead, and reference columns into these kinds (journey_instance's
# prop__actor) render the same surface. The `<kind>_key` index keys ship
# regardless — election chooses the id-space VALUE surface beside them.
# journey_instance and tick_decision keep the default: the former carries no
# registry claim, the latter's claim is a bare counter with nothing to gain.
#
# Anchor: a `rebase:` block is optional for base — omitted here, but this emit's
# sidecar CARRIES a `runtime` anchor (2022-03-01T00:00:00 UTC), so the effective
# anchor resolves from the sidecar and the framework/lifecycle columns
# (`created_sim_time`, `deactivated_at`) land as wallclock TIMESTAMPs, not raw
# sim-time ns. Domain `prop__*` columns are presentation-verbatim and stay in
# whatever units the scenario wrote them. Add a `rebase:` block (see source.yaml)
# only to override the origin instant or timezone; an emit with NO sidecar anchor
# and no `rebase:` is the case where lifecycle columns stay raw BIGINT ns.
#
# ELECTED: actor.prop__birth_date is a plain upstream-minted date string
# (verified all 11,468 values match `%Y-%m-%d`, no NULLs) — declared via
# `date_parse` and reinterpreted as a real DATE.

mode: base

base:
  render:
    - table: records__actor
      render:
        prop__birth_date: {date_parse: "%Y-%m-%d"}
    # context.discount_pct rounded in place to 4dp (raw float64 noise
    # otherwise); every other payload byte verbatim.
    - table: records__tick_decision
      render:
        prop__context: {json_precision: {discount_pct: 4}}

# Uniform shorthand: every declared sub-type of the kind elects the surface.
keys:
  actor: presentation_id
  entity: presentation_id
