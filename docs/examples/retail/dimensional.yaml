# ExportConfig — retail (TechMart) bundle, dimensional mode (star schema)
# ============================================================
# `fabulexa-forge export docs/examples/retail/bundle docs/examples/retail/dimensional.yaml <out> --fmt duckdb`
#
# Started from `fabulexa-forge init docs/examples/retail/bundle`, then curated
# against the atlas into the star an e-commerce analytics team would run.
#
# The bundle speaks the simulator's ontology, not TechMart's: `actor`, `entity`,
# `journey_instance`, `tick_decision`. The atlas names what each one is, and the
# sidecar's `sub_type_columns` names which columns are real for which sub-type.
# Every output name below is the domain's; every claim in this log was re-derived
# against THIS emit (counts as measured, not inherited from a sibling config).
#
# The governing curation rule: the star models what a real retail site's
# instrumentation could observe. The simulator's internal machinery — state-machine
# occupancies, the ops bot's monitoring journey — is how the emit was GENERATED,
# not data a warehouse would hold. Observable clickstream and entity state stay;
# engine mechanism goes.
#
# Curation decisions (the author judgment init can't make):
#
#   SPLIT    actor -> dim_customer / dim_ops_agent, by prop__actor_type.
#            `sub_type_columns.actor` partitions into customer (22 columns) and
#            ops (2: presentation_id, prop__component) with no overlap beyond
#            presentation_id. Measured: 11,468 customers, 1 ops agent. Each dim
#            projects exactly its own sub-type's columns; NO output table mixes
#            the two concepts (see SEPARATE below). NOTE `prop__store` is a
#            CUSTOMER column — projecting it on the ops dim would export all-NULL.
#            It is not projected on dim_customer either: this run has ONE
#            storefront host, so the column is one constant reference value on
#            all 11,468 rows, carrying no information.
#   SPLIT    entity -> dim_product / dim_storefront. `sub_type_columns.entity`
#            partitions into product (11 columns) and infrastructure (5), with NO
#            overlap beyond presentation_id. Measured: 193 products, 1 storefront
#            host. Conforming them into one dim exports a table where the product
#            columns are NULL for every infrastructure row and vice versa — and
#            because only the infrastructure columns (status, error_rate) are
#            history-tracked, SCD-2 over the conformed table turns a 194-entity
#            catalogue into 318 rows, 125 of them versions of the single server.
#            Split, each dim projects exactly its own sub-type's columns.
#   SEPARATE customer tables carry only customer activity. The single
#            storefront_ops journey is the monitoring loop, and its rows
#            previously left dangling references on the customer tables (the ops
#            agent is not in dim_customer; the storefront host is not in
#            dim_product). Each customer-side table now filters to its concept:
#              - dim_session: filter prop__journey_type = shopping_session
#                (measured: 31,174 of 31,175 journey_instance rows)
#              - fact_customer_action: filter prop__decision_type IN the six
#                shopping actions (measured: 122,124 of 122,125 tick_decisions;
#                the excluded row is the ops journey's single `store_bound`
#                decision — tick_decision carries no journey column, and
#                decision_type partitions the two journeys exactly)
#              - fact_action_product: where elem__role_name IN the three product
#                roles (measured: 92,357 of 92,358 bindings; the excluded row is
#                the ops journey's single `store`-role binding to the host)
#            Every FK now resolves completely — no dangling references remain.
#   DROPPED  the ops journey's mechanism rows (1 session, 1 store_bound decision,
#            1 store binding). The monitoring loop is engine mechanism; its
#            business-visible OUTPUT is the storefront health timeline, which IS
#            exported — dim_storefront's SCD-2 versions. The ops AGENT itself
#            stays exported (dim_ops_agent), so the actor kind is fully covered.
#   DROPPED  journey_instance's current_state history (previously exported as a
#            fact_session_state occupancy fact, 397,672 rows). The state machine
#            is how the simulator generates shopper behaviour, not something a
#            retail site's instrumentation records: measured, its milestone
#            entries duplicate the clickstream exactly (browsing = visit,
#            31,174 = 31,174; checkout = begin_checkout, 2,453 = 2,453; the
#            1,897 purchased sessions = the 1,897 sessions with a purchase
#            action), ~60% of its rows are gate/loop decision states
#            (browse_view_gate, browse_cart_gate, browse_loop, browse_advance),
#            and the remainder (considering entries, the *_stop abandonment
#            terminals) is engine-internal knowledge — a real site never observes
#            "the customer is considering" or an explicit abandon event; sessions
#            just go quiet. Abandonment is inferred by sessionization over
#            fact_customer_action (last action + no purchase), exactly as a real
#            warehouse does it.
#   DIM->T1  dim_product is Type-1: every value-carrying column in the product
#            partition is `temporal_class: constant` (presentation_id is an
#            identity column and carries none). Nothing versions.
#   DIM->T1  dim_ops_agent is Type-1: prop__component is `temporal_class:
#            constant`. One row — the storefront monitor bot.
#   SCD-2    dim_storefront: `status` and `error_rate` are the only `tracked`
#            columns in the entity kind, and they are the incident timeline the
#            atlas is built around (five storefront degradations across the run,
#            during which checkout completion collapses). 125 versions of one host.
#   SCD-2    dim_customer: `total_purchases` is `tracked` — the lifetime order
#            count genuinely versions per completed order.
#   DIM      dim_session keeps what genuinely does NOT version about a session
#            (its customer, its journey type, its handle) as a thin Type-1 dim, so
#            the facts have an unambiguous single-row session to join. Its
#            journey_type is not projected: after the SEPARATE filter it is the
#            constant 'shopping_session'.
#   FACT     tick_decision -> fact_customer_action. The atlas is explicit that this
#            is an event-grain "customer actions" dataset and tick_decision IS that
#            event: one row per funnel action (view / cart / compare / checkout /
#            purchase in `decision_type`). A real fact, not engine bookkeeping —
#            and the ONLY behavioural fact: it is the site's observable
#            clickstream.
#   BRIDGE   the product binding is NOT an FK on fact_customer_action. The
#            `bindings` membership carries a MULTI-PICK role — `compared_products`
#            binds TWO products to one comparison decision (measured 7,846 binding
#            rows), ordered by elem__pick_index — and dimensional.md § "Membership-
#            grain facts (multi-pick)" is explicit that a multi-pick role's fact
#            grain must be the BINDING, not the owner. So the bindings become their
#            own binding-grain fact, fact_action_product, carrying all 92,357
#            product-role bindings; dropping a compared product to force 1:1
#            would be a fidelity violation.
#   KEYS     actor and entity elect presentation_id, whole-kind. Every sub-type
#            is registry-declared with its own prefixed counter space (CUST_ /
#            OPS_ / SKU_ / INFRA_ — pairwise union-safe), and the engine
#            record_ids are the mess the election exists to hide: products mix
#            two upstream id-assignment schemes (measured: 44 short integer ids,
#            149 64-char hashes — seeded vs runtime-spawned creation paths), and
#            customers are 64-char hashes. Each dim keys on its registry code
#            and every FK renders the same surface; the fact's customer_id is a
#            two-hop `fk:` (decision -> session -> actor), which the election
#            re-renders — the `lookup` it replaces projected the raw prop__actor
#            hash and was the one join that previously blocked electing actor.
#            journey_instance and tick_decision carry no registry claim and stay
#            on their verbatim digit-string record ids (session_id, action_id).
#   HYGIENE  (realism QA) dim_product drops the generator's naming machinery
#            (identity_naming_style, designator — inputs to how product names
#            were minted, not catalogue attributes). dim_storefront drops
#            primary_ip / domain: constant on every row and drawn from reserved
#            documentation ranges (203.0.113.10 is RFC 5737 TEST-NET,
#            techmart.example.com an example.com name) — values a cold read
#            instantly flags as synthetic. The raw `*_ns` sim-epoch twins are
#            gone: every instant renders once, as a TIMESTAMP via the anchor.
#   DROPPED  journey_instance.output_roles — engine role bookkeeping, no domain
#            meaning. journey_instance's slice_only columns (state_entry_time,
#            complete, bound_roles) are not projectable in any mode; in dimensional
#            naming one is a hard refusal, so they simply appear nowhere here.
#
# TIME: the sidecar carries a `runtime` anchor (2022-03-01T00:00:00 UTC), so no
# `rebase:` block is needed. `derived: {timestamp: ...}` renders wallclock
# TIMESTAMPs through it. The fact carries a wallclock event time, so the
# point-in-time join against the SCD-2 dims' valid_from/valid_to is actually
# writable:
#   JOIN dim_customer d ON f.customer_id = d.customer_id
#                      AND f.occurred_at >= d.valid_from
#                      AND (f.occurred_at < d.valid_to OR d.valid_to IS NULL)
#
# ELECTED: dim_customer.birth_date is a clean upstream-minted date string
# (verified all 11,468 values match `%Y-%m-%d`, no NULLs), so it is declared
# via `date_parse` and reinterpreted as a real DATE — the same election
# source.yaml / base.yaml apply to the same column. dim_customer is
# `scd: type2`, which admits the per-record derived modes on a
# `temporal_class: constant` source: birth_date is a presentation property, so
# the sidecar marks it history_tracked, but its class is constant (it holds
# exactly its genesis row) and the value is therefore identical on every one
# of a customer's version rows.

mode: dimensional

# Every population presents as its registry-declared prefixed presentation key
# (see the KEYS decision above).
keys:
  actor: presentation_id
  entity: presentation_id

dimensional:
  tables:
    # --- dim: customer (the shopper) — SCD-2, total_purchases versions ---
    - name: dim_customer
      role: dim
      scd: type2
      source:
        grain: records
        kind: actor
        filter: {prop__actor_type: customer}
      key: [customer_id, valid_from]
      columns:
        # the elected surface: the CUST_-prefixed registry key (KEYS note)
        - {name: customer_id, from: presentation_id}
        - {name: acquisition_source, from: prop__acquisition_source}
        - {name: tier, from: prop__tier}
        - {name: segment, from: prop__segment}
        - {name: income, from: prop__income}
        - {name: age, from: prop__age}
        - {name: country, from: prop__country}
        # prop__store (the storefront reference) is NOT projected: one host in
        # this run, so it is a single constant value on every row (SPLIT note).
        - {name: total_purchases, from: prop__total_purchases}
        - {name: first_name, from: prop__first_name}
        - {name: last_name, from: prop__last_name}
        - {name: full_name, from: prop__name}
        - {name: city, from: prop__place_city}
        - {name: state_province, from: prop__place_subdivision}
        - {name: postal_code, from: prop__place_postal_code}
        - {name: area_code, from: prop__place_area_code}
        - name: birth_date
          derived:
            date_parse: {from: prop__birth_date, format: "%Y-%m-%d"}
        - {name: email, from: prop__email}
        - {name: username, from: prop__username}
        - {name: phone, from: prop__phone}
        - {name: street_address, from: prop__street_address}
        - {name: valid_from, derived: {scd_window: valid_from}}
        - {name: valid_to, derived: {scd_window: valid_to}}

    # --- dim: ops_agent (the storefront monitor bot) — Type-1, one row.
    #     The actor kind's other sub-type; projects exactly the ops partition of
    #     sub_type_columns. Its monitoring JOURNEY is dropped as engine mechanism
    #     (see the header); its output — the host's health timeline — is
    #     dim_storefront's SCD-2 versions. ---
    - name: dim_ops_agent
      role: dim
      scd: type1
      source:
        grain: records
        kind: actor
        filter: {prop__actor_type: ops}
      key: [agent_id]
      columns:
        - {name: agent_id, from: presentation_id}
        - {name: component, from: prop__component}

    # --- dim: product (the catalogue) — Type-1, every column constant ---
    - name: dim_product
      role: dim
      scd: type1
      source:
        grain: records
        kind: entity
        filter: {prop__entity_type: product}
      key: [product_id]
      columns:
        # the elected surface (keys: entity/product) — SKU_xxxxx, the registry's
        # uniform counter key space; the dim-key-agreement gate requires the
        # declared key to project it. No separate `sku` column: it would be an
        # exact duplicate of this one.
        - {name: product_id, from: presentation_id}
        - {name: product_name, from: prop__product_name}
        - {name: category, from: prop__category}
        - {name: price_cents, from: prop__price_cents}
        - {name: margin, from: prop__margin}
        # governs how often shoppers view / compare / cart / buy this item
        - {name: popularity, from: prop__popularity}
        - {name: brand, from: prop__identity_brand}
        - {name: product_line, from: prop__identity_line}
        - {name: brand_tier, from: prop__identity_tier}

    # --- dim: storefront (the serving host) — SCD-2: THE incident timeline ---
    #     status/error_rate are the only tracked columns in the entity kind; the
    #     atlas's five degradation events live in these versions.
    - name: dim_storefront
      role: dim
      scd: type2
      source:
        grain: records
        kind: entity
        filter: {prop__entity_type: infrastructure}
      key: [storefront_id, valid_from]
      columns:
        - {name: storefront_id, from: presentation_id}
        - {name: status, from: prop__status}
        - {name: error_rate, from: prop__error_rate}
        - {name: valid_from, derived: {scd_window: valid_from}}
        - {name: valid_to, derived: {scd_window: valid_to}}

    # --- dim: session — Type-1, shopping sessions only (see SEPARATE).
    #     Only what does NOT version about a session; its state-machine timeline
    #     is engine mechanism and is not exported (see the header). ---
    - name: dim_session
      role: dim
      scd: type1
      source:
        grain: records
        kind: journey_instance
        filter: {prop__journey_type: shopping_session}
      key: [session_id]
      columns:
        - {name: session_id, from: record_id}
        - {name: customer_id, fk: {to: dim_customer, via: reference}}
        - {name: customer_handle, from: prop__customer_handle}

    # --- fact: customer_action (the funnel event) — grain: one tick_decision.
    #     The site's observable clickstream, filtered to the six shopping
    #     actions (see SEPARATE). ---
    - name: fact_customer_action
      role: fact
      source:
        grain: records
        kind: tick_decision
        filter:
          prop__decision_type:
            [visit, product_view, add_to_cart,
             product_comparison, begin_checkout, purchase]
      key: [action_id]
      columns:
        - {name: action_id, from: record_id}
        - {name: session_id, fk: {to: dim_session, via: reference}}
        # the shopper, reached by the two-hop reference path decision -> session
        # -> actor, rendered in dim_customer's elected CUST_ key (KEYS note)
        - name: customer_id
          fk:
            to: dim_customer
            via: reference
            path: [prop__journey_instance, prop__actor]
        - {name: action_type, from: prop__decision_type}
        - {name: context, from: prop__context}
        # wallclock event time, so this fact is point-in-time joinable against the
        # SCD-2 dims' valid_from/valid_to windows
        - {name: occurred_at, derived: {timestamp: {source: created_sim_time}}}

    # --- fact: action_product (the binding bridge) — grain: one binding,
    #     product roles only (see SEPARATE). Single-pick roles contribute one
    #     row; the multi-pick compared_products role contributes one row per
    #     compared product, keyed by pick_index, so BOTH compared products
    #     survive. ---
    - name: fact_action_product
      role: fact
      source:
        grain: membership
        kind: tick_decision
        property: bindings           # membership__tick_decision__bindings
        where:
          elem__role_name: [viewed_product, carted_product, compared_products]
      key: [action_id, product_id, pick_index]
      columns:
        - {name: action_id, from: record_id}
        # Inherits entity/product's presentation_id election: SKU_xxxxx values.
        - name: product_id
          fk:
            to: dim_product
            via: membership
            member_field: entity
        - {name: binding_role, from: elem__role_name}
        - {name: pick_index, from: elem__pick_index}
        - {name: bound_at, derived: {timestamp: {source: joined_sim_time}}}
        # left_sim_time is not projected: no product binding is ever released
        # within the run, so the column is empty for all 92,357 rows.
