# ExportConfig — retail (TechMart) bundle, dimensional mode (star schema)
# ============================================================
# `fabulexa-forge export docs/examples/retail/bundle docs/examples/retail/dimensional.yaml`
#
# Adapted from `fabulexa-forge init docs/examples/retail/bundle`, then curated
# against the atlas. Curation decisions (the author judgment init can't make):
#
#   KEPT     tick_decision -> fact_customer_action. THE central retail call:
#            NHS excluded its `tick_decision` as engine bookkeeping, but here the
#            atlas is explicit that this is an EVENT-GRAIN "customer actions"
#            dataset and tick_decision IS that event — one row per funnel action
#            (view / cart / compare / checkout / purchase in `decision_type`),
#            inside a shopping_session, bound to the product(s) it acted on. That
#            is the grain of the whole star: a real fact, not noise. Kept, with
#            its journey FK (reference) wired in.
#   BRIDGE   the product binding is NOT an FK on fact_customer_action. The
#            `bindings` membership carries a MULTI-PICK role — `compared_products`
#            binds TWO products to one product_comparison decision (3,901
#            decisions, 7,802 bindings, ordered by elem__pick_index) — and
#            dimensional.md § "Membership-grain facts (multi-pick)" is explicit
#            that a multi-pick role's fact grain must be the BINDING, not the
#            owner. A membership-edge FK on the records grain is valid only for
#            SINGLE-pick roles; here it fanned the fact to 127,543 rows over
#            123,642 decisions, silently breaking `key: [id]`. So the bindings
#            become their own binding-grain fact, fact_action_product, carrying
#            ALL 93,799 bindings for every role uniformly (viewed_product,
#            carted_product, compared_products, store) — dropping a compared
#            product to force a 1:1 would be a fidelity violation.
#   SPLIT    actor -> dim_customer + dim_ops. record_roles.actor is an object
#            {customer: dimension, ops: dimension} — BOTH sub-types are
#            dimensions, so actor sub-type-SPLITS on the actor_type discriminator
#            into two narrow dims rather than one wide dim of mostly-null columns.
#            The commercial/demographic columns belong to the shopper; the ops
#            monitor bot carries only what it monitors (component / store), so
#            each dim keeps only its own meaningful columns. actor_type is
#            dropped from both (constant within each filtered table).
#   T1       dim_customer stays SCD-2 (total_purchases, the lifetime order count,
#            is class-tracked and genuinely versions per order); dim_ops is a
#            single automated agent with nothing that versions -> Type-1.
#   CONFORM  entity: kept as ONE conformed SCD-2 dimension with entity_type as
#            the discriminator attribute, NOT split. status/error_rate are
#            class-tracked (the storefront's health/incident timeline — the very
#            thing the atlas's incidents drive), so SCD-2 preserves that history;
#            product rows (all-constant) get a single version each. A per-type
#            split into dim_product / dim_infrastructure is possible, but the
#            sidecar carries no sub_type_columns, so the column->sub-type mapping
#            would be author guesswork; left conformed (as in the NHS template).
#   FACT     tick_decision: filled its columns + the journey FK (reference edge
#            prop__journey_instance) that init left as a commented stub; the
#            product binding stub became the fact_action_product bridge above.
#
# SCD-2 dims kept where a genuine attribute versions over time: dim_customer
# (total_purchases), dim_entity (status/error_rate), dim_journey_instance
# (current_state). journey_instance's slice_only columns (state_entry_time,
# complete, bound_roles) are auto-omitted — that omission is unconditional and
# happens whatever the author excludes; it is a notice, not an error.
#
# TIME: this emit's sidecar carries a `runtime` anchor (2022-03-01T00:00:00 UTC),
# so `derived: {scd_window: ...}` renders the dims' valid_from/valid_to as
# wallclock TIMESTAMPs. The fact's `occurred_at` is NOT comparable to them — see
# the note on that column.

mode: dimensional

dimensional:
  tables:
    # --- dim: actor sub-type 'customer' (shopper) — SCD-2 (total_purchases versions) ---
    - name: dim_customer
      role: dim
      scd: type2
      source:
        grain: records
        kind: actor
        filter: {prop__actor_type: customer}
      key: [id, valid_from]
      columns:
        - {name: id, from: record_id}
        - {name: presentation_id, from: presentation_id}
        - {name: acquisition_source, from: prop__acquisition_source}
        - {name: tier, from: prop__tier}
        - {name: segment, from: prop__segment}
        - {name: income, from: prop__income}
        - {name: age, from: prop__age}
        - {name: country, from: prop__country}
        - {name: store, from: prop__store}
        - {name: total_purchases, from: prop__total_purchases}
        - {name: first_name, from: prop__first_name}
        - {name: last_name, from: prop__last_name}
        - {name: name, from: prop__name}
        - {name: place_city, from: prop__place_city}
        - {name: place_subdivision, from: prop__place_subdivision}
        - {name: place_postal_code, from: prop__place_postal_code}
        - {name: place_area_code, from: prop__place_area_code}
        - {name: birth_date, from: prop__birth_date}
        - {name: email, from: prop__email}
        - {name: username, from: prop__username}
        - {name: phone, from: prop__phone}
        - {name: street_address, from: prop__street_address}
        - {name: valid_from, derived: {scd_window: valid_from}}
        - {name: valid_to, derived: {scd_window: valid_to}}

    # --- dim: actor sub-type 'ops' (storefront monitor bot) — Type-1 (nothing versions) ---
    - name: dim_ops
      role: dim
      scd: type1
      source:
        grain: records
        kind: actor
        filter: {prop__actor_type: ops}
      key: [id]
      columns:
        - {name: id, from: record_id}
        - {name: presentation_id, from: presentation_id}
        - {name: component, from: prop__component}
        - {name: store, from: prop__store}

    # --- dim: entity (products + storefront infrastructure) — conformed SCD-2 ---
    #     status/error_rate version (infra health/incident timeline); products
    #     are all-constant. entity_type is the discriminator ATTRIBUTE (kept,
    #     since this dim is conformed rather than split).
    - name: dim_entity
      role: dim
      scd: type2
      source:
        grain: records
        kind: entity
      key: [id, valid_from]
      columns:
        - {name: id, from: record_id}
        - {name: presentation_id, from: presentation_id}
        - {name: entity_type, from: prop__entity_type}
        - {name: category, from: prop__category}
        - {name: price_cents, from: prop__price_cents}
        - {name: popularity, from: prop__popularity}
        - {name: margin, from: prop__margin}
        - {name: product_name, from: prop__product_name}
        - {name: identity_brand, from: prop__identity_brand}
        - {name: identity_line, from: prop__identity_line}
        - {name: identity_naming_style, from: prop__identity_naming_style}
        - {name: identity_tier, from: prop__identity_tier}
        - {name: designator, from: prop__designator}
        - {name: status, from: prop__status}
        - {name: error_rate, from: prop__error_rate}
        - {name: primary_ip, from: prop__primary_ip}
        - {name: domain, from: prop__domain}
        - {name: valid_from, derived: {scd_window: valid_from}}
        - {name: valid_to, derived: {scd_window: valid_to}}

    # --- dim: journey_instance (shopping / ops sessions) — SCD-2 on current_state ---
    #     `actor` kept as a plain column, not an FK: journeys belong to BOTH
    #     customers (shopping_session) and the ops bot (storefront_ops), so an FK
    #     to either sub-type dim would dangle for the other's rows.
    - name: dim_journey_instance
      role: dim
      scd: type2
      source:
        grain: records
        kind: journey_instance
      key: [id, valid_from]
      columns:
        - {name: id, from: record_id}
        - {name: actor, from: prop__actor}
        - {name: journey_type, from: prop__journey_type}
        - {name: current_state, from: prop__current_state}
        - {name: output_roles, from: prop__output_roles}
        - {name: customer_handle, from: prop__customer_handle}
        - {name: valid_from, derived: {scd_window: valid_from}}
        - {name: valid_to, derived: {scd_window: valid_to}}

    # --- fact: customer_action (the funnel event) — grain: one tick_decision ---
    #     TRUE grain: one row per tick_decision. NO product FK here — the
    #     `bindings` membership carries a MULTI-PICK role (`product_comparison`
    #     binds two products per decision, ordered by elem__pick_index), so a
    #     membership-edge FK on this records grain would fan the fact out to one
    #     row per binding and break `key: [id]` (dimensional.md § Membership-grain
    #     facts). The product bindings live in fact_action_product below, at the
    #     binding grain, where every pick survives.
    - name: fact_customer_action
      role: fact
      source:
        grain: records
        kind: tick_decision
      key: [id]
      columns:
        - {name: id, from: record_id}
        # Raw sim-time nanosecond offset of the action. NOTE: this stays a raw
        # BIGINT — `derived: {timestamp: {source: created_sim_time}}` is refused
        # on a records grain (only `last_mutation_sim_time` is an accepted
        # timestamp source there), so the action's event time cannot currently be
        # rendered as a wallclock TIMESTAMP comparable to the SCD-2 dims'
        # valid_from/valid_to. Reported upstream as a forge gap.
        - {name: occurred_at, from: created_sim_time}
        # journey the action happened in — labeled reference edge
        - {name: journey_id, fk: {to: dim_journey_instance, via: reference}}
        - {name: decision_type, from: prop__decision_type}
        - {name: context, from: prop__context}

    # --- fact: action_product (the binding bridge) — grain: one binding ---
    #     One row per (tick_decision, bound product) from
    #     membership__tick_decision__bindings. Single-pick roles contribute one
    #     row; the multi-pick `product_comparison` role contributes one row per
    #     compared product, distinguished by pick_index — so BOTH compared
    #     products survive (dropping one would be a fidelity violation).
    - name: fact_action_product
      role: fact
      source:
        grain: membership
        kind: tick_decision
        property: bindings           # membership__tick_decision__bindings
      key: [action_id, product_id, pick_index]
      columns:
        - {name: action_id, from: record_id}
        # the bound member — FK to the conformed entity dim (member__entity__id)
        - name: product_id
          fk:
            to: dim_entity
            via: membership
            member_field: entity
        - {name: role_name, from: elem__role_name}
        - {name: pick_index, from: elem__pick_index}
        - {name: bound_at, derived: {timestamp: {source: joined_sim_time}}}
        - {name: joined_sim_time, from: joined_sim_time}
        - {name: left_sim_time, from: left_sim_time}
