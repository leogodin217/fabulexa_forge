# ExportConfig — retail (TechMart) bundle, source mode (operational OLTP tables)
# ============================================================
# `fabulexa-forge export docs/examples/retail/bundle docs/examples/retail/source.yaml <out> --fmt duckdb`
#
# Source mode DECLARES its own output shape (docs/architecture/source.md): each
# `tables[]` entry is a `state` table (current-state, one row per record) over a
# `kind:`, or a `junction` table over a `membership:` reference. History is opt-in
# through the single polymorphic `events:` log.
#
# `name:` is author-verbatim, and that is the whole point: the bundle's `kind:`
# values are the simulator's ontology, not TechMart's schema. No table below is
# named `entity`, `actor`, `journey_instance` or `tick_decision` — an app database
# has products and shopping sessions, not entities and journey instances. The
# mapping this config applies, taken from the atlas and `sub_type_columns`:
#
#   actor/customer          -> customer
#   actor/ops               -> ops_agent
#   entity/product          -> product
#   entity/infrastructure   -> storefront
#   journey_instance        -> shopping_session
#   tick_decision           -> customer_action
#   membership bindings     -> action_product
#   the event log           -> audit_log
#
# RENAMES (realism QA, aug11 round): the mapping above is applied to the
# VOCABULARY surfaces too — the naming gate failed this config because the
# tables were renamed while `audit_log.item_type` still declared raw kinds
# (`actor`, `entity`, `journey_instance`) and the FK columns kept engine names.
#   - The events sources split per sub-type so `item_type` carries the exported
#     table's own name (customer / ops_agent / product / storefront /
#     shopping_session) — actor and entity are split kinds, so one label per
#     kind could not name both halves.
#   - Per-table `rename:` puts reference columns on the <target_table>_id
#     convention (prop__actor -> customer_id, prop__journey_instance ->
#     session_id, prop__store -> storefront_id, the junction's record_id ->
#     customer_action_id, member id -> product_id) and de-simulates vocabulary
#     names (journey_type -> session_type, decision_type -> action_type,
#     pick_index -> position, joined/left -> bound_at/released_at).
#   - The junction drops its constant kind column (entity_kind='entity' on all
#     92,710 rows — one simulator word, zero information) via `columns:`.
#   - Per-source `rename:` keeps the `changes` payload keys in step with the
#     renamed state-table columns.
#   Renaming shopping_session.actor to customer_id accepts one known anomaly:
#   the single storefront_ops session's value is the OPS_ agent — the same
#   data-content quirk the ops row itself is, not a naming choice.
#
#   SPLIT  actor -> customer + ops_agent, two `state` tables over the same
#          `kind: actor`, each narrowed by its own `sub_types:`. They are
#          genuinely separate operational tables, not two views of one — measured
#          11,468 shoppers against a single ops agent, and `sub_type_columns`
#          gives them disjoint columns (the shopper's commercial and demographic
#          attributes; the agent's monitored component).
#   SPLIT  entity -> product + storefront, for the same reason: the partition
#          gives product 11 columns and infrastructure 5, overlapping only on
#          presentation_id. Measured 193 products against 1 storefront host. One
#          combined catalogue table would be NULL for the other's columns on every
#          row — a shape no app database would ship.
#   PLAIN  journey_instance -> shopping_session, tick_decision -> customer_action.
#          customer_action is untracked (an immutable funnel event — a create-only
#          spine, so its `state` table IS the full record) and therefore carries no
#          `events:` source.
#   JUNCTION action_product — which product each customer action was bound to.
#            Its owner record (the decision) is mechanism, but the binding itself
#            is domain data: it is the only place the base layer records which
#            product a view / cart / comparison acted on.
#
# The audit log is named `audit_log`, not `history`: `history` is the base layer's
# own table name, and reusing it inside the exported app database invites exactly
# the confusion this mode exists to avoid. Tracked-ness decides who is audited,
# independent of the state-table split above — actor (total_purchases), entity
# (status / error_rate), journey_instance (current_state).
#
# No kinds are omitted: retail has no simulation-mechanism kind to drop (there is
# no `queue`, and `tick_decision` is real event data here).
#
# Source is the first mode that REQUIRES a resolved wallclock anchor (the log's
# `occurred_at` and the junction's `joined_at` / `left_at` are real TIMESTAMPs).
# No rebase block is given, so the anchor falls back to the sidecar `runtime`
# (start 2022-03-01, UTC) — the emit's own clock. Uncomment `rebase:` to override.
#
# COLUMNS: `sub_types:` narrows the ROWS a table draws, but it does NOT narrow the
# columns — absent `columns:`, a sub-typed table still projects the whole kind's
# column set, so `product` would carry the storefront's status / error_rate /
# primary_ip / domain at 100% NULL and `storefront` would carry every product
# column the same way (verified by exporting it both ways). So each sub-typed
# table enumerates `columns:` from that sub-type's `sub_type_columns` partition,
# prefixed by the record lifecycle the source archetype wants — created_sim_time,
# active, deactivated_at, last_mutation_sim_time, which render as created_at,
# active, deactivated_at, updated_at. Tables whose kind has no sub-types keep the
# full projection.
#
# A `temporal_class: slice_only` column is auto-omitted with a notice whatever
# this config says; the export's `notice:` lines are the authoritative list.
#
# KEYS: actor and entity elect presentation_id — the app database presents its
# business identifiers, not the engine's internal record ids. The registry
# declares all four populations (CUST_/OPS_/SKU_/INFRA_ counter key spaces,
# unique within the emit, pairwise union-safe), which matters here because the
# bundle's record_id for products mixes two upstream id-assignment schemes (44
# short integers, 149 64-char hashes). Under the election each state table's
# `id` IS the presentation key (the standalone presentation_id column is
# absorbed — emitting both would duplicate it), and every referencing column
# renders its target's surface: shopping_session.actor -> CUST_/OPS_,
# customer.store -> INFRA_, the action_product member column -> SKU_ (INFRA_ on
# the one store-role binding), audit_log.item_id -> the audited population's
# key. journey_instance carries no registry claim and tick_decision's claim is
# a bare counter, so both keep record_id; their tables and edges are unchanged.
#
# Two columns are largely empty, and both are faithful rather than defects. The
# soft-delete `deactivated_at` is set only where something actually retires:
# measured, 13 of 193 products are withdrawn from the catalogue and 31,502 of
# 31,519 shopping sessions have ended, while no customer, storefront, ops agent or
# customer action is ever deactivated. And `action_product.left_at` is empty for
# all 92,710 rows because a product binding is never released once made.

mode: source

# Uniform shorthand: every declared sub-type of the kind elects the surface.
keys:
  actor: presentation_id
  entity: presentation_id

source:
  tables:
    - name: customer
      kind: actor
      sub_types: [customer]
      columns: [created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__first_name, prop__last_name, prop__name, prop__email, prop__username,
                prop__phone, prop__birth_date, prop__street_address, prop__place_city,
                prop__place_subdivision, prop__place_postal_code, prop__place_area_code,
                prop__country, prop__acquisition_source, prop__tier, prop__segment,
                prop__income, prop__store, prop__total_purchases]
      rename:
        prop__store: storefront_id
      # prop__birth_date is a plain upstream-minted date string (verified
      # %Y-%m-%d, 11,468/11,468, no NULLs) — declared, not sniffed.
      date_parse:
        prop__birth_date: "%Y-%m-%d"
    - name: ops_agent
      kind: actor
      sub_types: [ops]
      columns: [created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__component]
    - name: product
      kind: entity
      sub_types: [product]
      columns: [created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__product_name, prop__category, prop__price_cents, prop__margin,
                prop__popularity, prop__identity_brand, prop__identity_line,
                prop__identity_naming_style, prop__identity_tier, prop__designator]
    - name: storefront
      kind: entity
      sub_types: [infrastructure]
      columns: [created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__status, prop__error_rate, prop__primary_ip, prop__domain]
    # journey_instance is not sub-typed; `columns:` here drops `output_roles`,
    # which is engine role bookkeeping with no domain meaning.
    - name: shopping_session
      kind: journey_instance
      columns: [created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__actor, prop__journey_type, prop__current_state, prop__customer_handle]
      rename:
        prop__actor: customer_id
        prop__journey_type: session_type
    - name: customer_action
      kind: tick_decision
      rename:
        prop__journey_instance: session_id
        prop__decision_type: action_type
    - name: action_product
      membership: {kind: tick_decision, property: bindings}
      columns: [joined_sim_time, left_sim_time, elem__role_name,
                member__entity__id, elem__pick_index]
      rename:
        record_id: customer_action_id
        member__entity__id: product_id
        elem__pick_index: position
        joined_sim_time: bound_at
        left_sim_time: released_at
  events:
    name: audit_log
    sources:
      - kind: actor
        sub_types: [customer]
        item_type: customer
        rename:
          store: storefront_id
      - kind: actor
        sub_types: [ops]
        item_type: ops_agent
      - kind: entity
        sub_types: [product]
        item_type: product
      - kind: entity
        sub_types: [infrastructure]
        item_type: storefront
      - kind: journey_instance
        item_type: shopping_session
        rename:
          actor: customer_id
          journey_type: session_type

