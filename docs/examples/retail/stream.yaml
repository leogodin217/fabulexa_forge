# StreamConfig — retail bundle, mixer smoke test (<kind>_type sub-type routing)
# ============================================================
# Drives `fabulexa-forge mixer` / `fabulexa-forge stream` over the retail emit at
# docs/examples/retail/bundle/.
#
# Sub-typing is driven by the `<kind>_type` discriminator domain in enum_domains,
# NOT by record_roles. A kind whose `<kind>_type` domain is non-empty is sub-typed:
# its routing leaf (`route_table`, the Layer-A attribute) is the discriminator value
# — one leaf per declared sub-type, not the bare kind. A kind with no `<kind>_type`
# domain is not sub-typed: its route_table is the kind itself.
#
# Retail discriminator domains (enum_domains) -> the route_table leaves each kind emits:
#   actor:  actor_type = [customer]                 -> sub-typed -> `customer`
#   entity: entity_type = [product, infrastructure] -> sub-typed -> `product`, `infrastructure`
#   journey_instance: (no journey_instance_type)    -> not sub-typed -> `journey_instance`
#
# Each declared stream names its own topic; the topic set is FOUR topics:
#   retail.customer         (actor; its single declared sub-type)
#   retail.product          (entity sub-type)
#   retail.infrastructure   (entity sub-type)
#   retail.journey_instance (not sub-typed)
#
# NOTE — entity gets two declared streams, one per sub-type, because
# `entity_type` has domain [product, infrastructure]; sub-typing follows that
# discriminator domain regardless of entity's bare-string warehouse role in
# record_roles. To stream only one entity sub-type, declare a single stream
# scoped to it via `sub_types: [product]` (see the subtype-select recipe).
#
# Anchor resolves from the sidecar runtime (start 2022-03-01, UTC). Bootstrap is
# supplied at the CLI (`--bootstrap-servers localhost:9092`).

content: state-changes

streams:
  - name: retail.customer      # actor_type=[customer] -> sub-typed -> route_table = `customer`
    kind: actor
    sub_types: [customer]      # explicit sub-type selection (the only declared value)
    properties: [tier, segment, total_purchases]
  - name: retail.product       # entity_type=[product,infrastructure] -> one stream per sub-type
    kind: entity
    sub_types: [product]
    properties: [category, price_cents, status]
  - name: retail.infrastructure
    kind: entity
    sub_types: [infrastructure]
    properties: [category, price_cents, status]
  - name: retail.journey_instance  # no <kind>_type domain -> not sub-typed
    kind: journey_instance
    properties: [current_state]
