# StreamConfig — retail (TechMart) bundle, mixer smoke test
# ============================================================
# Drives `fabulexa-forge mixer` / `fabulexa-forge stream` over the retail emit at
# docs/examples/retail/bundle/.
#
# VOCABULARY (parity with source.yaml): topics, envelope kinds, payload keys and
# identity surfaces all speak the app database's schema — the same mapping
# source.yaml applies (actor/customer -> customer, entity/product -> product,
# entity/infrastructure -> storefront, journey_instance -> shopping_session):
#   - Sub-typing follows the `<kind>_type` discriminator domain in enum_domains:
#     actor_type = [customer, ops] and entity_type = [product, infrastructure]
#     are sub-typed; journey_instance has no domain and is not.
#   - actor and entity are SPLIT kinds, so one `kind_labels` entry per kind
#     could not name both halves — each stream declares its own `kind_label`,
#     mirroring source.yaml's per-source `item_type` (the same reasoning).
#   - `keys:` is source.yaml's block verbatim: customer events key on the CUST_
#     business id and product/storefront on SKU_/INFRA_ (each table's `id` in
#     the app database); shopping_session keeps record_id — journey_instance
#     carries no registry claim, exactly as in source.
#   - PARTITIONS: each sub-typed stream projects only its own
#     `sub_type_columns` — the previous revision projected `status` (the
#     storefront's) on product events and category/price_cents (the product's)
#     on storefront events, all-NULL payload entries on every row.
#   - `ignore:` mirrors audit_log hygiene: the generator's naming machinery
#     (identity_naming_style, designator) stays out of product's change scope,
#     and the storefront's reserved-range primary_ip / domain out of its own —
#     the same columns source.yaml ignores on those audit sources.
#
# actor/ops (the single ops agent) has no stream of its own — untracked apart
# from genesis rows. Its storefront_ops JOURNEY does ride retail.shopping_session
# (customer_id OPS_001, session_type storefront_ops): the app database's
# shopping_session table carries the same row, source.yaml's documented known
# anomaly, and the stream faithfully matches it. Filter session_type in both
# or neither.
#
# Topic set — FOUR topics:
#   retail.customer          (actor/customer)  — total_purchases over time
#   retail.product           (entity/product)  — catalogue creates (no tracked
#                                                product prop changes post-create)
#   retail.storefront        (entity/infrastructure) — status / error_rate,
#                                                the ops health strip
#   retail.shopping_session  (journey_instance) — funnel state c/u/d, busiest
#
# Anchor resolves from the sidecar runtime (start 2022-03-01, UTC). Bootstrap is
# supplied at the CLI (`--bootstrap-servers localhost:9092`).

content: state-changes

# source.yaml's elections, verbatim — stream identities join the app database.
keys:
  actor: presentation_id
  entity: presentation_id

streams:
  - name: retail.customer
    kind: actor
    sub_types: [customer]
    properties: [tier, segment, total_purchases]
    kind_label: customer
  - name: retail.product
    kind: entity
    sub_types: [product]
    properties: [product_name, category, price_cents]
    kind_label: product
    ignore: [identity_naming_style, designator]
  - name: retail.storefront
    kind: entity
    sub_types: [infrastructure]
    properties: [status, error_rate]
    kind_label: storefront
    ignore: [primary_ip, domain]
  - name: retail.shopping_session
    kind: journey_instance
    properties: [current_state, actor, journey_type]
    rename:
      actor: customer_id
      journey_type: session_type
    kind_label: shopping_session
