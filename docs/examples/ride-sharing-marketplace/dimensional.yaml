# ExportConfig — ride-sharing marketplace, dimensional mode (star schema)
# ============================================================
# `fabulexa-forge export docs/examples/ride-sharing-marketplace/bundle docs/examples/ride-sharing-marketplace/dimensional.yaml <out> --fmt duckdb`
#
# Started from `fabulexa-forge init docs/examples/ride-sharing-marketplace/bundle`,
# then curated against the atlas. This is a TWO-SIDED COUPLED MARKET, so the star
# is: both sides as dimensions, the match between them as a fact, and each side's
# lifecycle as a state-timeline fact. Every count in this log was measured against
# THIS emit.
#
# Curation decisions (the author judgment init can't make):
#
#   SPLIT    actor -> dim_rider + dim_driver. `sub_type_columns.actor` partitions
#            into rider (23 columns) and driver (20), sharing only identity,
#            status, zone, loyalty_band and basic contact. Measured 2,533 riders
#            and 2,048 drivers. One conformed actor dim would be NULL for the
#            other side's columns on every row.
#   DIM      ...and both sides are DIMENSIONS, not facts. `record_roles` declares
#            actor `{driver: fact, rider: fact}` — that is the simulation's
#            ontology, where riders and drivers are the active agents on the clock.
#            It is not the warehouse's. Each side carries ~20 descriptive
#            attributes (names, contact, home address, payment card; vehicle make/
#            model/year/colour, licence plate) and is the thing you slice BY. The
#            measurable events of this market are the matches and the lifecycle
#            transitions, and those are the facts below. Making the agents
#            dimensions is also what lets fact_pairing carry real FKs instead of
#            bare id columns.
#   DIM->T1  ...and both are TYPE-1, carrying each agent's constant description
#            plus its current tier. This is the one call worth explaining, because
#            the obvious choice is SCD-2 and it is wrong here.
#            An SCD-2 dim versions on every tracked change the RECORD makes, not
#            merely on the columns the table happens to project — so it cannot be
#            narrowed by leaving churny columns out. Measured directly: SCD-2 over
#            these agents yields 20,643 versions for 2,533 riders (8.1 each) and
#            12,105 for 2,048 drivers, and removing the running counters from the
#            projection changes neither number. The versions are driven by
#            `status` (29,642 history rows) and `zone` (7,691) — operational
#            state, exactly the NHS `resource.allocated` judgment.
#            So the agents are Type-1 reference data and their timelines become
#            facts: lifecycle state in fact_session_state, tier movement in
#            fact_loyalty_band. Nothing is lost — every version still exists, at
#            the grain where it belongs.
#   KEYS     actor and entity elect `record_index`. The engine's `record_id` for
#            actor is a 64-hex content hash — simulator identity, not anything an
#            operator's database would key riders on — and the registry's
#            presentation keys for rider and driver are bare prefixless counters,
#            union-unsafe with each other (both count 1,2,3...), so
#            `presentation_id` cannot serve either a combined edge or a uniform
#            election. `record_index` gives every agent and zone a compact
#            integer key; the dims key on it and every FK edge inherits it. The
#            bare-counter presentation columns (rider_code / driver_code /
#            zone_code) are dropped outright — a second integer spelling of the
#            same identity, carrying no domain information beside the elected key.
#   HYGIENE  Dropped from the star: the zone selection weights (origin_weight /
#            dest_weight / base_weight — the generator's draw weights, not zone
#            attributes; measured origin_weight == base_weight on all 3 zones),
#            rider `propensity` and driver `strategy` (the generator's behavior
#            classes steering loyalty accrual and dispatch acceptance — simulation
#            machinery, invisible to an operator), and rider `home_subdivision`
#            (measured equal to `home_state` on all 2,533 riders; the survivor
#            keeps the domain name home_state). The raw `*_ns` sim-epoch twins
#            are gone too: every instant renders once, as a TIMESTAMP via the
#            anchor, and the interval facts key on `entered_at` — measured zero
#            sessions or agents with two state changes in the same microsecond,
#            so the truncation from nanoseconds costs no key uniqueness.
#   FACT     actor.loyalty_band -> fact_loyalty_band, history_interval grain. The
#            loyalty ladder is the churn story the atlas is built around ("bad
#            service drives churn"), and at interval grain each row is one tenure
#            in one band, with entered/exited. Measured 1,940 band changes beyond
#            genesis across 4,581 agents.
#            `ride_count` (riders, measured range 0..17) and `session_rides`
#            (drivers, 0..9) stay out of the star entirely: they are running
#            counters advancing once per completed trip (3,118 changes each) —
#            measures recoverable by counting facts, not descriptive attributes.
#   FACT     journey_instance -> fact_session_state, NOT a dimension. Measured:
#            8,574 sessions against 53,253 `current_state` history rows — 6.2
#            versions each. Its only tracked property is a state-machine position,
#            so its value is the timeline. This is where the market's emergent
#            quantities live — measured off this fact: rider wait is time in
#            `waiting` (2,147 occupancies, mean 594s), idle supply is driver time
#            in `available` (8,302, mean 1,245s), dispatch hesitation is
#            `reviewing` (4,963 — exactly one per match, mean 10s), and churn is
#            arrival in `lapsed` (3,408).
#            NOTE the atlas documents a rider `seeking` state, but this run never
#            enters it: the 14 state values actually present are requesting,
#            waiting, enroute, arrived, on_trip, tally, idle, penalty, lapsed and
#            the five driver states. Read the data, not only the atlas.
#   ONE      fact_session_state is ONE table, not one per side. The two lifecycles
#            have disjoint state vocabularies (measured: 2,048 driver_journey and
#            6,526 rider_journey rows) but an identical shape — id, state, entered,
#            exited — so conforming them costs no NULL columns. `session_type`
#            rides on the fact to separate them, and `filter` is records-only so it
#            could not split them at this grain anyway. Its agent identity is the
#            rider_id / driver_id FK pair over the session's `prop__actor` edge:
#            each edge resolves only inside its own dim's population, so exactly
#            one of the pair is set per row — filter by session_type (or by which
#            FK is non-NULL) and join that side's dim.
#   FACT     pairing -> fact_pairing, the rider<->driver match — the distinctive
#            join of this marketplace. Measured 4,963 matches; every one has a
#            rider as `requester` and a driver as `counterpart`, so both FKs are
#            safe and neither dangles.
#   DIM->T1  entity -> dim_zone, Type-1. init proposed SCD-2 because
#            demand_pressure / supply_pressure are history-tracked, but those are
#            the per-zone surge SIGNAL — operational state that moves every tick,
#            not a descriptive attribute. Dropped from the star (they are what the
#            stream and source exports carry); what remains is constant reference
#            data. Measured 3 zones. `entity_type` is dropped as well: entity has
#            exactly one sub-type here, so the column is a constant on all 3 rows.
#   DROPPED  journey_instance.bound_roles / output_roles — internal coupling
#            bookkeeping, opaque, no domain meaning. state_entry_time and complete
#            are slice_only and not projectable in any mode.
#
# DESCRIPTIONS: per-column `description:` overrides replace the engine-voiced
# inherited prose (creation-order ordinals, sim-time phrasing, copy-pasted place
# blobs) with domain sentences a data-engineering learner can read cold.
#
# TIME: the sidecar carries a `runtime` anchor (2026-01-09T00:00:00 UTC), so no
# `rebase:` block is needed. A records grain accepts three structural instant
# sources — `created_sim_time`, `deactivated_at` and `last_mutation_sim_time` — so
# fact_pairing carries both the instant a match opened and the instant it closed,
# and their difference is match duration. Measured: all 4,963 matches are closed
# at tape's end, so `closed_at` is never NULL in this emit.
#
# Because the agent dims are Type-1, joining a fact to them is a plain equi-join
# on the agent key — no point-in-time predicate needed. Where an analyst wants the
# tier an agent held AT the moment of a match, that is the interval fact:
#   JOIN fact_loyalty_band b ON b.rider_id = f.rider_id
#                           AND f.matched_at >= b.entered_at
#                           AND (b.exited_at IS NULL OR f.matched_at < b.exited_at)
#
# ELECTED: dim_rider.date_of_birth / dim_driver.date_of_birth are plain VARCHAR
# properties, not derived timestamps — minted upstream as date strings, never
# touching sim_time or the anchor. Verified clean `%Y-%m-%d` values for both
# populations, so each is declared via `date_parse` and reinterpreted as a real
# DATE. Both dims are Type-1, so the election is the plain records-grain case;
# retail's dim_customer applies the same election on a `scd: type2` table.

mode: dimensional

keys:
  actor: record_index
  entity: record_index

dimensional:
  tables:
    # --- dim: zone (the spatial grain) — Type-1; pressure signals are state ---
    - name: dim_zone
      role: dim
      scd: type1
      source:
        grain: records
        kind: entity
      key: [zone_id]
      columns:
        - name: zone_id
          from: record_index
          description: Unique integer identifier of the zone.
        - name: zone_name
          from: prop__name
          description: "The zone's display name: Downtown, Midtown, or Riverside."
        - name: place_city
          from: prop__place_city
          description: City the zone covers.
        - name: place_subdivision
          from: prop__place_subdivision
          description: Two-letter state code of the zone's city.
        - name: place_postal_code
          from: prop__place_postal_code
          description: Postal code of the zone.
        - name: place_area_code
          from: prop__place_area_code
          description: Phone area code of the zone.

    # --- dim: rider (demand side) — Type-1; tier movement is fact_loyalty_band ---
    - name: dim_rider
      role: dim
      scd: type1
      source:
        grain: records
        kind: actor
        filter: {prop__actor_type: rider}
      key: [rider_id]
      columns:
        - name: rider_id
          from: record_index
          description: Unique integer identifier of the rider.
        - {name: account_id, from: prop__account_id}
        - {name: first_name, from: prop__first_name}
        - {name: last_name, from: prop__last_name}
        - {name: email, from: prop__email}
        - {name: phone, from: prop__phone}
        - name: date_of_birth
          derived: {date_parse: {from: prop__date_of_birth, format: "%Y-%m-%d"}}
        - {name: home_street, from: prop__home_street}
        - {name: home_state, from: prop__home_state}
        - name: home_city
          from: prop__home_place_city
          description: City of the rider's home address.
        - name: home_postal_code
          from: prop__home_place_postal_code
          description: Postal code of the rider's home address.
        - name: home_area_code
          from: prop__home_place_area_code
          description: Phone area code of the rider's home address.
        - {name: payment_card, from: prop__payment_card}
        - {name: app_user_agent, from: prop__app_user_agent}
        # current tier; its history is fact_loyalty_band
        - name: loyalty_band
          from: prop__loyalty_band
          description: >-
            The rider's current loyalty tier — new, silver, or gold. It climbs
            with completed rides and drops after a no-show, decline, or
            abandoned request; tier history is in fact_loyalty_band.
        # habitual destination zone (constant)
        - name: dest_zone_id
          fk: {to: dim_zone, via: reference, path: [prop__dest_zone]}
          description: >-
            The zone where the rider's trips usually end; joins
            dim_zone.zone_id.

    # --- dim: driver (supply side) — Type-1; tier movement is fact_loyalty_band ---
    - name: dim_driver
      role: dim
      scd: type1
      source:
        grain: records
        kind: actor
        filter: {prop__actor_type: driver}
      key: [driver_id]
      columns:
        - name: driver_id
          from: record_index
          description: Unique integer identifier of the driver.
        # the operator's own driver reference, distinct from the record identity
        - {name: driver_reference, from: prop__driver_id}
        - {name: full_name, from: prop__full_name}
        - {name: first_name, from: prop__first_name}
        - {name: last_name, from: prop__last_name}
        - name: phone
          from: prop__phone
          description: The driver's phone number.
        - name: date_of_birth
          derived: {date_parse: {from: prop__date_of_birth, format: "%Y-%m-%d"}}
        - {name: vehicle_make, from: prop__vehicle_make}
        - {name: vehicle_model, from: prop__vehicle_model}
        - {name: vehicle_year, from: prop__vehicle_year}
        - {name: vehicle_color, from: prop__vehicle_color}
        - {name: license_plate, from: prop__license_plate}
        # current tier; its history is fact_loyalty_band
        - name: loyalty_band
          from: prop__loyalty_band
          description: >-
            The driver's current loyalty tier — new, silver, or gold; tier
            history is in fact_loyalty_band.
        # home base zone (constant)
        - name: base_zone_id
          fk: {to: dim_zone, via: reference, path: [prop__base_zone]}
          description: >-
            The driver's home zone — where they log on and return when idle;
            joins dim_zone.zone_id.

    # --- fact: pairing (the match) — grain: one rider<->driver match ---
    - name: fact_pairing
      role: fact
      source:
        grain: records
        kind: pairing
      key: [pairing_id]
      columns:
        - name: pairing_id
          from: record_index
          description: Unique integer identifier of the match.
        # requester is always a rider, counterpart always a driver (measured
        # across all 4,963 matches), so both edges resolve
        - name: rider_id
          fk: {to: dim_rider, via: reference, path: [prop__requester]}
          description: The matched rider; joins dim_rider.rider_id.
        - name: driver_id
          fk: {to: dim_driver, via: reference, path: [prop__counterpart]}
          description: The matched driver; joins dim_driver.driver_id.
        - name: match_type
          from: prop__match_type
          description: >-
            What kind of match this is; every match in this dataset is a
            ride_match — one rider dispatched to one driver for one trip.
        # opened and closed — their difference is how long the match was held
        - name: matched_at
          derived: {timestamp: {source: created_sim_time}}
          description: When the rider and driver were matched.
        - name: closed_at
          derived: {timestamp: {source: deactivated_at}}
          description: >-
            When the match was released — the trip finished or fell through;
            NULL if still open.

    # --- fact: session state (history_interval grain) — one row per state
    #     occupancy, both sides of the market. Rider wait = time in waiting;
    #     idle supply = driver time in available; churn = reaching lapsed.
    - name: fact_session_state
      role: fact
      source:
        grain: history_interval
        kind: journey_instance
        property: current_state
      key: [session_id, entered_at]
      columns:
        - name: session_id
          from: record_id
          description: Unique identifier of the session this state belongs to.
        # the session's agent, rendered in its own dim's elected key: exactly one
        # of the pair is set per row (a rider on rider_journey rows, a driver on
        # driver_journey rows) — filter by session_type, then join that dim.
        - name: rider_id
          fk: {to: dim_rider, via: reference, path: [prop__actor]}
          description: >-
            The rider whose session this is; set on rider_journey rows, NULL
            on driver_journey rows. Joins dim_rider.rider_id.
        - name: driver_id
          fk: {to: dim_driver, via: reference, path: [prop__actor]}
          description: >-
            The driver whose session this is; set on driver_journey rows, NULL
            on rider_journey rows. Joins dim_driver.driver_id.
        - name: session_type
          lookup: {property: journey_type}
          description: >-
            Which side's session this is — rider_journey (a rider's trip
            through the app) or driver_journey (a driver's shift).
        - name: state
          from: value
          description: >-
            The lifecycle state the session occupied during this interval —
            e.g. waiting, enroute, or on_trip for riders; available or driving
            for drivers.
        - name: entered_at
          derived: {timestamp: {source: sim_time}}
          description: When the session entered this state.
        # lead_sim_time = LEAD(sim_time): NULL on the session's last (open) state
        - name: exited_at
          derived: {timestamp: {source: lead_sim_time}}
          description: When the session left this state; NULL if still in it.

    # --- fact: loyalty band (history_interval grain) — one row per tenure in one
    #     tier. The churn ladder: how long an agent held a band, which band it fell
    #     to after a bad outcome, and how tier movement tracks lapse.
    - name: fact_loyalty_band
      role: fact
      source:
        grain: history_interval
        kind: actor
        property: loyalty_band
      key: [rider_id, driver_id, entered_at]
      columns:
        # the agent itself, rendered in its own dim's elected key: the fk is the
        # zero-hop self edge, resolving only inside each dim's population, so
        # exactly one of the pair is set per row
        - name: rider_id
          fk: {to: dim_rider, via: reference}
          description: >-
            The rider who held this tier; NULL on driver rows. Joins
            dim_rider.rider_id.
        - name: driver_id
          fk: {to: dim_driver, via: reference}
          description: >-
            The driver who held this tier; NULL on rider rows. Joins
            dim_driver.driver_id.
        # rider or driver — join the matching dim
        - name: user_type
          lookup: {property: actor_type}
          description: "Which side of the market this row describes: rider or driver."
        - name: loyalty_band
          from: value
          description: "The loyalty tier held during this interval: new, silver, or gold."
        - name: entered_at
          derived: {timestamp: {source: sim_time}}
          description: When the rider or driver entered this tier.
        # NULL on the agent's current (open) band
        - name: exited_at
          derived: {timestamp: {source: lead_sim_time}}
          description: >-
            When the rider or driver left this tier; NULL if it is still their
            current tier.
