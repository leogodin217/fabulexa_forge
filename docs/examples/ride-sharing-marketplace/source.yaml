# ExportConfig — ride-sharing marketplace, source mode (operational OLTP tables)
# ============================================================
# `fabulexa-forge export docs/examples/ride-sharing-marketplace/bundle docs/examples/ride-sharing-marketplace/source.yaml <out> --fmt duckdb`
#
# Source mode DECLARES its own output shape (docs/architecture/source.md): each
# `tables[]` entry is a `state` table (current-state, one row per record) over a
# `kind:`. History is opt-in through the single polymorphic `events:` log.
#
# This is a TWO-SIDED COUPLED MARKET (see dimensional.yaml), so the declared
# tables are both sides, the zones they move through, and the match that joins
# them. `name:` is author-verbatim, and the bundle's `kind:` values are the
# simulator's ontology, not a marketplace's schema:
#
#   actor/rider             -> rider
#   actor/driver            -> driver
#   entity/zone_market      -> zone
#   journey_instance        -> user_session
#   pairing                 -> match
#   the event log           -> audit_log
#
# RENAMES (realism QA, aug11 round): the mapping above is applied to the
# VOCABULARY surfaces too — the naming gate failed this config because the
# tables were renamed while `audit_log.item_type` still declared raw kinds and
# the FK columns kept engine names.
#   - `agent_journey` -> `user_session`: "agent" and "journey" are both
#     simulator words. The kind has NO declared sub-types (journey_type is a
#     plain property, not the discriminator), so the rider/driver lifecycles
#     cannot be split into two tables; `user_session` is the app-database name
#     that honestly covers both (a rider's trip session, a driver's shift
#     session), with user_id / session_type as its columns. The
#     rider_journey/driver_journey VALUES are data and stay — values are the
#     base layer's, not the config's to rewrite.
#   - The events sources split per actor sub-type so `item_type` carries the
#     exported table's own name (rider / driver / zone / user_session).
#   - Per-table `rename:` puts reference columns on the <target_table>_id
#     convention: match.requester -> rider_id and match.counterpart ->
#     driver_id (verified: all 4,969 matches pair a rider requester with a
#     driver counterpart), zone refs -> zone_id / dest_zone_id / base_zone_id.
#   - Per-source `rename:` keeps the `changes` payload keys in step.
#
#   SPLIT  actor -> rider + driver, two `state` tables over the same `kind: actor`
#          (one shared wide records table, `actor_type` discriminator), each
#          narrowed by its own `sub_types:`. Measured 2,552 riders and 1,987
#          drivers, and `sub_type_columns` gives them 23 and 20 columns
#          respectively — overlapping on identity, status, zone, loyalty_band and
#          basic contact, but disjoint on everything that matters (the rider's
#          account, payment card and home address; the driver's vehicle, licence
#          plate and strategy).
#   PLAIN  zone (this market's one entity sub-type), agent_journey (both
#          lifecycles — measured 6,582 rider journeys and 1,987 driver journeys),
#          and match — the rider<->driver pairing record. `match` is untracked, so
#          it carries no `events` source. Its domain name comes straight from the
#          atlas ("tied by an actor-to-actor match"); `pairing` is the simulator's
#          word for it.
#
# Every kind here is operational domain data — this bundle declares no mechanism
# kinds (no tick_decision, no queue) and no membership tables at all, so there are
# no junctions to declare.
#
# COLUMNS: `sub_types:` narrows the ROWS a table draws but NOT its columns —
# absent `columns:`, `rider` would carry the driver's vehicle_make and
# license_plate at 100% NULL and `driver` would carry the rider's payment_card the
# same way. Both therefore enumerate `columns:` from their own partition, prefixed
# by the record lifecycle the source archetype wants — created_sim_time, active,
# deactivated_at, last_mutation_sim_time, rendering as created_at, active,
# deactivated_at, updated_at. `agent_journey` enumerates too, to drop
# `output_roles` and `bound_roles` (internal coupling bookkeeping, opaque, no
# domain meaning). `zone` and `match` keep the full projection.
#
# A `temporal_class: slice_only` column is auto-omitted with a notice whatever
# this config says — here agent_journey's state_entry_time and complete. The
# export's `notice:` lines are the authoritative list.
#
# `deactivated_at` comes out largely empty, and that is faithful: measured, 1,981
# of 1,987 drivers log off and are deactivated, while no rider and no zone ever
# is — riders lapse out of the market by reaching a terminal journey state, not by
# being retired as records.
#
# History is opt-in and tracked-ness decides who is audited: actor (status, zone,
# ride_count, loyalty_band, session_earnings), entity (demand_pressure /
# supply_pressure — the per-zone surge signals), journey_instance (current_state).
#
# Source is the first mode that REQUIRES a resolved wallclock anchor (the log's
# `occurred_at` is a real TIMESTAMP). No rebase block is given, so the anchor
# falls back to the sidecar `runtime` (start 2026-01-09, UTC) — the emit's own
# clock. Uncomment `rebase:` to override origin/zone.

mode: source

source:
  tables:
    - name: rider
      kind: actor
      sub_types: [rider]
      columns: [presentation_id, created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__account_id, prop__first_name, prop__last_name, prop__email, prop__phone,
                prop__date_of_birth, prop__home_street, prop__home_state, prop__home_place_city,
                prop__home_place_subdivision, prop__home_place_postal_code,
                prop__home_place_area_code, prop__payment_card, prop__app_user_agent,
                prop__propensity, prop__status, prop__zone, prop__dest_zone,
                prop__ride_count, prop__loyalty_band]
      rename:
        prop__zone: zone_id
        prop__dest_zone: dest_zone_id
      # prop__date_of_birth is a plain upstream-minted date string (verified
      # %Y-%m-%d, no exceptions) — declared, not sniffed.
      date_parse:
        prop__date_of_birth: "%Y-%m-%d"
    - name: driver
      kind: actor
      sub_types: [driver]
      columns: [presentation_id, created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__driver_id, prop__full_name, prop__first_name, prop__last_name,
                prop__phone, prop__date_of_birth, prop__vehicle_make, prop__vehicle_model,
                prop__vehicle_year, prop__vehicle_color, prop__license_plate,
                prop__strategy, prop__status, prop__zone, prop__base_zone,
                prop__session_rides, prop__loyalty_band]
      rename:
        prop__zone: zone_id
        prop__base_zone: base_zone_id
      date_parse:
        prop__date_of_birth: "%Y-%m-%d"
    - name: zone
      kind: entity
    - name: user_session
      kind: journey_instance
      columns: [created_sim_time, active, deactivated_at, last_mutation_sim_time,
                prop__actor, prop__journey_type, prop__current_state]
      rename:
        prop__actor: user_id
        prop__journey_type: session_type
    - name: match
      kind: pairing
      rename:
        prop__requester: rider_id
        prop__counterpart: driver_id
  events:
    name: audit_log
    sources:
      - kind: actor
        sub_types: [rider]
        item_type: rider
        rename:
          zone: zone_id
          dest_zone: dest_zone_id
      - kind: actor
        sub_types: [driver]
        item_type: driver
        rename:
          zone: zone_id
          base_zone: base_zone_id
      - kind: entity
        item_type: zone
      - kind: journey_instance
        item_type: user_session
        rename:
          actor: user_id
          journey_type: session_type

# rebase:
#   base_date: 2024-01-01
#   timezone: America/New_York
