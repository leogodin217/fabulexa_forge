# ExportConfig — ride-sharing bundle, base mode (flat current-state dump)
# ============================================================
# `fabulexa-forge export docs/examples/ride-sharing/bundle docs/examples/ride-sharing/base.yaml`
#
# Base mode reconstructs one flat table per records kind at the tape's end:
# every tracked property (actor.status, journey_instance.current_state,
# resource.allocated) carries its LATEST history value. No genre split, no
# sub-type split, no FK joins — the faithful "current state of every record"
# landing shape. `record_id` presents as `id`; every other column is
# presentation-verbatim.
#
# The only author decision here is which kinds to drop. We exclude the two
# simulation-MECHANISM kinds — they are engine bookkeeping, not marketplace data:
#   tick_decision — the engine's per-tick matching-decision log (decision_type,
#                   context). An audit trail of the simulator, not the trust. It
#                   is not even a declared type in the atlas.
#   queue         — the single internal shared-fleet wait queue (discipline,
#                   on_full, region). The wait it models is domain-real, but the
#                   queue RECORD itself carries no marketplace-meaningful
#                   attributes — it is the mechanism, not the data.
# Everything domain-meaningful survives: actor (trips), entity (riders + zones),
# journey_instance (trip lifecycles), resource (drivers).
#
# Anchor is optional for base — omitted here, so lifecycle timestamps stay raw
# sim-time ns. Add a `rebase:` block (see source.yaml) to land wallclock dates.

mode: base

base:
  exclude:
    kinds: [tick_decision, queue]
