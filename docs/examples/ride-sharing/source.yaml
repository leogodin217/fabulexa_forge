# ExportConfig — ride-sharing bundle, source mode (operational OLTP tables)
# ============================================================
# `fabulexa-forge export docs/examples/ride-sharing/bundle docs/examples/ride-sharing/source.yaml`
#
# Source mode classifies every table into a genre from record_roles ×
# temporal_class, with NO author declaration of genre:
#   - tracked kinds (a class-`tracked` prop) -> wide CDC CHANGE-LOG tables
#     (op / changed_at / id / after-image cols). Ride-sharing tracked kinds:
#     actor (status — the trip lifecycle changelog, this bundle's headline
#     shape), journey_instance (current_state), resource (allocated).
#   - untracked dimension kinds -> REFERENCE tables (entity: riders + zones).
#   - untracked fact kinds -> TRANSACTION tables.
#   - membership__resource__holders -> a JUNCTION (interval) table: which trip
#     held which driver, from match through drop-off.
#
# Source is the first mode that REQUIRES a resolved wallclock anchor (change-log
# `changed_at` is a real TIMESTAMP). No rebase block is given, so the anchor
# falls back to the sidecar `runtime` (start 2026-01-05, UTC) — the emit's own
# clock. Uncomment `rebase:` to override origin/zone.
#
# Same two mechanism kinds excluded as base/dimensional (see base.yaml). In
# source, excluding a kind also drops the membership tables it owns:
# excluding `queue` drops membership__queue__waiters, and excluding
# `tick_decision` drops membership__tick_decision__bindings — junctions without
# their owner are not operational. That leaves membership__resource__holders as
# the one surviving junction (driver ⟷ trip holds).

mode: source

source:
  exclude:
    kinds: [tick_decision, queue]

# rebase:
#   base_date: 2026-01-05
#   timezone: America/New_York
