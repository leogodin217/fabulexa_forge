# ExportConfig — SaaS bundle, source mode (operational OLTP tables)
# ============================================================
# `fabulexa-forge export docs/examples/saas/bundle docs/examples/saas/source.yaml <out> --fmt duckdb`
#
# Source mode declares its own output shape: each `tables[]` entry is a
# `state` table (current-state, one row per record) over a `kind:`, or a
# `junction` table over a `membership:` reference; history is opt-in
# through the single polymorphic `events:` log. The mapping this config
# applies, taken from the atlas and `sub_type_columns`:
#
#   actor/company          -> companies
#   actor/user              -> users
#   entity/company_hub      -> accounts
#   entity/sku               -> skus
#   journey_instance         -> lifecycle_instances
#   tick_decision             -> usage_events
#   membership bindings       -> usage_event_skus
#   the event log              -> versions
#
#   TWO "COMPANIES"  as in dimensional.yaml: actor.company (CRM/sales-stage,
#            `companies`) and entity.company_hub (billing/workspace tenant,
#            `accounts`) carry no structural reference to each other. Kept
#            as two separate tables — no join fabricated between them.
#   POLYMORPHIC lifecycle_instances.owner_id (from journey_instance's
#            `prop__actor`) resolves per-row to whichever population the
#            referenced actor record belongs to (source.md § Identity and
#            key election: "reference columns render the target
#            population's elected surface per row") — companies.id
#            (CMP-#####) for a company_lifecycle row, users.id (USR-######)
#            for a user_lifecycle row. `lifecycle_type` is the discriminator
#            telling you which table it lands on; this is a faithful,
#            un-invented polymorphic FK, not a defect. `owner_id` /
#            `lifecycle_type` is the same owner+type shape the `versions`
#            log already uses (item_type / item_id), so one polymorphic
#            idiom runs through the whole schema.
#   SUB-TYPE naming: `sub_types:` narrows a table's ROWS, not its columns —
#            each split table below names its own real columns explicitly
#            (from `sub_type_columns`) so the other sub-type's columns
#            never appear as spurious 100%-NULL fields.
#   EVENTS   split by declared sub-type/kind for domain-named `item_type`
#            values (`company` / `user` / `account` / `sku` /
#            `lifecycle_instance`) instead of the engine's bare kind names.
#            This captures the same user-session activity noted in
#            dimensional.yaml's fact_lifecycle_interval: the
#            `lifecycle_instance` item_type's `current_state` changes carry
#            the active<->using toggle, at true per-event grain.
#   DROPPED  tick_decision's `active` / `deactivated_at` / `updated_at` —
#            a usage event is created once and never deactivated; those
#            columns would be constant/uninformative for every row. Same
#            reason for `decision_type` (constant 'usage_event' — the table
#            name already says it) and for the bindings junction's
#            `elem__role_name` ('sku'), `member__entity__kind` ('entity' —
#            raw engine vocabulary) and `elem__pick_index` (0): the junction
#            binds SKUs and nothing else, so a discriminator carries no
#            information. Also dropped: the junction's `left_sim_time` — a
#            SKU binding is recorded once and never leaves, so the column
#            is always NULL — and entity.prop__attach_weight from
#            `accounts` — a pure simulation arrival-sampling knob (how
#            strongly the account pulls newly-arriving seats), not a
#            business attribute an app database would carry.
#   CONTEXT  usage_events.context arrives from the base layer as JSON
#            ({"volume": ...}) and passes straight through.
#   DESCRIBED per-table `descriptions:` maps (keyed by SOURCE identity, the
#            same vocabulary as `rename`) rewrite the inherited engine-voice
#            prose (surrogate-identity, simulation-time, journey-stage
#            wording) into the plain app-database voice the readme should
#            carry. The `versions` log has no descriptions surface — its
#            columns render undescribed.

mode: source

keys:
  actor: presentation_id
  entity: presentation_id
  journey_instance: record_index
  tick_decision: record_index

source:
  tables:
    - name: companies
      kind: actor
      sub_types: [company]
      columns: [prop__status, created_sim_time, active, deactivated_at, last_mutation_sim_time]
      descriptions:
        presentation_id: Unique company identifier (CMP-#####).
        prop__status: "Lifecycle status: onboarding / active / churned."
        created_sim_time: When the company signed up.
        active: "Soft-delete flag: FALSE once the row has been deleted."
        deactivated_at: When the row was soft-deleted; NULL while live.
        last_mutation_sim_time: "When the row was last written: created, updated, or deleted."

    - name: users
      kind: actor
      sub_types: [user]
      columns:
        [
          prop__status,
          prop__company,
          prop__first_name,
          prop__last_name,
          prop__company_name,
          prop__company_domain,
          prop__email_convention,
          prop__email,
          created_sim_time,
          active,
          deactivated_at,
          last_mutation_sim_time,
        ]
      rename:
        prop__company: account_id
      descriptions:
        presentation_id: Unique user identifier (USR-######).
        prop__status: "Seat lifecycle status: provisioned / active / using / offboarded."
        prop__company: accounts.id of the account this user's seat belongs to.
        created_sim_time: When the user's seat was created.
        active: "Soft-delete flag: FALSE once the row has been deleted (unrelated to `status`)."
        deactivated_at: When the row was soft-deleted; NULL while live.
        last_mutation_sim_time: "When the row was last written: created, updated, or deleted."

    - name: accounts
      kind: entity
      sub_types: [company_hub]
      columns:
        [
          prop__plan,
          prop__seat_price,
          prop__churn_flag,
          prop__engagement_score,
          prop__name,
          prop__domain,
          created_sim_time,
          active,
          deactivated_at,
          last_mutation_sim_time,
        ]
      # engagement_score is a 1-100 score carrying raw float64 noise (15
      # fraction digits) in records AND history. DECIMAL(5,2) out; the
      # elected form also reaches this kind's `versions` audit entries.
      render:
        prop__engagement_score: {decimal: [5, 2]}
      descriptions:
        presentation_id: Unique account identifier (ACC-#####).
        prop__name: Account display name.
        created_sim_time: When the account was created.
        active: "Soft-delete flag: FALSE once the row has been deleted."
        deactivated_at: When the row was soft-deleted; NULL while live.
        last_mutation_sim_time: "When the row was last written: created, updated, or deleted."

    - name: skus
      kind: entity
      sub_types: [sku]
      columns: [prop__popularity, prop__name, created_sim_time, active, deactivated_at, last_mutation_sim_time]
      descriptions:
        presentation_id: Unique SKU identifier (SKU-###).
        prop__name: SKU display name (Core, Analytics, API).
        created_sim_time: When the SKU was added to the catalogue.
        active: "Soft-delete flag: FALSE once the row has been deleted."
        deactivated_at: When the row was soft-deleted; NULL while live.
        last_mutation_sim_time: "When the row was last written: created, updated, or deleted."

    - name: lifecycle_instances
      kind: journey_instance
      columns: [prop__actor, prop__journey_type, prop__current_state, created_sim_time, active, deactivated_at, last_mutation_sim_time]
      rename:
        prop__actor: owner_id
        prop__journey_type: lifecycle_type
        prop__current_state: current_state
      descriptions:
        record_index: Sequential lifecycle id (0-based), ascending in creation order.
        prop__actor: The account (companies.id) or user (users.id) this lifecycle belongs to; `lifecycle_type` says which.
        prop__journey_type: "Which lifecycle this is: company_lifecycle or user_lifecycle."
        prop__current_state: "State the lifecycle currently occupies. Company lifecycles: onboarding / active / churned (`active` = live subscription). User lifecycles: provisioned / active / using / offboarded (`active` = idle seat between sessions)."
        created_sim_time: When the lifecycle started.
        active: "Soft-delete flag: FALSE once the row has been deleted (unrelated to `current_state`)."
        deactivated_at: When the row was soft-deleted; NULL while live.
        last_mutation_sim_time: "When the row was last written: created, updated, or deleted."

    - name: usage_events
      kind: tick_decision
      columns: [prop__journey_instance, prop__context, created_sim_time]
      rename:
        prop__journey_instance: lifecycle_instance_id
        prop__context: context
      # context.volume carries raw float64 noise (16 fraction digits, e.g.
      # 65.38160578755163). Rounded in place to 2dp; other bytes verbatim.
      render:
        prop__context: {json_precision: {volume: 2}}
      descriptions:
        record_index: Sequential event id (0-based), ascending in event order.
        prop__journey_instance: lifecycle_instances.id of the user lifecycle this session was recorded under.
        prop__context: JSON detail of the usage session (e.g. volume).
        created_sim_time: When the usage session occurred.

    - name: usage_event_skus
      membership: {kind: tick_decision, property: bindings}
      columns: [member__entity__id, joined_sim_time]
      rename:
        record_id: usage_event_id
        member__entity__id: sku_id
      descriptions:
        record_id: usage_events.id this link belongs to.
        member__entity__id: The SKU (skus.id) exercised by this usage event.
        joined_sim_time: When the SKU was recorded against the usage event.

  events:
    name: versions
    sources:
      - kind: actor
        sub_types: [company]
        item_type: company
      - kind: actor
        sub_types: [user]
        item_type: user
      - kind: entity
        sub_types: [company_hub]
        item_type: account
      - kind: entity
        sub_types: [sku]
        item_type: sku
      - kind: journey_instance
        item_type: lifecycle_instance
