    status: complete
    name: "The date_ref column mode"
    demo: "docs/sprints/date-dimension/demos/phase_2_date_ref_columns.py"
    steps:
      - kind: source
        summary: "Compile date_ref on every grain (columns/scd), extend the six business rules and _channel_variance, stamp QuerySpec.references in build_query_specs; create the demo"
      - kind: author
        summary: "Author tests/exporters/dimensional/test_date_ref.py (both shapes × grains × SCD-2 × variance) and extend the four existing dimensional test files per the spec's Phase 2 test bullets"
        files:
          - "tests/exporters/dimensional/test_date_ref.py"
          - "tests/exporters/dimensional/test_validation.py"
          - "tests/exporters/dimensional/test_windowing.py"
          - "tests/exporters/dimensional/test_scd2_source_filter.py"
          - "tests/exporters/dimensional/test_provenance.py"
  3:
    status: complete
    name: "The generated calendar, the range guard, and the full export"
    demo: "docs/sprints/date-dimension/demos/phase_3_calendar_and_guard.py"
  4:
    status: complete
    name: "Incremental delivery"
    demo: "docs/sprints/date-dimension/demos/phase_4_incremental.py"
  5:
    status: complete
    name: "Shaped playback"
    demo: "docs/sprints/date-dimension/demos/phase_5_shaped_playback.py"
  6:
