sprint: date-dimension
parent_branch: enable_complex_queries
baseline_sha: 44af2ee11fa260356dcc230b81168c2f22c4dbc3
started: 2026-09-13
current_phase: 6
capabilities:
  - dimensional-exporter: [date_ref column mode, generated dim_date, range guard]
  - export-config: [date_dimension block, DateRefSpec, ColumnDecl.date_ref]
  - temporal-elections: [bare-expression renderer authorities]
  - incremental-driver: [dim_date snapshot per window, per-window range guard]
  - shaped-playback: [dim_date static table, per-ask range guard]
  - companion-artifacts: [manifest v5 calendar + references, pinned calendar prose]
  - recipes: [date-dimension]
gates:
  # Pre-commit is NOT listed here — the implementer and reviewer agents each run
  # `pre-commit run --files <paths>` on the files they touched/reviewed.
  # The orchestrator only gates on tests.
  tests:
    - "make test"
phases:
