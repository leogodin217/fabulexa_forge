          - "tests/exporters/companion/test_manifest.py"
          - "tests/exporters/companion/test_readme.py"
          - "tests/exporters/companion/test_artifacts.py"
          - "tests/exporters/companion/test_paths.py"
          - "tests/exporters/dimensional/test_export_supplements.py"
      - kind: author
        summary: "Author tests/exporters/companion/test_date_dimension.py (manifest v5 fields, pinned prose, origin/unit rules, README section) and extend tests/exporters/test_query_spec.py with forwarding pins"
        files:
          - "tests/exporters/companion/test_date_dimension.py"
          - "tests/exporters/test_query_spec.py"
