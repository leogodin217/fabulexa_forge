    demo: "docs/sprints/date-dimension/demos/phase_6_companions.py"
    steps:
      - kind: source
        summary: "Add TableReport.calendar/references (no default) and forward them at the three report-assembly sites; manifest v5 (_calendar_json, references, version bump); pinned dim_date/date_ref dictionary prose and the unit-None rule; create the demo"
      - kind: migrate
