sprint: supplementary-tables
parent_branch: enable_complex_queries
baseline_sha: 5b150f2fb50af8c88e27188bdf8e0509403dc0c4
started: 2026-09-09
current_phase: 5
capabilities:
  - config-envelope: [SupplementDecl, ExportConfig.supplements, parse-time validators, load_supplements]
  - dimensional-exporter: [compile_supplement_specs, source-is-output gate, export_dimensional supplements]
  - companion-artifacts: ["QuerySpec/TableReport supplement", "manifest tables[].supplement", "manifest_format_version 3"]
  - incremental-export: [snapshot delivery, fingerprint supplements map + exclusions, windowed gate]
  - playback-seam: [tables/window/state over the union, supplement-only selection opens no horizon]
  - dataset-distribution: [pack builder loader gate, supplement-file members]
  - recipes: [supplement-tables]
gates:
  tests:
    - "make test"
phases:
  1:
    status: complete
    name: "Declaration and loader"
    demo: "docs/sprints/supplementary-tables/demos/phase_1_declare_and_load.py"
  2:
    status: complete
    name: "Compile, full export, and companions"
    demo: "docs/sprints/supplementary-tables/demos/phase_2_full_export.py"
    steps:
      - kind: source
        summary: "compile_supplement_specs + source-is-output gate; QuerySpec/TableReport.supplement stamped at both report sites; manifest v3 + supplement field; csv_output_paths / companion_artifact_paths; export_dimensional gains required supplements (compile, gate, overlay union, append); CLI _resolve_supplements + dispatch; two ExportErrors; demo"
      - kind: migrate
        tactic: fan-out
        change: "export_dimensional(...) gains required keyword supplements — pass supplements=(); TableReport(...) gains required supplement — pass supplement=None; the manifest_format_version pin reads 3"
        files:
          - "tests/exporters/test_companion_integration.py"
          - "tests/exporters/test_notices.py"
          - "tests/exporters/dimensional/test_export_dimensional.py"
          - "tests/exporters/dimensional/test_rebasing.py"
          - "tests/incremental/test_driver.py"
          - "tests/incremental/test_horizon_acceptance.py"
          - "tests/recipes/test_determinism.py"
          - "tests/recipes/test_recipes.py"
          - "tests/exporters/companion/_fixtures.py"
          - "tests/exporters/companion/test_manifest.py"
          - "tests/exporters/companion/test_readme.py"
          - "tests/exporters/companion/test_artifacts.py"
      - kind: author
        summary: "Unit tests: compile relation/gates/probe order, source-is-output gate, companion_artifact_paths, csv_output_paths, error hierarchy"
        files:
          - "tests/exporters/test_supplements_compile.py"
          - "tests/exporters/companion/test_paths.py"
          - "tests/writers/test_csv.py"
          - "tests/test_errors.py"
      - kind: author
        summary: "End-to-end: full export both fmts, manifest v3 entries, README/overlay slot, refusals leave output empty, CLI exit codes"
        files:
          - "tests/exporters/dimensional/test_export_supplements.py"
          - "tests/test_cli_export.py"
  3:
    status: complete
    name: "Incremental delivery and the fingerprint"
    demo: "docs/sprints/supplementary-tables/demos/phase_3_incremental_drip.py"
    steps:
      - kind: source
        summary: "export_window / export_incremental_next gain required supplements (replace-compile, windowed gate over csv_output_paths + companion + csv_cursor_path + csv_removed_dirs, overlay union); csv_removed_dirs as the CSV path authority; csv_cursor_path; compute_fingerprint gains supplements map + presentation exclusions; CLI leaves wired; demo"
      - kind: migrate
        tactic: fan-out
        change: "export_window(...), export_incremental_next(...), and compute_fingerprint(...) gain required keyword supplements — pass supplements=(); recompute any pinned fingerprint literal"
        files:
          - "tests/exporters/test_notices.py"
          - "tests/exporters/dimensional/test_election_fk.py"
          - "tests/incremental/test_companion_artifacts.py"
          - "tests/incremental/test_driver.py"
          - "tests/incremental/test_fingerprint.py"
          - "tests/incremental/test_horizon_acceptance.py"
      - kind: author
        summary: "Windowed delivery both fmts (incl. empty window, range), csv_removed_dirs / csv_cursor_path, fingerprint inclusion/exclusion + end-to-end mismatch, windowed source-is-output cases, CLI --next / range"
        files:
          - "tests/incremental/test_supplements.py"
          - "tests/incremental/test_cursor.py"
          - "tests/test_cli_export.py"
  4:
    status: complete
    name: "Shaped playback"
    demo: "docs/sprints/supplementary-tables/demos/phase_4_shaped_playback.py"
    steps:
      - kind: source
        summary: "open_shaped_playback gains required supplements; open compiles supplement specs (gates at open); head binds them; tables()/window()/state() over the union, supplements appended as snapshot; supplement-only selection opens no horizon and emits no notice; demo"
      - kind: migrate
        tactic: fan-out
        change: "open_shaped_playback(...) gains required keyword supplements — pass supplements=()"
        files:
          - "tests/exporters/dimensional/test_election_fk.py"
          - "tests/playback/test_shaped_open.py"
          - "tests/playback/test_shaped_selection.py"
          - "tests/playback/test_shaped_state.py"
          - "tests/playback/test_shaped_window.py"
      - kind: author
        summary: "tables() union + snapshot class, state/window identity across T, selection over the union + projection invariance, horizon economy via notice counts, open refusals, open reads no emit data"
        files:
          - "tests/playback/test_shaped_supplements.py"
  5:
    status: pending
    name: "Pack builder and the recipe"
    demo: "docs/sprints/supplementary-tables/demos/phase_5_pack_and_recipe.py"
