tables:
  patient:
    columns:
      [
        patient_key,
        id,
        created_sim_time,
        active,
        deactivated_at,
        prop__status,
        prop__name,
        prop__doctor_id,
        doctor_id_key,
        prop__primary_staff_id,
        primary_staff_id_key,
        prop__backup_staff_id,
        backup_staff_id_key,
      ]
    row_count: 2
    contains_rows:
      # p001's tracked status ends at 3*DAY: 'discharged' — the tape's end,
      # not any of its earlier history values (pending, active).
      - id: p001
        active: true
        deactivated_at: null
        prop__status: discharged
        prop__name: Alice
  doctor:
    columns: [doctor_key, id, created_sim_time, active, deactivated_at, prop__name]
    row_count: 1
  staff:
    columns:
      [
        staff_key,
        id,
        created_sim_time,
        active,
        deactivated_at,
        prop__name,
        prop__staff_type,
      ]
    row_count: 2
  admission:
    columns: [admission_key, id, created_sim_time, active, deactivated_at, prop__ward]
    row_count: 2
    contains_rows:
      # a002 was deactivated@2*DAY (2024-01-03) — visible verbatim at the
      # tape's end, rendered wallclock via the sidecar's runtime anchor
      # (2024-01-01T00:00:00 UTC).
      - id: a002
        active: false
        deactivated_at: 2024-01-03 00:00:00
  queue:
    columns: [queue_key, id, created_sim_time, active, deactivated_at, prop__name]
    row_count: 1
    contains_rows:
      - id: q001
        prop__name: Triage
