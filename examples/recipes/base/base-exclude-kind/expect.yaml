  # proves it: assert_recipe_output's table check fails loudly if it
  # reappears.
  patient:
    columns:
      [
        patient_key,
        id,
        created_sim_time,
        active,
        deactivated_at,
        prop__status,
        prop__name,
        prop__dob,
        prop__doctor_id,
        doctor_id_key,
        prop__primary_staff_id,
        primary_staff_id_key,
        prop__backup_staff_id,
        backup_staff_id_key,
      ]
