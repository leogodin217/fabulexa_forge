# Identical to base-rename-table's expectation — deliberately. The
# description overrides are documentation-inert: they render only in the
# companion README/manifest, and no dataset byte depends on them.
tables:
  patient:
    columns:
      [
        patient_key,
        id,
        created_sim_time,
        active,
        deactivated_at,
        prop__status,
        prop__name,
        prop__dob,
        prop__doctor_id,
        doctor_id_key,
        prop__primary_staff_id,
        primary_staff_id_key,
        prop__backup_staff_id,
        backup_staff_id_key,
      ]
    row_count: 2
  doctor:
    columns: [doctor_key, id, created_sim_time, active, deactivated_at, prop__name]
    row_count: 1
  staff:
    columns:
      [
        staff_key,
        id,
        created_sim_time,
        active,
        deactivated_at,
        prop__name,
        prop__staff_type,
      ]
    row_count: 2
  admission:
    columns:
      [admission_key, id, created_sim_time, active, deactivated_at, prop__ward]
    row_count: 2
  team:
    columns:
      [
        team_key,
        id,
        created_sim_time,
        active,
        deactivated_at,
        prop__name,
        prop__team_type,
        prop__status,
        prop__shift,
      ]
    row_count: 2
  triage_desk:
    columns: [queue_key, id, created_sim_time, active, deactivated_at, prop__name]
    row_count: 1
    contains_rows:
      - id: q001
        prop__name: Triage
