tables:
  patient:
    columns:
      [
        patient_key,
        id,
        created_sim_time,
        active,
        deactivated_at,
        prop__status,
        prop__name,
        prop__doctor_id,
        doctor_id_key,
        prop__primary_staff_id,
        primary_staff_id_key,
        prop__backup_staff_id,
        backup_staff_id_key,
      ]
    row_count: 2
  doctor:
    columns: [doctor_key, id, created_sim_time, active, deactivated_at, prop__name]
    row_count: 1
  staff:
    columns:
      [
        staff_key,
        id,
        created_sim_time,
        active,
        deactivated_at,
        prop__name,
        prop__staff_type,
      ]
    row_count: 2
  admission:
    columns:
      [admission_key, id, created_sim_time, active, deactivated_at, prop__ward]
    row_count: 2
  # The renamed table — `queue` no longer appears; `triage_desk` does, with
  # the author-verbatim table name and its output columns unchanged. The self
  # key column name derives from the kind (`queue`), not the renamed table
  # name — `rename` only overrides `table`/`columns`, and this recipe's
  # config renames neither the key column nor any other column.
  triage_desk:
    columns: [queue_key, id, created_sim_time, active, deactivated_at, prop__name]
    row_count: 1
    contains_rows:
      - id: q001
        prop__name: Triage
