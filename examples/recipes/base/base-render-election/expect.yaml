tables:
  patient:
    columns:
      [
        patient_key,
        id,
        created_sim_time,
        active,
        deactivated_at,
        prop__status,
        prop__name,
        prop__dob,
        prop__doctor_id,
        doctor_id_key,
        prop__primary_staff_id,
        primary_staff_id_key,
        prop__backup_staff_id,
        backup_staff_id_key,
      ]
    row_count: 2
    contains_rows:
      # created_sim_time is DATE (elected), not the default TIMESTAMP;
      # prop__dob is DATE (parsed), not plain VARCHAR text.
      - id: p001
        created_sim_time: 2024-01-02
        prop__name: Alice
        prop__dob: 1990-05-14
      - id: p002
        created_sim_time: 2024-01-03
        prop__name: Bob
        prop__dob: 1985-11-02
  doctor:
    columns: [doctor_key, id, created_sim_time, active, deactivated_at, prop__name]
    row_count: 1
  staff:
    columns:
      [
        staff_key,
        id,
        created_sim_time,
        active,
        deactivated_at,
        prop__name,
        prop__staff_type,
      ]
    row_count: 2
  admission:
    columns: [admission_key, id, created_sim_time, active, deactivated_at, prop__ward]
    row_count: 2
  queue:
    columns: [queue_key, id, created_sim_time, active, deactivated_at, prop__name]
    row_count: 1
  team:
    columns:
      [
        team_key,
        id,
        created_sim_time,
        active,
        deactivated_at,
        prop__name,
        prop__team_type,
        prop__status,
        prop__shift,
      ]
    row_count: 2
