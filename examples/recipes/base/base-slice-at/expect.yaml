tables:
  patient:
    columns:
      [
        patient_key,
        id,
        created_sim_time,
        active,
        deactivated_at,
        prop__status,
        prop__name,
        prop__dob,
        prop__doctor_id,
        doctor_id_key,
        prop__primary_staff_id,
        primary_staff_id_key,
        prop__backup_staff_id,
        backup_staff_id_key,
      ]
    row_count: 2
    contains_rows:
      # At T=2*DAY, p001's reconstructed status is 'active' (the value as of
      # 2*DAY), NOT 'discharged' (which only takes effect at 3*DAY, after
      # this horizon) — the point-in-time capability, author-visible.
      - id: p001
        active: true
        deactivated_at: null
        prop__status: active
        prop__name: Alice
        prop__dob: "1990-05-14"
      - id: p002
        prop__status: pending
  doctor:
    columns: [doctor_key, id, created_sim_time, active, deactivated_at, prop__name]
    row_count: 1
  staff:
    columns:
      [
        staff_key,
        id,
        created_sim_time,
        active,
        deactivated_at,
        prop__name,
        prop__staff_type,
      ]
    row_count: 2
  admission:
    columns: [admission_key, id, created_sim_time, active, deactivated_at, prop__ward]
    row_count: 2
  queue:
    columns: [queue_key, id, created_sim_time, active, deactivated_at, prop__name]
    row_count: 1
  team:
    columns:
      [
        team_key,
        id,
        created_sim_time,
        active,
        deactivated_at,
        prop__name,
        prop__team_type,
        prop__status,
        prop__shift,
      ]
    row_count: 2
    contains_rows:
      # Each tracked property reconstructs at T independently. t001's status
      # is 'active' (changed@2*DAY, inside the horizon) while its shift is
      # still 'day' — the night change lands at 3*DAY, after T, so this row
      # differs from the tape's-end recipe in `shift` alone.
      - id: t001
        prop__status: active
        prop__shift: day
