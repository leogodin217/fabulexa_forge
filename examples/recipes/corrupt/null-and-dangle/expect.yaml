defect_counts:
  missing_value: 1
  dangling_reference: 1

impact_union:
  - C6
  - C10

contains_defects:
  - class: missing_value
    rule: null_actor_name
    impact: [C6]
    location.table: records__actor
    location.column: prop__name

  - class: dangling_reference
    rule: dangle_appointment_doctor
    impact: [C10]
    location.table: membership__actor__appointments
    location.column: member__doctor__id
