      - patient_id: p001
        event_time: 259200000000000    # 3*DAY, discharged
        status_value: discharged
        event_seq: 3
      # p002 has a single event → seq 1
      - patient_id: p002
        event_time: 172800000000000    # 2*DAY, pending
        status_value: pending
