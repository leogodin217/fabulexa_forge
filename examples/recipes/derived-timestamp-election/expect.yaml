tables:
  fact_status_event:
    columns: [patient_id, event_time, status_value, event_ts, event_date, event_tz]
    row_count: 4
    contains_rows:
      # Each row's event_ts (default TIMESTAMP), event_date (DATE), and
      # event_tz (TIMESTAMPTZ) all render the SAME resolved instant — the
      # family identity. Anchor: 2024-01-01T00:00:00 UTC.
      - patient_id: p001
        event_time: 86400000000000     # 1*DAY
        event_ts: 2024-01-02 00:00:00
        event_date: 2024-01-02
        event_tz: 2024-01-02 00:00:00+00:00
      - patient_id: p001
        event_time: 259200000000000    # 3*DAY
        event_ts: 2024-01-04 00:00:00
        event_date: 2024-01-04
        event_tz: 2024-01-04 00:00:00+00:00
      - patient_id: p002
        event_time: 172800000000000    # 2*DAY
        event_ts: 2024-01-03 00:00:00
        event_date: 2024-01-03
        event_tz: 2024-01-03 00:00:00+00:00
