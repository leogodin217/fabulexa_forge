# Recipe: source-changelog-from-history
# ============================================================
# `mode: source` with no `source:` section at all is a valid, complete
# config — a bare full dump of the whole emit, one output table per
# records__<kind> / membership__<K>__<p> in the sidecar.
#
# This recipe's teaching point is the genre trichotomy's first rule:
# TRACKED-NESS DOMINATES. `records__patient` carries a history-tracked
# `prop__status` column, so `patient` exports as the CHANGE-LOG genre
# regardless of its warehouse role (`record_roles.patient == "dimension"`
# in this fixture — a role that would otherwise make it a plain reference
# table). Classifying it as a snapshot would silently drop the base
# layer's recoverable history, so tracked-ness always wins.
#
# Change-log column shape (source.md § The change-log render):
#   op          — c / u / d, verbatim from the row-state-events fold
#   changed_at  — event_sim_time, wallclock TIMESTAMP
#   id          — record_id, verbatim
#   <p>         — each prop__<p> after-image, prefix-stripped, cast back
#                 to its sidecar type
# No created_at / active / deactivated_at / updated_at — those are the
# reference/transaction lifecycle columns; a change-log table's lifecycle
# is reconstructed by the consumer from op/changed_at, not carried.
#
# Fixture world (recipe emit):
#   records__patient — prop__status history_tracked=True; p001 status
#                      pending@1d -> active@2d -> discharged@3d (Alice),
#                      p002 status pending@2d (Bob). Neither is deactivated.
#   Every other kind/membership table in the emit is untracked and exports
#   under its own genre (reference / transaction / junction) — the rest of
#   this bare dump's tables, listed here only because expect.yaml's table
#   check is exact-set (see the reference/transaction/subtype/junction
#   recipes for those genres in isolation).
#
# Output (patient table — 4 rows, the fold's canonical shape):
#   c p001 status=pending (created@1d)     c p002 status=pending (created@2d)
#   u p001 status=active   (changed@2d)    u p001 status=discharged (changed@3d)

mode: source
