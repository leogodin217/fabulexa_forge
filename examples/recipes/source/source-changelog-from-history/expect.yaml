tables:
  # The genre under test: change-log, from a tracked kind (patient).
  patient:
    columns: [op, changed_at, id, status, name, doctor_id, primary_staff_id, backup_staff_id]
    row_count: 4
    contains_rows:
      # p001 create — creation values fold into the `c` after-image
      - op: c
        id: p001
        status: pending
        name: Alice
      # p002 create
      - op: c
        id: p002
        status: pending
        name: Bob
      # p001's two later status changes — one `u` per distinct history sim_time
      - op: u
        id: p001
        status: active
      - op: u
        id: p001
        status: discharged
  # The remaining bare-dump tables (untracked kinds/membership) — declared only
  # because assert_recipe_output's table-set check is exact; see the sibling
  # reference/transaction/subtype/junction recipes for their genres in isolation.
  doctor:
    columns: [id, created_at, active, deactivated_at, updated_at, name]
    row_count: 1
  nurse:
    columns: [id, created_at, active, deactivated_at, updated_at, name]
    row_count: 1
  physician:
    columns: [id, created_at, active, deactivated_at, updated_at, name]
    row_count: 1
  admission:
    columns: [id, created_at, active, deactivated_at, updated_at, ward]
    row_count: 2
  patient_visits:
    columns: [patient_id, joined_at, left_at, slot, doctor_kind, doctor_id]
    row_count: 1
  queue:
    columns: [id, created_at, active, deactivated_at, updated_at, name]
    row_count: 1
  queue_waiters:
    columns: [queue_id, joined_at, left_at, priority, patient_kind, patient_id]
    row_count: 2
