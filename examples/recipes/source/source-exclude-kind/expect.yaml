tables:
  # queue and queue_waiters are ABSENT — declaring the exact remaining set
  # is how this recipe proves it: assert_recipe_output's table check fails
  # loudly if either reappears.
  patient:
    columns: [op, changed_at, id, status, name, doctor_id, primary_staff_id, backup_staff_id]
    row_count: 4
  doctor:
    columns: [id, created_at, active, deactivated_at, updated_at, name]
    row_count: 1
  nurse:
    columns: [id, created_at, active, deactivated_at, updated_at, name]
    row_count: 1
  physician:
    columns: [id, created_at, active, deactivated_at, updated_at, name]
    row_count: 1
  admission:
    columns: [id, created_at, active, deactivated_at, updated_at, ward]
    row_count: 2
  patient_visits:
    columns: [patient_id, joined_at, left_at, slot, doctor_kind, doctor_id]
    row_count: 1
