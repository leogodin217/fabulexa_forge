# Recipe: source-render-election
# ============================================================
# Demonstrates the temporal-rendering election on a declared source table:
# a per-table `render` map elects the rendering of a structural instant
# column (a bare temporal-election literal) and, in the same map, declares
# a payload VARCHAR column a date string in an author format (a
# `date_parse` typed election object) — both re-render the projected
# column IN PLACE (no column is added; the output name stays governed by
# the mode's defaults and `rename`).
#
# `render` keys are source identities (e.g. `created_sim_time`), never
# output names — a bare literal key must name an instant-carrying
# structural column of the table's category (reader-sourced, never a
# hardcoded list); a typed election (`date_parse` here) keys a payload
# source column (`prop__<p>`).
#
# Contrast with source-state-tables, whose created_at is the default
# TIMESTAMP and whose dob (if selected) would pass through as plain
# VARCHAR text.
#
# Fixture world (recipe emit):
#   records__patient — created_sim_time (1*DAY for p001, 2*DAY for p002);
#                      prop__dob (non-tracked ISO date string, minted
#                      upstream): p001 "1990-05-14", p002 "1985-11-02"
#
# Output:
#   patient — 2 rows; created_at is DATE (not TIMESTAMP), dob is DATE
#             (not VARCHAR text)

mode: source

source:
  tables:
    - name: patient
      kind: patient
      columns: [created_sim_time, prop__name, prop__dob]
      render:
        # Elect DATE for the structural created_sim_time instant.
        created_sim_time: date
        # Declare prop__dob a date string in this format, parsed to DATE.
        prop__dob:
          date_parse: "%Y-%m-%d"
