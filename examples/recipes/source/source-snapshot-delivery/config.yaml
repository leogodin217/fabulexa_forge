# Recipe: source-snapshot-delivery
# ============================================================
# `source: {change_delivery: snapshot}` switches every CHANGE-LOG-genre
# kind from the wide CDC table (op / changed_at / id / <p>...) to periodic
# full-table SNAPSHOTS: at each window horizon the table is replaced with
# the state-at derivation — every record's reconstructed state as of the
# window's end. No `op` / `changed_at` / `updated_at` columns; lifecycle
# is carried as created_at / active / deactivated_at instead, and each
# tracked property holds its value AT THE HORIZON, not its change log.
#
# Snapshot delivery REQUIRES A WINDOWED INVOCATION (`fabulexa-forge export`
# with `--next` or `--from/--to`): a full export under `snapshot` raises
# SourceSnapshotRequiresWindows rather than silently degrading to
# current-state-at-slice-end. Each window REPLACES the table (write_mode
# 'replace') — the warehouse holds one snapshot, not an accumulating log.
# The paired recipe test drives one explicit full-range window, the same
# specs the CLI's --from/--to path applies.
#
# Only the tracked kind changes shape (`patient` here — see
# source-changelog-from-history for why tracked-ness dominates); every
# reference / transaction / junction table delivers exactly as it does
# under the default `changelog` delivery.
#
# Fixture world (recipe emit): same as source-changelog-from-history.
# The test's window ends at 4*DAY (2024-01-05), after every event, so:
#   p001 status=discharged (its latest history value), p002 status=pending.
#
# Output (patient table — 2 rows, ONE PER RECORD, the state-at shape):
#   id=p001 created_at=2024-01-02 active=true status=discharged name=Alice
#   id=p002 created_at=2024-01-03 active=true status=pending    name=Bob

mode: source

source:
  change_delivery: snapshot
