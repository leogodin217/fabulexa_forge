tables:
  # The delivery under test: the tracked kind renders the state-at shape —
  # one row per record, tracked props at the horizon — instead of the CDC
  # fold's op/changed_at rows (compare source-changelog-from-history's
  # 4-row patient table over the same fixture).
  patient:
    columns: [id, created_at, active, deactivated_at, status, name, doctor_id, primary_staff_id, backup_staff_id]
    row_count: 2
    contains_rows:
      # p001 at the horizon — status holds the LATEST history value
      - id: p001
        status: discharged
        name: Alice
        active: true
        deactivated_at: null
      # p002 at the horizon — one pending status event, never changed
      - id: p002
        status: pending
        name: Bob
        active: true
        deactivated_at: null
  # The remaining tables deliver exactly as under `changelog` delivery —
  # declared only because assert_recipe_output's table-set check is exact.
  doctor:
    columns: [id, created_at, active, deactivated_at, updated_at, name]
    row_count: 1
  nurse:
    columns: [id, created_at, active, deactivated_at, updated_at, name]
    row_count: 1
  physician:
    columns: [id, created_at, active, deactivated_at, updated_at, name]
    row_count: 1
  admission:
    columns: [id, created_at, active, deactivated_at, updated_at, ward]
    row_count: 2
  patient_visits:
    columns: [patient_id, joined_at, left_at, slot, doctor_kind, doctor_id]
    row_count: 1
  queue:
    columns: [id, created_at, active, deactivated_at, updated_at, name]
    row_count: 1
  queue_waiters:
    columns: [queue_id, joined_at, left_at, priority, patient_kind, patient_id]
    row_count: 2
