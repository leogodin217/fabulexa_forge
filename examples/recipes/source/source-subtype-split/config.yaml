# Recipe: source-subtype-split
# ============================================================
# `sub_types: [...]` on a `kind` table declaration narrows a `state` table
# to a subset of the kind's declared discriminator domain — one table per
# declared sub-type, each filtered by the discriminator predicate
# (source.md § The sub-type split). `staff` here declares two sub-types
# (`nurse` / `physician`); this recipe splits it into two single-sub-type
# tables, one `SourceTableDecl` per sub-type.
#
# Table naming: `name` is author-verbatim — nothing derives it from the
# sub-type value, unlike the old bare-dump default. `nurse` / `physician`
# below are chosen to match the sub-type they narrow to, purely for
# readability.
#
# Column shape: a single-sub-type table's own `prop__staff_type`
# discriminator column is DROPPED — it is constant within the table and
# fully recoverable from the table's identity (its declared `name`).
#
# Fixture world (recipe emit):
#   records__staff — 2 records:
#                    s001 staff_type=nurse "Nora Vega"
#                    s002 staff_type=physician "Owen Reed"
#   enum_domains.staff.staff_type: [nurse, physician]
#
# Output:
#   nurse     — 1 row: s001, no staff_type column
#   physician — 1 row: s002, no staff_type column

mode: source

source:
  tables:
    - name: nurse
      kind: staff
      sub_types: [nurse]
    - name: physician
      kind: staff
      sub_types: [physician]
