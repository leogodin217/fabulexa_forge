# Recipe: streaming / custom-stream-name
# ============================================================
# A stream's `name` is fully author-chosen — the topic-name rule
# (`^[A-Za-z0-9._-]+$`, not `.` or `..`) is the only constraint, so a stream
# never has to carry its kind's or sub-type's bare name.
#
# Here both staff sub-types get their own stream, each renamed under a
# literal `cdc.` prefix — `cdc.nurse` and `cdc.physician` — with no templating
# mechanism involved: the prefix is just the `name` string, verbatim.
#
# Fixture world (recipe emit):
#   records__staff — s001 (nurse), s002 (physician); one `c` each.
#
# Output — custom-named topics, global seq across the run:
#   cdc.nurse.jsonl       c s001  after {name: Nora Vega}
#   cdc.physician.jsonl   c s002  after {name: Owen Reed}

content: state-changes

streams:
  - name: cdc.nurse
    kind: staff
    sub_types: [nurse]
    properties: [name]
  - name: cdc.physician
    kind: staff
    sub_types: [physician]
    properties: [name]
