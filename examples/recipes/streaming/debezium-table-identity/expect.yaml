format: debezium

streams:
  # the stream is declared as cdc.patient — a name distinct from the leaf `patient`
  cdc.patient:
    event_count: 4
    contains_events:
      # table_identity: topic -> source.table is the stream name `cdc.patient`,
      # NOT the leaf route_table `patient` (the default source_table policy)
      - op: c
        after.record_id: p001
        after.prop__status: pending
        source.table: cdc.patient
      - op: u
        after.record_id: p001
        after.prop__status: discharged
        source.table: cdc.patient
