streams:
  # streams[].name is author-chosen; here "{owner_kind}.{property}" per relation
  queue.waiters:
    event_count: 3
    contains_events:
      - seq: 1
        op: join
        kind: queue
        record_id: q001
        after.patient_id: p001
      - seq: 3
        op: join
        record_id: q001
        after.patient_id: p002
      - seq: 4
        op: leave
        record_id: q001
        after.patient_id: p001
  patient.visits:
    event_count: 1
    contains_events:
      # the visits join takes seq 2 — global seq spans both relations
      - seq: 2
        op: join
        kind: patient
        record_id: p001
        after.doctor_id: d001
        after.slot: morning
