streams:
  # The sub-typed kind splits: one topic per staff_type, no routing block needed.
  nurse:
    event_count: 1
    contains_events:
      - seq: 1
        op: c
        kind: staff
        record_id: s001
        after.prop__name: Nora Vega
  physician:
    event_count: 1
    contains_events:
      # global seq continues across topics — physician's `c` is seq 2, not reset to 1
      - seq: 2
        op: c
        kind: staff
        record_id: s002
        after.prop__name: Owen Reed
