# Recipe: streaming / routing-table-identity
# ============================================================
# Choose what the Debezium `source.table` masquerade reports — the leaf source
# table, or the resolved topic name.
#
# `routing.table_identity` (Debezium only; the jsonl format ignores it):
#   source_table  (default) -> source.table = the route_table (the leaf logical
#                              table — here the kind `patient`)
#   topic                    -> source.table = the resolved topic name
#
# This matters when `topic_template` renames topics away from the bare leaf: a
# downstream consumer that keys off `source.table` then sees either the physical
# source table or the logical topic, your choice. The value-schema name
# (<source.name>.<table>.Value) follows the same identity.
#
# Here `topic_template: "cdc.{route_table}"` writes the stream to `cdc.patient`,
# while the leaf route_table stays `patient`. With `table_identity: topic`,
# `source.table` reports `cdc.patient`; the default `source_table` would report
# `patient`. (A topic that merged more than one source table would have no
# unambiguous schema and is rejected when schemas are enabled — here `cdc.patient`
# carries one kind, so it is fine.)
#
# Fixture world (recipe emit):
#   records__patient — p001 status pending@1d -> active@2d -> discharged@3d
#                      p002 status pending@2d
#
# Output — one `cdc.patient.jsonl` stream; every message's source.table is the
# topic `cdc.patient`, not the leaf `patient`.

content: state-changes

routing:
  topic_template: "cdc.{route_table}"   # rename the topic away from the leaf
  table_identity: topic                 # source.table follows the topic name

debezium:
  schemas_enable: true
  source:
    connector: postgres
    name: hospital
    db: hospital
    schema: public
    version: 2.5.0.Final

kinds:
  - kind: patient
    properties: [status]

rebase:
  base_date: 2024-01-01T00:00:00
  timezone: UTC
