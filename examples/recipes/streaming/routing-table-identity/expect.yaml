format: debezium

streams:
  # topic_template renamed the leaf `patient` to `cdc.patient`
  cdc.patient:
    event_count: 4
    contains_events:
      # table_identity: topic -> source.table is the topic `cdc.patient`,
      # NOT the leaf route_table `patient` (the default source_table policy)
      - op: c
        after.record_id: p001
        after.prop__status: pending
        source.table: cdc.patient
      - op: u
        after.record_id: p001
        after.prop__status: discharged
        source.table: cdc.patient
