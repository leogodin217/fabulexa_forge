streams:
  patient:
    event_count: 4
    contains_events:
      # create — the creation-seed status folds into the `c` after-image
      - seq: 1
        op: c
        record_id: p001
        after.status: pending
        after.name: Alice
      - seq: 2
        op: c
        record_id: p002
        after.status: pending
        after.name: Bob
      # updates — one per distinct history timestamp after creation (p001 only)
      - seq: 3
        op: u
        record_id: p001
        after.status: active
      - seq: 4
        op: u
        record_id: p001
        after.status: discharged
      # type-1 `name` rides every event at the current value — never spawns a `u`
      - op: u
        record_id: p001
        after.name: Alice
