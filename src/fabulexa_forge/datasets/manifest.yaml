# The authored allowlist of published datasets (docs/architecture/datasets.md).
# Entry order is authored order and is preserved everywhere. The stamped
# fields (sha256, size_bytes, base_format_version) are builder-supplied:
# run `uv run python tools/build_dataset_pack.py <name> --out <dir>` and
# paste the printed fragment — never hand-type them.
datasets:
  - name: nhs
    description: >-
      An acute NHS hospital trust — emergency and elective patients flowing
      from one arrivals stream through A&E, wards, clinics, diagnostics and
      surgical pathways, competing for consultants, beds and theatres under
      seasonal demand pressure.
    url: https://github.com/leogodin217/fabulexa_forge/releases/download/datasets-v3/nhs.tar.gz
    sha256: d3e82872fb85374fb06a6a6e705a923acc6b864f0dbb9cfb2601b0da62dba183
    size_bytes: 11196341
    base_format_version: 12
    configs: [dimensional.yaml, source.yaml, base.yaml, stream.yaml]
    commands:
      - fabulexa-forge export {dir}/bundle {dir}/dimensional.yaml nhs-star.duckdb --fmt duckdb
      - fabulexa-forge export {dir}/bundle {dir}/source.yaml nhs-app.duckdb --fmt duckdb
      - fabulexa-forge export {dir}/bundle {dir}/base.yaml nhs-base.duckdb --fmt duckdb
      - fabulexa-forge stream {dir}/bundle {dir}/stream.yaml --fmt jsonl --sink stdout
  - name: retail
    description: >-
      TechMart Electronics, a three-year online consumer-electronics retailer
      — customers, a popularity-weighted product catalog, storefront
      infrastructure, and funnel-grain customer actions shaped by a seasonal
      calendar of peaks and outages.
    url: https://github.com/leogodin217/fabulexa_forge/releases/download/datasets-v3/retail.tar.gz
    sha256: 3d5982ce184c326f81640cc41be2137ace1ce444ca57cc0b7b8e40174479d8fd
    size_bytes: 10797088
    base_format_version: 12
    configs: [dimensional.yaml, source.yaml, base.yaml, stream.yaml]
    commands:
      - fabulexa-forge export {dir}/bundle {dir}/dimensional.yaml retail-star.duckdb --fmt duckdb
      - fabulexa-forge export {dir}/bundle {dir}/source.yaml retail-app.duckdb --fmt duckdb
      - fabulexa-forge export {dir}/bundle {dir}/base.yaml retail-base.duckdb --fmt duckdb
      - fabulexa-forge stream {dir}/bundle {dir}/stream.yaml --fmt jsonl --sink stdout
  - name: saas-billing
    description: >-
      A B2B SaaS vendor's billing warehouse over five years — accounts on plan
      tiers with negotiated seat prices and usage discounts, seat holders
      cycling between use and idleness, a metered usage firehose rated
      through per-SKU tier ladders, promotions and post-renewal credits; the
      facts of a monthly invoice, never the invoice itself.
    url: https://github.com/leogodin217/fabulexa_forge/releases/download/datasets-v3/saas-billing.tar.gz
    sha256: 9b104307fe90177c3546321cce842e7a2fd0f29c5e73eaf14f0f6cd814e3c09d
    size_bytes: 41087559
    base_format_version: 12
    configs: [dimensional.yaml]
    commands:
      - fabulexa-forge export {dir}/bundle {dir}/dimensional.yaml saas-billing-star.duckdb --fmt duckdb
  - name: ride-sharing
    description: >-
      A single-region ride-sharing marketplace over one week — riders, a small
      finite driver fleet, and per-trip lifecycles from request to a completed
      or cancelled outcome, with match-wait emerging from peak demand.
    url: https://github.com/leogodin217/fabulexa_forge/releases/download/datasets-v3/ride-sharing.tar.gz
    sha256: 309b032f9341b6f7ef7be1ca6115984ced955fc63edd37791d84e77302a74a20
    size_bytes: 573339
    base_format_version: 12
    configs: [dimensional.yaml, source.yaml, base.yaml, stream.yaml]
    commands:
      - fabulexa-forge export {dir}/bundle {dir}/dimensional.yaml ride-sharing-star.duckdb --fmt duckdb
      - fabulexa-forge export {dir}/bundle {dir}/source.yaml ride-sharing-app.duckdb --fmt duckdb
      - fabulexa-forge export {dir}/bundle {dir}/base.yaml ride-sharing-base.duckdb --fmt duckdb
      - fabulexa-forge stream {dir}/bundle {dir}/stream.yaml --fmt jsonl --sink stdout
  - name: ride-sharing-marketplace
    description: >-
      A two-sided ride-hailing marketplace across three city zones — riders and
      drivers on one clock, tied by actor-to-actor matching and a surge price
      signal, with waits, supply deserts and loyalty-driven churn emerging from
      the supply/demand balance.
    url: https://github.com/leogodin217/fabulexa_forge/releases/download/datasets-v3/ride-sharing-marketplace.tar.gz
    sha256: 685b071e86f14aa7dcc5a0158923acc96c80cf959ca8be1349295bd526d63511
    size_bytes: 3045024
    base_format_version: 12
    configs: [dimensional.yaml, source.yaml, base.yaml, stream.yaml]
    commands:
      - fabulexa-forge export {dir}/bundle {dir}/dimensional.yaml ride-sharing-marketplace-star.duckdb --fmt duckdb
      - fabulexa-forge export {dir}/bundle {dir}/source.yaml ride-sharing-marketplace-app.duckdb --fmt duckdb
      - fabulexa-forge export {dir}/bundle {dir}/base.yaml ride-sharing-marketplace-base.duckdb --fmt duckdb
      - fabulexa-forge stream {dir}/bundle {dir}/stream.yaml --fmt jsonl --sink stdout
  - name: security-logs
    description: >-
      A 90-day SIEM log corpus of correlated firewall and authentication
      records over a segmented network — role-driven benign traffic against a
      42-server estate, with a staged intrusion unfolding after a 30-day clean
      baseline.
    url: https://github.com/leogodin217/fabulexa_forge/releases/download/datasets-v3/security-logs.tar.gz
    sha256: facf293fd03eee7cf1d329a6f1720c5d2ec8ea85dfdb82439179b283e5778373
    size_bytes: 21158275
    base_format_version: 12
    configs: [dimensional.yaml, source.yaml, base.yaml, stream.yaml]
    commands:
